<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MJ Pro - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6">
    <h1 class="text-2xl font-bold mb-6">Admin Panel</h1>
    
    <div class="bg-gray-800 p-4 rounded mb-8 border border-blue-500">
        <h2 class="font-bold mb-4">Add New Task</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="text" id="t-title" placeholder="Task Title" class="bg-gray-700 p-2 rounded">
            <input type="number" id="t-reward" placeholder="Reward (e.g. 0.05)" class="bg-gray-700 p-2 rounded">
            <input type="text" id="t-type" placeholder="Type (YouTube, etc)" class="bg-gray-700 p-2 rounded">
            <input type="text" id="t-proof" placeholder="Proof Required" class="bg-gray-700 p-2 rounded">
            <textarea id="t-desc" placeholder="Instructions" class="bg-gray-700 p-2 rounded md:col-span-2"></textarea>
        </div>
        <button id="add-task-btn" class="mt-4 bg-blue-600 px-6 py-2 rounded">Create Task</button>
    </div>

    <h2 class="text-xl font-bold mb-4 text-yellow-400">Pending Submissions</h2>
    <div id="admin-subs" class="grid gap-4"></div>

    <script type="module" src="admin.js"></script>
</body>
</html>
