<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div style="background:#2c3e50; color:white; padding:20px;">
        <h2>Admin Dashboard</h2>
        <p>Pending Requests</p>
    </div>
    <div id="reqList" style="padding:10px;"></div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyA-Oa4ZWgGA3TrQFRUrEz3Y8CXkYd4hmyM", authDomain: "microjobs-13730.firebaseapp.com", projectId: "microjobs-13730", storageBucket: "microjobs-13730.firebasestorage.app", messagingSenderId: "288652584372", appId: "1:288652584372:web:331a3867f481ffe91bfee1" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        db.collection("withdraw_requests").where("status", "==", "Pending").onSnapshot(snap => {
            const container = document.getElementById('reqList');
            container.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                container.innerHTML += `<div style="border:1px solid #ddd; padding:10px; margin-bottom:5px; background:white; border-radius:8px;">
                    <p><b>Name:</b> ${d.uName} | <b>Amount:</b> ${d.amount} TK</p>
                    <p><b>Method:</b> ${d.method} | <b>Number:</b> ${d.number}</p>
                    <button onclick="pay('${doc.id}')" style="background:green; color:white; border:none; padding:5px 15px; border-radius:5px;">Mark Paid</button>
                </div>`;
            });
        });

        function pay(id) {
            if(confirm("Confirm payment?")) {
                db.collection("withdraw_requests").doc(id).update({ status: "Paid" });
            }
        }
    </script>
</body>
</html>
