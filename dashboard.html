<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MicroJobs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-card">
        <h2 id="uName">Loading...</h2>
        <div class="balance-container">
            <div><small>Balance</small><h3 id="bal">0.00</h3></div>
            <div><small>Total Earned</small><h3 id="total">0.00</h3></div>
        </div>
    </div>

    <div class="task-grid">
        <button class="task-btn" onclick="task(2.00)">Task 1 (2 TK)</button>
        <button class="task-btn" onclick="task(2.00)">Task 2 (2 TK)</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA-Oa4ZWgGA3TrQFRUrEz3Y8CXkYd4hmyM",
            authDomain: "microjobs-13730.firebaseapp.com",
            projectId: "microjobs-13730",
            storageBucket: "microjobs-13730.firebasestorage.app",
            messagingSenderId: "288652584372",
            appId: "1:288652584372:web:331a3867f481ffe91bfee1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.onAuthStateChanged(user => {
            if (user) {
                db.collection("users").doc(user.uid).onSnapshot(doc => {
                    if(doc.exists){
                        const d = doc.data();
                        document.getElementById('uName').innerText = d.name || "User";
                        document.getElementById('bal').innerText = (d.balance || 0).toFixed(2);
                        document.getElementById('total').innerText = (d.totalEarned || 0).toFixed(2);
                    }
                });
            } else { 
                window.location.replace("index.html"); 
            }
        });

        function task(amount) {
            window.open("https://middayopened.com/rmm8pbwe?key=a42d11bce0966c10bc9b3f909ae44009", "_blank");
            db.collection("users").doc(auth.currentUser.uid).update({
                balance: firebase.firestore.FieldValue.increment(amount),
                totalEarned: firebase.firestore.FieldValue.increment(amount)
            });
        }
    </script>
</body>
</html>
