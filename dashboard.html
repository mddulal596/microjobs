<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Cash - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="header-card">
        <div class="user-info">
            <img id="userImg" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
            <div class="balance-text">
                <p id="userName">User Name</p>
                <h2 id="balanceText">TK. 0.00</h2>
            </div>
        </div>
    </div>

    <div style="text-align:center; margin: 15px 0;">
        <script async="async" data-cfasync="false" src="https://middayopened.com/44ea16fb3bf3a48a9a140ddd4fa5dc93/invoke.js"></script> 
        <div id="container-44ea16fb3bf3a48a9a140ddd4fa5dc93"></div>
    </div>

    <div class="task-grid">
        <div class="card" onclick="completeTask(2.00)"><i class="fas fa-mobile-alt"></i><p>Task 1</p></div>
        <div class="card" onclick="completeTask(1.50)"><i class="fas fa-ban"></i><p>Task 2</p></div>
        <div class="card" onclick="completeTask(3.00)"><i class="fas fa-wind"></i><p>Task 3</p></div>
        <div class="card" onclick="completeTask(2.00)"><i class="fas fa-headset"></i><p>Task 4</p></div>
        <div class="card"><i class="fas fa-user-circle"></i><p>Profile</p></div>
        <div class="card" onclick="logout()"><i class="fas fa-sign-out-alt"></i><p>Logout</p></div>
    </div>

    <script src="https://middayopened.com/52/b6/89/52b68995cb2e8ad52b08380d264d9f49.js"></script>
    <script src="https://middayopened.com/41/1d/87/411d8724fed40c4782765dc176a1d806.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        firebase.initializeApp(firebaseConfig); // index.html এর মত একই config দিন
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ইউজার ডাটা লোড করা
        auth.onAuthStateChanged((user) => {
            if (user) {
                db.collection("users").doc(user.uid).onSnapshot((doc) => {
                    document.getElementById('userName').innerText = doc.data().name;
                    document.getElementById('balanceText').innerText = "TK. " + doc.data().balance.toFixed(2);
                    document.getElementById('userImg').src = user.photoURL;
                });
            } else {
                window.location.href = "index.html";
            }
        });

        // টাস্ক কমপ্লিট করা (Adsterra Direct Link)
        function completeTask(amount) {
            window.open("https://middayopened.com/rmm8pbwe?key=a42d11bce0966c10bc9b3f909ae44009", "_blank");
            const user = auth.currentUser;
            db.collection("users").doc(user.uid).update({
                balance: firebase.firestore.FieldValue.increment(amount)
            });
        }

        function logout() {
            auth.signOut().then(() => window.location.href = "index.html");
        }
    </script>
</body>
</html>
