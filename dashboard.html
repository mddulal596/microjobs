<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MicroJobs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-card">
        <h2 id="uName">Loading...</h2>
        <div class="balance-container">
            <div><small>Balance</small><h3 id="bal">0.00</h3></div>
            <div><small>Total Earned</small><h3 id="total">0.00</h3></div>
        </div>
    </div>

    <div class="task-grid" style="display: flex; flex-wrap: wrap; justify-content: space-around; padding: 10px;">
        <button class="task-btn" onclick="task(2.00)">Task 1 (TK. 2)</button>
        <button class="task-btn" onclick="task(2.00)">Task 2 (TK. 2)</button>
        <button class="task-btn" onclick="task(2.00)">Task 3 (TK. 2)</button>
        <button class="task-btn" onclick="task(2.00)">Task 4 (TK. 2)</button>
    </div>

    <div class="withdraw-card">
        <h3>Withdraw (Min 50 TK)</h3>
        <select id="method"><option>bKash</option><option>Nagad</option><option>Rocket</option></select>
        <input type="number" id="amt" placeholder="Amount">
        <input type="text" id="num" placeholder="Wallet Number">
        <button onclick="withdraw()" class="btn-main" style="background:#27ae60; border:none; color:white; padding:12px; border-radius:8px; width:100%;">Submit Request</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA-Oa4ZWgGA3TrQFRUrEz3Y8CXkYd4hmyM",
            authDomain: "microjobs-13730.firebaseapp.com",
            projectId: "microjobs-13730",
            storageBucket: "microjobs-13730.firebasestorage.app",
            messagingSenderId: "288652584372",
            appId: "1:288652584372:web:331a3867f481ffe91bfee1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.onAuthStateChanged(user => {
            if (user) {
                db.collection("users").doc(user.uid).onSnapshot(doc => {
                    if(doc.exists){
                        const d = doc.data();
                        document.getElementById('uName').innerText = d.name;
                        document.getElementById('bal').innerText = d.balance.toFixed(2);
                        document.getElementById('total').innerText = d.totalEarned.toFixed(2);
                    }
                });
            } else { window.location.href = "index.html"; }
        });

        function task(a) {
            window.open("https://middayopened.com/rmm8pbwe?key=a42d11bce0966c10bc9b3f909ae44009", "_blank");
            db.collection("users").doc(auth.currentUser.uid).update({
                balance: firebase.firestore.FieldValue.increment(a),
                totalEarned: firebase.firestore.FieldValue.increment(a)
            });
        }

        function withdraw() {
            const amount = parseFloat(document.getElementById('amt').value);
            const number = document.getElementById('num').value;
            if (amount < 50) return alert("মিনিমাম ৫০ টাকা লাগবে!");
            
            db.collection("withdraw_requests").add({
                uId: auth.currentUser.uid,
                uName: document.getElementById('uName').innerText,
                amount: amount,
                number: number,
                method: document.getElementById('method').value,
                status: "Pending",
                time: new Date()
            }).then(() => {
                db.collection("users").doc(auth.currentUser.uid).update({
                    balance: firebase.firestore.FieldValue.increment(-amount)
                });
                alert("রিকোয়েস্ট সফল হয়েছে!");
            });
        }
    </script>
</body>
</html>
