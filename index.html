<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroJobs - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h1>MicroJobs 💰</h1>
        <p id="status">লগইন করুন এবং আয় শুরু করুন</p>
        <button onclick="loginWithGoogle()" class="google-btn" id="loginBtn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20px">
            Google দিয়ে লগইন করুন
        </button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA-Oa4ZWgA3TrQFRUrEz3Y8CXkYd4hmyM",
            authDomain: "microjobs-13730.firebaseapp.com",
            projectId: "microjobs-13730",
            storageBucket: "microjobs-13730.appspot.com",
            messagingSenderId: "288652584372",
            appId: "1:288652584372:web:331a3867f481ffe91bfee1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // গুগল লগইন ফাংশন (Redirect Method)
        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithRedirect(provider);
        }

        // রিডাইরেক্ট হয়ে ফিরে আসার পর ডাটা প্রসেস করা
        auth.getRedirectResult().then((result) => {
            if (result.user) {
                const user = result.user;
                const urlParams = new URLSearchParams(window.location.search);
                const referredBy = urlParams.get('ref');

                db.collection("users").doc(user.uid).get().then((doc) => {
                    if (!doc.exists) {
                        db.collection("users").doc(user.uid).set({
                            name: user.displayName,
                            email: user.email,
                            balance: 0,
                            totalEarned: 0,
                            referredBy: referredBy || null
                        }).then(() => {
                            if (referredBy) {
                                db.collection("users").doc(referredBy).update({
                                    balance: firebase.firestore.FieldValue.increment(5.0),
                                    totalEarned: firebase.firestore.FieldValue.increment(5.0)
                                });
                            }
                            window.location.href = "dashboard.html";
                        });
                    } else {
                        window.location.href = "dashboard.html";
                    }
                });
            }
        }).catch((error) => {
            console.error("Error:", error.message);
            document.getElementById('status').innerText = "ভুল হয়েছে: " + error.message;
        });
    </script>
</body>
</html>
