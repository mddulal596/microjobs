<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroJobs - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h1>MicroJobs 💰</h1>
        <p id="status">গুগল দিয়ে লগইন করে আয় শুরু করুন</p>
        <button onclick="login()" class="btn-main" style="background:#4285F4; border:none; color:white; padding:15px; border-radius:10px; width:90%; font-weight:bold; cursor:pointer;">
            Google Login
        </button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA-Oa4ZWgGA3TrQFRUrEz3Y8CXkYd4hmyM",
            authDomain: "microjobs-13730.firebaseapp.com",
            projectId: "microjobs-13730",
            storageBucket: "microjobs-13730.firebasestorage.app",
            messagingSenderId: "288652584372",
            appId: "1:288652584372:web:331a3867f481ffe91bfee1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function login() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithRedirect(provider);
        }

        // রিডাইরেক্ট হয়ে ফেরার পর অটোমেটিক ড্যাশবোর্ডে পাঠানো
        auth.onAuthStateChanged((user) => {
            if (user) {
                const userRef = db.collection("users").doc(user.uid);
                userRef.get().then((doc) => {
                    if (!doc.exists) {
                        userRef.set({
                            name: user.displayName,
                            balance: 0,
                            totalEarned: 0,
                            email: user.email
                        }).then(() => { 
                            window.location.replace("dashboard.html"); 
                        });
                    } else {
                        window.location.replace("dashboard.html");
                    }
                }).catch(err => {
                    console.error("Firestore Error:", err);
                });
            }
        });
    </script>
</body>
</html>
