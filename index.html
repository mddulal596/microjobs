<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroJobs Pro - Earn Money</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" rel="stylesheet">
    <style>
        .glass { background: rgba(31, 41, 55, 0.7); backdrop-filter: blur(10px); }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 pb-20">

    <div id="loader" class="fixed inset-0 bg-gray-900 z-[100] flex items-center justify-center hidden">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
    </div>

    <header class="p-4 border-b border-gray-800 sticky top-0 bg-gray-900 z-40">
        <div class="flex justify-between items-center max-w-lg mx-auto">
            <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">MicroJobs Pro</h1>
            <div class="bg-gray-800 px-3 py-1 rounded-full border border-gray-700">
                <span class="text-emerald-400 font-bold" id="top-balance">$0.00</span>
            </div>
        </div>
    </header>

    <main class="max-w-lg mx-auto p-4">
        
        <section id="page-home" class="page">
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-gradient-to-br from-blue-600 to-blue-800 p-4 rounded-2xl shadow-lg">
                    <p class="text-blue-100 text-xs">Total Earnings</p>
                    <h2 class="text-2xl font-bold" id="stat-balance">$0.00</h2>
                </div>
                <div class="bg-gradient-to-br from-gray-800 to-gray-700 p-4 rounded-2xl border border-gray-600">
                    <p class="text-gray-400 text-xs">Pending Work</p>
                    <h2 class="text-2xl font-bold" id="stat-pending">$0.00</h2>
                </div>
            </div>

            <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
                <i class="fas fa-tasks text-blue-400"></i> New Jobs
            </h3>
            <div id="task-list" class="space-y-4">
                </div>
        </section>

        <section id="page-profile" class="page hidden text-center mt-10">
            <div class="w-20 h-20 bg-blue-500 rounded-full mx-auto mb-4 flex items-center justify-center text-3xl font-bold">U</div>
            <p id="user-email" class="text-gray-400 mb-6">user@example.com</p>
            <button id="logout-btn" class="w-full bg-red-500/10 text-red-500 p-3 rounded-xl border border-red-500/20">Logout</button>
        </section>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-gray-800 px-6 py-3">
        <div class="flex justify-between items-center max-w-lg mx-auto">
            <button onclick="showPage('home')" class="flex flex-col items-center text-blue-500">
                <i class="fas fa-home text-xl"></i>
                <span class="text-[10px] mt-1">Home</span>
            </button>
            <button onclick="showPage('wallet')" class="flex flex-col items-center text-gray-400">
                <i class="fas fa-wallet text-xl"></i>
                <span class="text-[10px] mt-1">Wallet</span>
            </button>
            <button onclick="showPage('profile')" class="flex flex-col items-center text-gray-400">
                <i class="fas fa-user text-xl"></i>
                <span class="text-[10px] mt-1">Account</span>
            </button>
        </div>
    </nav>

    <div id="auth-modal" class="fixed inset-0 bg-gray-900 z-50 flex items-center justify-center p-6 hidden">
        <div class="w-full max-w-md bg-gray-800 p-8 rounded-3xl border border-gray-700 shadow-2xl">
            <h2 class="text-2xl font-bold mb-2">Welcome Back!</h2>
            <p class="text-gray-400 mb-6 text-sm">Sign in to start earning money.</p>
            <input type="email" id="email" placeholder="Email Address" class="w-full bg-gray-700 p-4 rounded-xl mb-3 outline-none focus:ring-2 ring-blue-500">
            <input type="password" id="password" placeholder="Password" class="w-full bg-gray-700 p-4 rounded-xl mb-6 outline-none focus:ring-2 ring-blue-500">
            <button id="login-btn" class="w-full bg-blue-600 p-4 rounded-xl font-bold hover:bg-blue-700 transition">Login</button>
            <button id="signup-btn" class="w-full mt-3 text-gray-400 text-sm">Don't have an account? <span class="text-blue-400">Sign Up</span></button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="app.js"></script>
    <script>
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById('page-' + pageId).classList.remove('hidden');
        }
    </script>
</body>
</html>
