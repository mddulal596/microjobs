<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroJobs - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h1>MicroJobs 💰</h1>
        <p id="statusText">গুগল দিয়ে লগইন করে আয় শুরু করুন</p>
        <button onclick="login()" class="btn-main" style="background:#4285F4;">
            Google Login
        </button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA-Oa4ZWgGA3TrQFRUrEz3Y8CXkYd4hmyM",
            authDomain: "microjobs-13730.firebaseapp.com",
            projectId: "microjobs-13730",
            storageBucket: "microjobs-13730.firebasestorage.app",
            messagingSenderId: "288652584372",
            appId: "1:288652584372:web:331a3867f481ffe91bfee1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function login() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithRedirect(provider);
        }

        auth.getRedirectResult().then((result) => {
            if (result.user) {
                const user = result.user;
                db.collection("users").doc(user.uid).get().then((doc) => {
                    if (!doc.exists) {
                        db.collection("users").doc(user.uid).set({
                            name: user.displayName,
                            balance: 0,
                            totalEarned: 0
                        }).then(() => { window.location.href = "dashboard.html"; });
                    } else {
                        window.location.href = "dashboard.html";
                    }
                });
            }
        });
    </script>
</body>
</html>
