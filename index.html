<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroJobs - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h1>MicroJobs 💰</h1>
        <p>লগইন করুন এবং আয় শুরু করুন</p>
        <button onclick="loginWithGoogle()" class="google-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20px">
            Google দিয়ে লগইন করুন
        </button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA-Oa4ZWgA3TrQFRUrEz3Y8CXkYd4hmyM",
            authDomain: "microjobs-13730.firebaseapp.com",
            projectId: "microjobs-13730",
            storageBucket: "microjobs-13730.appspot.com",
            messagingSenderId: "288652584372",
            appId: "1:288652584372:web:331a3867f481ffe91bfee1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            const urlParams = new URLSearchParams(window.location.search);
            const referredBy = urlParams.get('ref');

            auth.signInWithPopup(provider).then((result) => {
                const user = result.user;
                const userRef = db.collection("users").doc(user.uid);

                userRef.get().then((doc) => {
                    if (!doc.exists) {
                        userRef.set({
                            name: user.displayName,
                            email: user.email,
                            balance: 0,
                            totalEarned: 0,
                            referredBy: referredBy || null
                        }).then(() => {
                            if (referredBy) {
                                db.collection("users").doc(referredBy).update({
                                    balance: firebase.firestore.FieldValue.increment(5.00),
                                    totalEarned: firebase.firestore.FieldValue.increment(5.00)
                                });
                            }
                            window.location.href = "dashboard.html";
                        });
                    } else {
                        window.location.href = "dashboard.html";
                    }
                });
            }).catch(err => alert(err.message));
        }
    </script>
</body>
</html>
