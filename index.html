<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroJobs - Phone Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h1>MicroJobs 💰</h1>
        <p id="status">ফোন নাম্বার দিয়ে লগইন করুন</p>
        
        <div id="phone-box">
            <input type="text" id="phoneNumber" placeholder="+8801XXXXXXXXX" style="width: 80%; padding: 10px; margin-bottom: 10px;">
            <button onclick="sendOTP()" class="btn">Send OTP</button>
        </div>

        <div id="otp-box" style="display:none;">
            <input type="text" id="otpCode" placeholder="Enter 6-digit OTP" style="width: 80%; padding: 10px; margin-bottom: 10px;">
            <button onclick="verifyOTP()" class="btn">Verify & Login</button>
        </div>

        <div id="recaptcha-container"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA-Oa4ZWgA3TrQFRUrEz3Y8CXkYd4hmyM",
            authDomain: "microjobs-13730.firebaseapp.com",
            projectId: "microjobs-13730",
            storageBucket: "microjobs-13730.appspot.com",
            messagingSenderId: "288652584372",
            appId: "1:288652584372:web:331a3867f481ffe91bfee1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
            'size': 'invisible'
        });

        function sendOTP() {
            const number = document.getElementById('phoneNumber').value;
            auth.signInWithPhoneNumber(number, window.recaptchaVerifier)
                .then((confirmationResult) => {
                    window.confirmationResult = confirmationResult;
                    document.getElementById('phone-box').style.display = 'none';
                    document.getElementById('otp-box').style.display = 'block';
                    document.getElementById('status').innerText = "আপনার ফোনে কোড পাঠানো হয়েছে।";
                }).catch((error) => alert(error.message));
        }

        function verifyOTP() {
            const code = document.getElementById('otpCode').value;
            confirmationResult.confirm(code).then((result) => {
                const user = result.user;
                // ডাটাবেস চেক ও সেভ
                db.collection("users").doc(user.uid).get().then((doc) => {
                    if (!doc.exists) {
                        db.collection("users").doc(user.uid).set({
                            phone: user.phoneNumber,
                            balance: 0,
                            totalEarned: 0
                        }).then(() => window.location.href = "dashboard.html");
                    } else {
                        window.location.href = "dashboard.html";
                    }
                });
            }).catch(() => alert("ভুল ওটিপি কোড!"));
        }
    </script>
</body>
</html>
