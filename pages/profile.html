<!DOCTYPE html>
<html lang="en" class="transform-gpu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 antialiased transform-gpu">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-16">
        
        <!-- Top Header & Balances -->
        <header class="p-4 bg-indigo-600 text-white rounded-b-3xl shadow-md">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-base font-extrabold tracking-wide">My Profile</h1>
                <div class="flex items-center gap-2">
                    <span id="userName" class="text-xs bg-indigo-700/80 px-3 py-1.5 rounded-xl font-medium tracking-wide shadow-inner">Loading...</span>
                    <button id="logoutBtn" class="text-xs bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded-xl font-semibold shadow-sm transition">Logout</button>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3 mt-2">
                <div class="bg-indigo-700/50 p-3 rounded-2xl backdrop-blur-sm border border-indigo-500/30">
                    <p class="text-[11px] text-indigo-200 font-medium">Main Balance</p>
                    <h2 id="mainBalance" class="text-lg font-extrabold mt-1">৳ 0.00</h2>
                </div>
                <div class="bg-indigo-700/50 p-3 rounded-2xl backdrop-blur-sm border border-indigo-500/30">
                    <p class="text-[11px] text-indigo-200 font-medium">Deposit Balance</p>
                    <h2 id="depositBalance" class="text-lg font-extrabold mt-1">৳ 0.00</h2>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="p-4 flex-grow space-y-4 overflow-y-auto">
            <!-- Profile Info Card -->
            <div class="bg-gray-50 border border-gray-200 p-4 rounded-2xl space-y-3 shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-xl font-bold shadow-inner">
                        👤
                    </div>
                    <div>
                        <h3 id="profileName" class="text-sm font-bold text-gray-800">Loading...</h3>
                        <p id="profileEmail" class="text-xs text-gray-500">Loading...</p>
                    </div>
                </div>
                <div class="pt-2 border-t border-gray-200 text-xs space-y-2">
                    <div class="flex justify-between">
                        <span class="text-gray-500">Account Status:</span>
                        <span class="font-bold text-amber-600">Standard User</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-500">Member Since:</span>
                        <span id="joinDate" class="font-medium text-gray-700">Recent</span>
                    </div>
                </div>
            </div>

            <!-- Support & Info Links -->
            <div class="space-y-2">
                <a href="https://t.me/microjobspro" target="_blank" class="flex items-center justify-between p-3.5 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-2xl text-xs font-semibold text-gray-700 transition shadow-sm">
                    <div class="flex items-center gap-2.5">
                        <span class="text-base">🎧</span>
                        <span>Customer Support (Telegram)</span>
                    </div>
                    <span>&rarr;</span>
                </a>
                <a href="history.html" class="flex items-center justify-between p-3.5 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-2xl text-xs font-semibold text-gray-700 transition shadow-sm">
                    <div class="flex items-center gap-2.5">
                        <span class="text-base">🕒</span>
                        <span>Transaction History</span>
                    </div>
                    <span>&rarr;</span>
                </a>
            </div>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-2 bg-white border-t border-gray-200 shadow-lg flex justify-around items-center">
            <a href="https://t.me/microjobspro" target="_blank" class="flex flex-col items-center text-gray-500 hover:text-indigo-600 text-[10px]">
                <span class="text-lg">🎧</span>
                <span>Help</span>
            </a>
            <a href="deposit.html" class="flex flex-col items-center text-gray-500 hover:text-indigo-600 text-[10px]">
                <span class="text-lg">👛</span>
                <span>Wallet</span>
            </a>
            <a href="dashboard.html" class="flex flex-col items-center text-gray-500 hover:text-indigo-600 text-[10px]">
                <div class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 text-base">
                    🏠
                </div>
                <span class="font-medium mt-0.5">Home</span>
            </a>
            <a href="referral.html" class="flex flex-col items-center text-gray-500 hover:text-indigo-600 text-[10px]">
                <span class="text-lg">👥</span>
                <span>Team</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center text-indigo-600 text-[10px] -mt-4">
                <div class="w-12 h-12 bg-indigo-600 rounded-full flex items-center justify-center text-white shadow-lg border-4 border-white text-lg">
                    👤
                </div>
                <span class="font-bold mt-0.5">Profile</span>
            </a>
        </nav>
    </div>

    <!-- Firebase Script & Logic -->
    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { observeAuthState, logoutUser } from '../firebase/auth.js';

        observeAuthState((userData) => {
            if (userData) {
                const name = userData.displayName || "User";
                const email = userData.email || "No email provided";
                
                document.getElementById('userName').innerText = name;
                document.getElementById('profileName').innerText = name;
                document.getElementById('profileEmail').innerText = email;

                const mainBal = userData.balances?.main ?? userData.mainBalance ?? 0;
                const depositBal = userData.balances?.deposit ?? userData.depositBalance ?? 0;
                document.getElementById('mainBalance').innerText = `৳ ${Number(mainBal).toFixed(2)}`;
                document.getElementById('depositBalance').innerText = `৳ ${Number(depositBal).toFixed(2)}`;
            } else {
                window.location.href = 'login.html';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await logoutUser();
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
