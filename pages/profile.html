<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0B0F19',
                        cardbg: '#111827',
                        primary: '#3B82F6',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col">
    
    <!-- Sidebar Overlay -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden"></div>

    <!-- Sidebar Menu -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-cardbg border-r border-slate-800/80 flex flex-col justify-between transform -translate-x-full transition-transform duration-300 shrink-0 shadow-2xl">
        <div class="p-6">
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-black bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500 bg-clip-text text-transparent">MicroJobPro</h1>
                <button id="closeSidebar" class="text-slate-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <nav class="mt-8 space-y-2">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800/60 hover:text-white rounded-xl font-semibold transition-all">Dashboard</a>
                <a href="tasks.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800/60 hover:text-white rounded-xl font-semibold transition-all">Tasks Marketplace</a>
                <a href="post-task.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800/60 hover:text-white rounded-xl font-semibold transition-all">Post New Job</a>
                <a href="wallet.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800/60 hover:text-white rounded-xl font-semibold transition-all">Wallet</a>
                <a href="withdraw.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800/60 hover:text-white rounded-xl font-semibold transition-all">Withdraw</a>
                <a href="referral.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800/60 hover:text-white rounded-xl font-semibold transition-all">Referrals</a>
            </nav>
        </div>
        <div class="p-6 border-t border-slate-800/80">
            <button id="logoutBtnSidebar" class="w-full bg-red-500/10 text-red-400 hover:bg-red-600 hover:text-white py-3 rounded-xl font-bold transition-all shadow-sm">Logout</button>
        </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="flex-1 flex flex-col min-w-0 w-full">
        <!-- Header -->
        <header class="h-20 bg-cardbg/80 backdrop-blur-md border-b border-slate-800/80 px-4 md:px-8 flex items-center justify-between sticky top-0 z-30 gap-4 shadow-md">
            <div class="flex items-center gap-3">
                <button id="menuBtn" class="p-2.5 bg-slate-800/70 hover:bg-slate-700 text-slate-200 rounded-xl transition-all shadow-sm shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <a href="dashboard.html" class="text-sm font-bold text-blue-400 hover:underline flex items-center gap-1">
                    &larr; Back to Dashboard
                </a>
            </div>
            
            <div class="flex items-center gap-3 shrink-0">
                <img id="userAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces" alt="Profile" class="w-10 h-10 rounded-full object-cover border-2 border-blue-500/40 shadow-md">
                <div class="hidden sm:block text-left">
                    <p id="userName" class="text-sm font-bold text-white">Loading...</p>
                    <p id="userEmail" class="text-xs text-slate-400">Loading...</p>
                </div>
            </div>
        </header>

        <!-- Main Profile Section -->
        <main class="flex-1 p-4 md:p-8 max-w-3xl w-full mx-auto space-y-6">
            
            <!-- Profile Info Card -->
            <div class="bg-cardbg border border-slate-800/80 rounded-3xl p-6 md:p-8 shadow-2xl space-y-6">
                <div class="flex flex-col sm:flex-row items-center gap-5 border-b border-slate-800/80 pb-6 text-center sm:text-left">
                    <img id="profileUserAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces" alt="Avatar" class="w-20 h-20 rounded-full object-cover border-2 border-blue-500/50 shadow-md">
                    <div class="space-y-1">
                        <h2 id="profileUserName" class="text-xl font-bold text-white">Loading...</h2>
                        <p id="profileUserEmail" class="text-xs text-slate-400">Loading...</p>
                        <span id="profileRefCodeDisplay" class="inline-block mt-2 text-[10px] font-black bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2.5 py-1 rounded-md tracking-wider">Ref: MCJ-----</span>
                    </div>
                </div>

                <!-- Stats Grid -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-slate-900/60 p-4 border border-slate-800 rounded-2xl space-y-1">
                        <span class="text-[10px] uppercase font-bold text-slate-400">Completed Tasks</span>
                        <h4 id="profileCompletedTasks" class="text-2xl font-black text-emerald-400">0</h4>
                    </div>
                    <div class="bg-slate-900/60 p-4 border border-slate-800 rounded-2xl space-y-1">
                        <span class="text-[10px] uppercase font-bold text-slate-400">Pending Tasks</span>
                        <h4 id="profilePendingTasks" class="text-2xl font-black text-amber-400">0</h4>
                    </div>
                </div>

                <!-- Referral Section -->
                <div id="referralInputSection" class="bg-slate-900/60 p-5 border border-slate-800 rounded-2xl space-y-3">
                    <label class="text-xs font-bold text-slate-300 uppercase tracking-wider block">Have a Referral Code?</label>
                    <div class="flex gap-2">
                        <input type="text" id="profileRefInput" placeholder="Enter code (e.g. MCJ587)" class="flex-1 px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white uppercase focus:outline-none focus:border-blue-500">
                        <button id="applyRefBtn" class="px-5 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl transition-all shadow-md">Apply</button>
                    </div>
                    <p id="refMsg" class="text-xs font-medium hidden"></p>
                </div>

                <button id="profileLogoutBtn" class="w-full py-3.5 bg-red-500/10 text-red-400 hover:bg-red-600 hover:text-white rounded-xl font-bold text-xs transition-all shadow-sm">
                    Logout Account
                </button>
            </div>

        </main>

        <!-- Footer -->
        <footer class="bg-cardbg border-t border-slate-800/80 py-6 px-8 mt-auto">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4 text-xs text-slate-400">
                <p>&copy; 2026 MicroJobPro. All rights reserved.</p>
                <div class="flex items-center gap-6 font-medium">
                    <a href="#" class="hover:text-white transition-all">Privacy Policy</a>
                    <a href="#" class="hover:text-white transition-all">Terms of Service</a>
                    <a href="#" class="hover:text-white transition-all">Support</a>
                </div>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script type="module">
        import { observeAuthState, logoutUser } from '../firebase/auth.js';
        import { db } from '../firebase/firebase-config.js';
        import { doc, getDoc, updateDoc, increment, collection, query, where, getDocs, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const menuBtn = document.getElementById('menuBtn');
        const closeSidebar = document.getElementById('closeSidebar');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            sidebarOverlay.classList.toggle('hidden');
        }

        menuBtn.addEventListener('click', toggleSidebar);
        closeSidebar.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);

        let activeUser = null;

        observeAuthState(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            activeUser = user;

            try {
                let fullName = user.displayName || user.email.split('@')[0] || 'User';
                const email = user.email || 'No email available';
                const photoURL = user.photoURL || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces';

                const userDocRef = doc(db, "users", user.uid);
                const userDocSnap = await getDoc(userDocRef);
                
                let userData = {};
                if (userDocSnap.exists()) {
                    userData = userDocSnap.data();
                    fullName = userData.fullName || fullName;
                } else {
                    const myReferralCode = `MCJ${user.uid.substring(0, 5).toUpperCase()}`;
                    userData = {
                        uid: user.uid,
                        fullName: fullName,
                        email: email,
                        referralCode: myReferralCode,
                        referredBy: null,
                        mainBalance: 0,
                        depositBalance: 0,
                        createdAt: new Date().toISOString()
                    };
                    await setDoc(userDocRef, userData);
                }

                document.getElementById('userName').innerText = fullName;
                document.getElementById('userEmail').innerText = email;
                document.getElementById('userAvatar').src = photoURL;

                document.getElementById('profileUserName').innerText = fullName;
                document.getElementById('profileUserEmail').innerText = email;
                document.getElementById('profileUserAvatar').src = photoURL;
                document.getElementById('profileRefCodeDisplay').innerText = `Ref: ${userData.referralCode || 'MCJ-----'}`;

                const refSection = document.getElementById('referralInputSection');
                if (userData.referredBy) {
                    refSection.innerHTML = `<p class="text-xs text-emerald-400 font-bold text-center">✓ Referral code already applied!</p>`;
                }

                const submissionsQuery = query(collection(db, "submissions"), where("workerId", "==", user.uid));
                const submissionsSnapshot = await getDocs(submissionsQuery);

                let pendingCount = 0;
                let approvedCount = 0;

                if (!submissionsSnapshot.empty) {
                    submissionsSnapshot.forEach((docSnap) => {
                        const subData = docSnap.data();
                        if (subData.status === 'pending') {
                            pendingCount++;
                        } else if (subData.status === 'approved') {
                            approvedCount++;
                        }
                    });
                }

                document.getElementById('profilePendingTasks').innerText = pendingCount;
                document.getElementById('profileCompletedTasks').innerText = approvedCount;

            } catch (error) {
                console.error("Error loading profile data:", error);
            }
        });

        // Apply Referral Code Logic
        const applyRefBtn = document.getElementById('applyRefBtn');
        if (applyRefBtn) {
            applyRefBtn.addEventListener('click', async () => {
                const codeInput = document.getElementById('profileRefInput').value.trim().toUpperCase();
                const refMsg = document.getElementById('refMsg');

                if (!activeUser) return;

                if (!codeInput) {
                    refMsg.innerText = "Please enter a referral code.";
                    refMsg.className = "text-xs font-bold text-red-400 block";
                    refMsg.classList.remove('hidden');
                    return;
                }

                try {
                    const userDocRef = doc(db, "users", activeUser.uid);
                    const userSnap = await getDoc(userDocRef);
                    const myData = userSnap.data();

                    if (myData.referralCode === codeInput) {
                        refMsg.innerText = "You cannot use your own referral code!";
                        refMsg.className = "text-xs font-bold text-red-400 block";
                        refMsg.classList.remove('hidden');
                        return;
                    }

                    const q = query(collection(db, "users"), where("referralCode", "==", codeInput));
                    const querySnapshot = await getDocs(q);

                    if (querySnapshot.empty) {
                        refMsg.innerText = "Invalid referral code!";
                        refMsg.className = "text-xs font-bold text-red-400 block";
                        refMsg.classList.remove('hidden');
                        return;
                    }

                    const referrerDoc = querySnapshot.docs[0];
                    const referrerUid = referrerDoc.id;

                    await updateDoc(userDocRef, { referredBy: referrerUid });
                    await updateDoc(doc(db, "users", referrerUid), { totalReferred: increment(1) });

                    refMsg.innerText = "Referral code applied successfully!";
                    refMsg.className = "text-xs font-bold text-emerald-400 block";
                    refMsg.classList.remove('hidden');

                    setTimeout(() => { location.reload(); }, 1500);

                } catch (error) {
                    console.error(error);
                    refMsg.innerText = "Something went wrong. Try again.";
                    refMsg.className = "text-xs font-bold text-red-400 block";
                    refMsg.classList.remove('hidden');
                }
            });
        }

        document.getElementById('logoutBtnSidebar').addEventListener('click', async () => {
            await logoutUser();
            window.location.href = 'login.html';
        });

        document.getElementById('profileLogoutBtn').addEventListener('click', async () => {
            await logoutUser();
            window.location.href = 'login.html';
        });
    </script>
</body>
  </html>
