<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - Micro Job Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>  
    
    <style>
        /* Animated Bottom Nav Styles */
        .nav-container {  
            position: fixed;  
            bottom: 15px;  
            left: 50%;
            transform: translateX(-50%);
            width: 92%;  
            max-width: 440px;  
            height: 70px;  
            background: #4f46e5;  
            border-radius: 22px;  
            display: flex;  
            justify-content: space-around;  
            align-items: center;  
            box-shadow: 0 10px 25px rgba(0,0,0,.2);  
            overflow: visible;  
            z-index: 100;
        }  
          
        .nav-item-animated {  
            flex: 1;  
            text-decoration: none;  
            color: #fff;  
            text-align: center;  
            position: relative;  
            z-index: 2;  
        }  
          
        .nav-item-animated i {  
            font-size: 22px;  
            transition: .35s;  
        }  
          
        .nav-item-animated span {  
            display: block;  
            font-size: 11px;  
            margin-top: 4px;  
            transition: .35s;  
        }  
          
        .nav-item-animated.active i {  
            transform: translateY(-10px);  
        }  
          
        .nav-item-animated.active span {  
            font-weight: bold;  
        }  
          
        .indicator {  
            position: absolute;  
            top: -15px;  
            width: 60px;  
            height: 60px;  
            background: #312e81;  
            border-radius: 50%;  
            border: 4px solid #fff;  
            transition: left .35s ease;  
            box-shadow: 0 0 20px rgba(49,46,129,.5);  
            z-index: 1;  
        }  
          
        .indicator::before {  
            content: "";  
            position: absolute;  
            inset: -6px;  
            border-radius: 50%;  
            border: 2px solid rgba(49,46,129,.4);  
            animation: pulse 2s infinite;  
        }  
          
        @keyframes pulse {  
            0% { transform: scale(1); opacity: 1; }  
            100% { transform: scale(1.4); opacity: 0; }  
        } 
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-28">
        
        <!-- Profile Header -->
        <header class="p-5 bg-gradient-to-r from-purple-600 to-indigo-700 text-white rounded-b-3xl shadow-lg text-center relative">
            <div class="flex justify-between items-center mb-4">
                <a href="dashboard.html" class="text-xs bg-white/20 hover:bg-white/35 transition px-3 py-1.5 rounded-full font-semibold flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-left"></i> Back
                </a>
                <span class="text-xs font-bold tracking-wider uppercase text-purple-200">Account Profile</span>
                <div class="w-12"></div> <!-- Spacer for alignment -->
            </div>

            <!-- Profile Picture -->
            <div class="flex flex-col items-center mt-2">
                <div class="w-20 h-20 rounded-full border-4 border-white/30 overflow-hidden bg-white text-purple-700 flex items-center justify-center font-extrabold text-2xl shadow-xl">
                    <span id="profileInitial">U</span>
                    <img id="profileImage" src="" alt="" class="w-full h-full object-cover hidden">
                </div>
                <h2 id="userNameDisplay" class="text-lg font-bold mt-2">Loading...</h2>
                <p id="userEmailDisplay" class="text-xs text-purple-200">loading@gmail.com</p>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="p-4 flex-grow">
            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3 px-1">Account Actions</h2>
            
            <div class="flex flex-col gap-2.5">
                <!-- Account Status -->
                <div id="accountStatusBox" class="p-3.5 bg-amber-50 border border-amber-200 rounded-2xl flex justify-between items-center shadow-sm">
                    <div class="flex items-center gap-3">
                        <span class="text-xl">⭐</span>
                        <div>
                            <h4 class="text-xs font-bold text-amber-900">Membership Status</h4>
                            <p id="statusText" class="text-[11px] text-amber-700">Checking status...</p>
                        </div>
                    </div>
                    <a id="activateBtn" href="activate-account.html" class="hidden bg-amber-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow hover:bg-amber-700 transition">Activate</a>
                </div>

                <!-- First Row: Wallet & Referral (Side by Side) -->
                <div class="grid grid-cols-2 gap-2.5">
                    <a href="wallet.html" class="p-3.5 bg-purple-50/60 border border-purple-100 rounded-2xl flex flex-col items-center text-center justify-center hover:bg-purple-100 transition shadow-sm gap-1.5">
                        <span class="text-2xl">💳</span>
                        <span class="text-xs font-bold text-purple-900 leading-tight">My Wallet & Balances</span>
                    </a>

                    <a href="referral.html" class="p-3.5 bg-indigo-50/60 border border-indigo-100 rounded-2xl flex flex-col items-center text-center justify-center hover:bg-indigo-100 transition shadow-sm gap-1.5">
                        <span class="text-2xl">👥</span>
                        <span class="text-xs font-bold text-indigo-900 leading-tight">Referral Team</span>
                    </a>
                </div>

                <!-- Second Row: Task History & Support (Side by Side) -->
                <div class="grid grid-cols-2 gap-2.5">
                    <a href="history.html" class="p-3.5 bg-rose-50/60 border border-rose-100 rounded-2xl flex flex-col items-center text-center justify-center hover:bg-rose-100 transition shadow-sm gap-1.5">
                        <span class="text-2xl">📊</span>
                        <span class="text-xs font-bold text-rose-900 leading-tight">Task History</span>
                    </a>

                    <a href="https://t.me/microjobspro" target="_blank" class="p-3.5 bg-sky-50/60 border border-sky-100 rounded-2xl flex flex-col items-center text-center justify-center hover:bg-sky-100 transition shadow-sm gap-1.5">
                        <span class="text-2xl">🎧</span>
                        <span class="text-xs font-bold text-sky-900 leading-tight">Support & Help</span>
                    </a>
                </div>

                <!-- Logout Button -->
                <button id="logoutBtn" class="w-full mt-2 p-3.5 bg-red-50 border border-red-100 rounded-2xl flex items-center justify-center gap-2 hover:bg-red-100 transition shadow-sm text-red-600 font-bold text-xs cursor-pointer">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout Account
                </button>
            </div>
        </main>

        <!-- Animated Bottom Navigation Bar -->
        <div class="nav-container">  
            <div class="indicator"></div>  
            
            <a href="https://t.me/microjobspro" target="_blank" class="nav-item-animated">  
                <i class="fa-solid fa-headset"></i>  
                <span>Help</span>  
            </a>  

            <a href="wallet.html" class="nav-item-animated">  
                <i class="fa-solid fa-wallet"></i>  
                <span>Wallet</span>  
            </a>  
            
            <a href="dashboard.html" class="nav-item-animated">  
                <i class="fa-solid fa-house"></i>  
                <span>Home</span>  
            </a>  
            
            <a href="referral.html" class="nav-item-animated">  
                <i class="fa-solid fa-user-group"></i>  
                <span>Team</span>  
            </a>  
            
            <a href="profile.html" class="nav-item-animated active">  
                <i class="fa-solid fa-user"></i>  
                <span>Profile</span>  
            </a>  
        </div>  
    </div>

    <!-- Navigation Animation Script -->
    <script>  
        const items = document.querySelectorAll(".nav-item-animated");  
        const indicator = document.querySelector(".indicator");  
          
        function moveIndicator(el){  
            if (!el) return;
            const left = el.offsetLeft + (el.offsetWidth / 2) - (indicator.offsetWidth / 2);  
            indicator.style.left = left + "px";  
            items.forEach(i => i.classList.remove("active"));  
            el.classList.add("active");  
        }  
          
        items.forEach(item => {  
            item.addEventListener("click", () => {  
                moveIndicator(item);  
            });  
        });  
          
        window.onload = () => moveIndicator(document.querySelector(".nav-item-animated.active"));  
        window.onresize = () => moveIndicator(document.querySelector(".nav-item-animated.active"));  
    </script>

    <!-- Firebase & Auth Script -->
    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { observeAuthState } from '../firebase/auth.js';
        import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const auth = getAuth();

        observeAuthState(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const name = user.fullName || user.displayName || "User";
            const email = user.email || "No email available";
            
            document.getElementById('userNameDisplay').innerText = name;
            document.getElementById('userEmailDisplay').innerText = email;

            const profileImgTag = document.getElementById('profileImage');
            const profileInitialTag = document.getElementById('profileInitial');

            if (user.photoURL) {
                profileImgTag.src = user.photoURL;
                profileImgTag.classList.remove('hidden');
                profileInitialTag.classList.add('hidden');
            } else {
                profileInitialTag.innerText = name.charAt(0).toUpperCase();
                profileInitialTag.classList.remove('hidden');
                profileImgTag.classList.add('hidden');
            }

            // Real-time user data fetch
            const userDocRef = doc(db, "users", user.uid);
            onSnapshot(userDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const statusText = document.getElementById('statusText');
                    const activateBtn = document.getElementById('activateBtn');
                    const statusBox = document.getElementById('accountStatusBox');

                    if (data.isActivated) {
                        statusText.innerText = "Account is Active (Premium)";
                        statusBox.className = "p-3.5 bg-emerald-50 border border-emerald-200 rounded-2xl flex justify-between items-center shadow-sm";
                        activateBtn.classList.add('hidden');
                    } else {
                        statusText.innerText = "Account is Unactivated";
                        statusBox.className = "p-3.5 bg-amber-50 border border-amber-200 rounded-2xl flex justify-between items-center shadow-sm";
                        activateBtn.classList.remove('hidden');
                    }
                }
            });
        });

        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            if (confirm("আপনি কি নিশ্চিতভাবে অ্যাকাউন্ট থেকে বের হতে চান?")) {
                try {
                    await signOut(auth);
                    window.location.href = 'login.html';
                } catch (error) {
                    console.error("Logout error:", error);
                }
            }
        });
    </script>
</body>
</html>
