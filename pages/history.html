<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History - Micro Job Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>  
    
    <style>
        .nav-container {  
            position: fixed;  
            bottom: 15px;  
            left: 50%;
            transform: translateX(-50%);
            width: 92%;  
            max-width: 440px;  
            height: 70px;  
            background: #4f46e5;  
            border-radius: 22px;  
            display: flex;  
            justify-content: space-around;  
            align-items: center;  
            box-shadow: 0 10px 25px rgba(0,0,0,.2);  
            overflow: visible;  
            z-index: 100;
        }  
        .nav-item-animated {  
            flex: 1;  
            text-decoration: none;  
            color: #fff;  
            text-align: center;  
            position: relative;  
            z-index: 2;  
        }  
        .nav-item-animated i {  
            font-size: 22px;  
            transition: .35s;  
        }  
        .nav-item-animated span {  
            display: block;  
            font-size: 11px;  
            margin-top: 4px;  
            transition: .35s;  
        }  
        .nav-item-animated.active i {  
            transform: translateY(-10px);  
        }  
        .nav-item-animated.active span {  
            font-weight: bold;  
        }  
        .indicator {  
            position: absolute;  
            top: -15px;  
            width: 60px;  
            height: 60px;  
            background: #312e81;  
            border-radius: 50%;  
            border: 4px solid #fff;  
            transition: left .35s ease;  
            box-shadow: 0 0 20px rgba(49,46,129,.5);  
            z-index: 1;  
        }  
        .indicator::before {  
            content: "";  
            position: absolute;  
            inset: -6px;  
            border-radius: 50%;  
            border: 2px solid rgba(49,46,129,.4);  
            animation: pulse 2s infinite;  
        }  
        @keyframes pulse {  
            0% { transform: scale(1); opacity: 1; }  
            100% { transform: scale(1.4); opacity: 0; }  
        } 
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-28">
        
        <!-- Top Header & Balances -->
        <header class="p-5 bg-gradient-to-r from-purple-600 to-indigo-700 text-white rounded-b-3xl shadow-lg relative">
            <div class="flex justify-between items-center mb-4">
                <a href="profile.html" class="text-xs bg-white/20 hover:bg-white/35 transition px-3 py-1.5 rounded-full font-semibold flex items-center gap-1.5">
                    <div id="profileIconBtn" class="w-5 h-5 bg-white text-purple-700 rounded-full flex items-center justify-center font-extrabold text-[10px]">U</div>
                    <span id="userNameDisplay">Loading...</span>
                </a>
                <a href="dashboard.html" class="text-xs bg-white/25 px-3.5 py-1.5 rounded-full font-bold hover:bg-white/40 transition">Home</a>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-purple-800/50 p-3 rounded-2xl backdrop-blur-sm border border-purple-400/30">
                    <p class="text-[10px] text-purple-200 font-medium">Main Balance</p>
                    <h2 id="mainBalance" class="text-base font-extrabold mt-0.5">৳ 0.00</h2>
                </div>
                <div class="bg-purple-800/50 p-3 rounded-2xl backdrop-blur-sm border border-purple-400/30">
                    <p class="text-[10px] text-purple-200 font-medium">Deposit Balance</p>
                    <h2 id="depositBalance" class="text-base font-extrabold mt-0.5">৳ 0.00</h2>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="p-4 flex-grow">
            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3 px-1">Transaction History</h2>

            <!-- Filter Tabs -->
            <div class="flex bg-gray-100 p-1 rounded-2xl text-xs font-bold text-gray-600 shadow-inner mb-4">
                <button onclick="filterHistory('all', this)" class="tab-btn flex-1 py-2 rounded-xl bg-indigo-600 text-white transition shadow">All</button>
                <button onclick="filterHistory('deposit', this)" class="tab-btn flex-1 py-2 rounded-xl transition hover:text-indigo-600 text-gray-600">Deposit</button>
                <button onclick="filterHistory('withdraw', this)" class="tab-btn flex-1 py-2 rounded-xl transition hover:text-indigo-600 text-gray-600">Withdraw</button>
                <button onclick="filterHistory('earning', this)" class="tab-btn flex-1 py-2 rounded-xl transition hover:text-indigo-600 text-gray-600">Earning</button>
            </div>

            <!-- History Items Container -->
            <div class="bg-gray-50 border border-gray-100 rounded-2xl p-3 min-h-[180px] shadow-sm" id="historyList">
                <div class="text-center py-10 text-gray-400 text-xs">
                    <i class="fa-solid fa-spinner fa-spin text-xl mb-2"></i>
                    <p>Loading transactions...</p>
                </div>
            </div>
        </main>

        <!-- Animated Bottom Navigation -->
        <div class="nav-container">  
            <div class="indicator"></div>  
            <a href="https://t.me/microjobspro" target="_blank" class="nav-item-animated">  
                <i class="fa-solid fa-headset"></i><span>Help</span>  
            </a>  
            <a href="wallet.html" class="nav-item-animated">  
                <i class="fa-solid fa-wallet"></i><span>Wallet</span>  
            </a>  
            <a href="dashboard.html" class="nav-item-animated">  
                <i class="fa-solid fa-house"></i><span>Home</span>  
            </a>  
            <a href="referral.html" class="nav-item-animated">  
                <i class="fa-solid fa-user-group"></i><span>Team</span>  
            </a>  
            <a href="profile.html" class="nav-item-animated">  
                <i class="fa-solid fa-user"></i><span>Profile</span>  
            </a>  
        </div>  
    </div>

    <script>  
        const items = document.querySelectorAll(".nav-item-animated");  
        const indicator = document.querySelector(".indicator");  
        function moveIndicator(el){  
            if (!el) return;
            const left = el.offsetLeft + (el.offsetWidth / 2) - (indicator.offsetWidth / 2);  
            indicator.style.left = left + "px";  
            items.forEach(i => i.classList.remove("active"));  
            el.classList.add("active");  
        }  
        items.forEach(item => { item.addEventListener("click", () => moveIndicator(item)); });  
        window.onload = () => moveIndicator(document.querySelector(".nav-item-animated"));  
    </script>

    <!-- Firebase Script & Logic -->
    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { observeAuthState } from '../firebase/auth.js';
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let allTransactions = [];
        let currentFilter = 'all';

        observeAuthState(async (userData) => {
            if (userData) {
                const uid = userData.uid;
                const name = userData.fullName || userData.displayName || "User";
                document.getElementById('profileIconBtn').innerText = name.charAt(0).toUpperCase();
                document.getElementById('userNameDisplay').innerText = name;

                const mainBal = userData.mainBalance ?? userData.balances?.main ?? 0;
                const depositBal = userData.depositBalance ?? userData.balances?.deposit ?? 0;
                document.getElementById('mainBalance').innerText = `৳ ${Number(mainBal).toFixed(2)}`;
                document.getElementById('depositBalance').innerText = `৳ ${Number(depositBal).toFixed(2)}`;

                await fetchUserTransactions(uid);
            } else {
                window.location.href = 'login.html';
            }
        });

        async function fetchUserTransactions(uid) {
            const historyContainer = document.getElementById('historyList');
            allTransactions = [];

            try {
                // ১. ডিপোজিট হিস্ট্রি
                try {
                    const depositSnapshot = await getDocs(query(collection(db, "deposits"), where("userId", "==", uid)));
                    depositSnapshot.forEach((doc) => {
                        const data = doc.data();
                        allTransactions.push({
                            type: 'deposit',
                            title: `Deposit via ${data.method || data.gateway || 'Mobile'}`,
                            subtitle: `Trx: ${data.trxId || 'N/A'}`,
                            amount: `+৳ ${Number(data.amount || 0).toFixed(2)}`,
                            status: data.status || 'pending',
                            amountClass: 'text-emerald-600',
                            timestamp: data.timestamp?.toDate ? data.timestamp.toDate() : new Date()
                        });
                    });
                } catch (err) { console.log("Deposit fetch error:", err); }

                // ২. উইথড্রাল হিস্ট্রি
                try {
                    const withdrawSnapshot = await getDocs(query(collection(db, "withdraws"), where("userId", "==", uid)));
                    withdrawSnapshot.forEach((doc) => {
                        const data = doc.data();
                        allTransactions.push({
                            type: 'withdraw',
                            title: `Withdrawal via ${data.method || 'Method'}`,
                            subtitle: `A/C: ${data.accountNumber || data.number || 'N/A'}`,
                            amount: `-৳ ${Number(data.amount || 0).toFixed(2)}`,
                            status: data.status || 'pending',
                            amountClass: 'text-amber-600',
                            timestamp: data.timestamp?.toDate ? data.timestamp.toDate() : new Date()
                        });
                    });
                } catch (err) { console.log("Withdraw fetch error:", err); }

                // ৩. আর্নিং হিস্ট্রি
                try {
                    const earningSnapshot = await getDocs(query(collection(db, "earnings"), where("userId", "==", uid)));
                    earningSnapshot.forEach((doc) => {
                        const data = doc.data();
                        allTransactions.push({
                            type: 'earning',
                            title: data.title || 'Task Reward Earned',
                            subtitle: 'Task Completion Bonus',
                            amount: `+৳ ${Number(data.amount || 0).toFixed(2)}`,
                            status: data.status || 'approved',
                            amountClass: 'text-emerald-600',
                            timestamp: data.timestamp?.toDate ? data.timestamp.toDate() : new Date()
                        });
                    });
                } catch (err) { console.log("Earning fetch error:", err); }

                // তারিখ অনুযায়ী রিসেন্ট ট্রানজেকশন উপরে সাজানো (Descending)
                allTransactions.sort((a, b) => b.timestamp - a.timestamp);

                renderTransactions(currentFilter);

            } catch (error) {
                console.error("Error fetching transactions: ", error);
                historyContainer.innerHTML = `<div class="text-center py-10 text-red-500 text-xs font-semibold">ট্রানজেকশন লোড করতে সমস্যা হয়েছে।</div>`;
            }
        }

        function renderTransactions(filter) {
            const historyContainer = document.getElementById('historyList');
            const filtered = filter === 'all' ? allTransactions : allTransactions.filter(item => item.type === filter);

            if (filtered.length === 0) {
                historyContainer.innerHTML = `
                    <div class="text-center py-12 text-gray-400 text-xs">
                        <i class="fa-solid fa-box-open text-3xl mb-2 text-gray-300"></i>
                        <p>কোনো ট্রানজেকশন পাওয়া যায়নি।</p>
                    </div>
                `;
                return;
            }

            let html = '';
            filtered.forEach(tx => {
                const dateStr = tx.timestamp.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
                
                let badgeClass = 'bg-amber-100 text-amber-700';
                let statusText = tx.status.charAt(0).toUpperCase() + tx.status.slice(1);
                if (tx.status === 'approved' || tx.status === 'completed' || tx.status === 'success' || tx.status === 'paid') {
                    badgeClass = 'bg-emerald-100 text-emerald-700';
                }

                html += `
                    <div class="flex justify-between items-center p-3 border-b border-gray-100 last:border-none">
                        <div>
                            <h4 class="text-xs font-bold text-gray-800">${tx.title}</h4>
                            <p class="text-[10px] text-gray-400 mt-0.5">${tx.subtitle} • ${dateStr}</p>
                            <span class="inline-block text-[9px] font-bold px-2 py-0.5 rounded uppercase mt-1 ${badgeClass}">${statusText}</span>
                        </div>
                        <div class="text-right">
                            <div class="text-xs font-extrabold ${tx.amountClass}">${tx.amount}</div>
                        </div>
                    </div>
                `;
            });

            historyContainer.innerHTML = html;
        }

        window.filterHistory = function(type, btnElement) {
            currentFilter = type;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn flex-1 py-2 rounded-xl transition hover:text-indigo-600 text-gray-600";
            });
            btnElement.className = "tab-btn flex-1 py-2 rounded-xl bg-indigo-600 text-white transition shadow";

            renderTransactions(currentFilter);
        }
    </script>
</body>
</html>
