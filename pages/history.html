<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History - Micro Job Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>  
    
    <style>
        .nav-container {  
            position: fixed;  
            bottom: 15px;  
            left: 50%;
            transform: translateX(-50%);
            width: 92%;  
            max-width: 440px;  
            height: 70px;  
            background: #4f46e5;  
            border-radius: 22px;  
            display: flex;  
            justify-content: space-around;  
            align-items: center;  
            box-shadow: 0 10px 25px rgba(0,0,0,.2);  
            overflow: visible;  
            z-index: 100;
        }  
        .nav-item-animated {  
            flex: 1;  
            text-decoration: none;  
            color: #fff;  
            text-align: center;  
            position: relative;  
            z-index: 2;  
        }  
        .nav-item-animated i {  
            font-size: 22px;  
            transition: .35s;  
        }  
        .nav-item-animated span {  
            display: block;  
            font-size: 11px;  
            margin-top: 4px;  
            transition: .35s;  
        }  
        .nav-item-animated.active i {  
            transform: translateY(-10px);  
        }  
        .nav-item-animated.active span {  
            font-weight: bold;  
        }  
        .indicator {  
            position: absolute;  
            top: -15px;  
            width: 60px;  
            height: 60px;  
            background: #312e81;  
            border-radius: 50%;  
            border: 4px solid #fff;  
            transition: left .35s ease;  
            box-shadow: 0 0 20px rgba(49,46,129,.5);  
            z-index: 1;  
        }  
        .indicator::before {  
            content: "";  
            position: absolute;  
            inset: -6px;  
            border-radius: 50%;  
            border: 2px solid rgba(49,46,129,.4);  
            animation: pulse 2s infinite;  
        }  
        @keyframes pulse {  
            0% { transform: scale(1); opacity: 1; }  
            100% { transform: scale(1.4); opacity: 0; }  
        } 
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-28">
        
        <!-- Header -->
        <header class="p-5 bg-gradient-to-r from-purple-600 to-indigo-700 text-white rounded-b-3xl shadow-lg relative">
            <div class="flex justify-between items-center mb-3">
                <a href="dashboard.html" class="text-xs bg-white/20 hover:bg-white/35 transition px-3 py-1.5 rounded-full font-semibold flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-left"></i> Back
                </a>
                <span class="text-xs font-bold tracking-wider uppercase text-purple-200">Transaction History</span>
                <div class="w-12"></div>
            </div>
            <div class="text-center py-2">
                <h1 class="text-lg font-extrabold">All Activities</h1>
                <p class="text-xs text-purple-200">Track your earnings, deposits & withdrawals</p>
            </div>
        </header>

        <!-- Filter Tabs -->
        <div class="px-4 mt-4">
            <div class="flex bg-gray-100 p-1 rounded-2xl text-xs font-bold text-gray-600 shadow-inner">
                <button onclick="filterTransactions('all')" id="tab-all" class="flex-1 py-2 rounded-xl bg-indigo-600 text-white transition shadow">All</button>
                <button onclick="filterTransactions('deposit')" id="tab-deposit" class="flex-1 py-2 rounded-xl transition hover:text-indigo-600">Deposit</button>
                <button onclick="filterTransactions('withdraw')" id="tab-withdraw" class="flex-1 py-2 rounded-xl transition hover:text-indigo-600">Withdraw</button>
                <button onclick="filterTransactions('earning')" id="tab-earning" class="flex-1 py-2 rounded-xl transition hover:text-indigo-600">Earning</button>
            </div>
        </div>

        <!-- Main Content (Transaction List) -->
        <main class="p-4 flex-grow">
            <div id="transactionList" class="flex flex-col gap-3">
                <!-- Loading State -->
                <div class="text-center py-10 text-gray-400 text-xs">
                    <i class="fa-solid fa-spinner fa-spin text-xl mb-2"></i>
                    <p>Loading transactions...</p>
                </div>
            </div>
        </main>

        <!-- Animated Bottom Navigation -->
        <div class="nav-container">  
            <div class="indicator"></div>  
            <a href="https://t.me/microjobspro" target="_blank" class="nav-item-animated">  
                <i class="fa-solid fa-headset"></i><span>Help</span>  
            </a>  
            <a href="wallet.html" class="nav-item-animated">  
                <i class="fa-solid fa-wallet"></i><span>Wallet</span>  
            </a>  
            <a href="dashboard.html" class="nav-item-animated">  
                <i class="fa-solid fa-house"></i><span>Home</span>  
            </a>  
            <a href="referral.html" class="nav-item-animated">  
                <i class="fa-solid fa-user-group"></i><span>Team</span>  
            </a>  
            <a href="profile.html" class="nav-item-animated">  
                <i class="fa-solid fa-user"></i><span>Profile</span>  
            </a>  
        </div>  
    </div>

    <script>  
        const items = document.querySelectorAll(".nav-item-animated");  
        const indicator = document.querySelector(".indicator");  
        function moveIndicator(el){  
            if (!el) return;
            const left = el.offsetLeft + (el.offsetWidth / 2) - (indicator.offsetWidth / 2);  
            indicator.style.left = left + "px";  
            items.forEach(i => i.classList.remove("active"));  
            el.classList.add("active");  
        }  
        items.forEach(item => { item.addEventListener("click", () => moveIndicator(item)); });  
        window.onload = () => moveIndicator(document.querySelector(".nav-item-animated"));  
    </script>

    <!-- Firebase Logic -->
    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { observeAuthState } from '../firebase/auth.js';
        import { collection, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let allTransactions = [];

        observeAuthState(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            try {
                // Fetching transactions from Firestore (assuming a 'transactions' collection linked with user uid)
                const q = query(
                    collection(db, "transactions"), 
                    where("uid", "==", user.uid),
                    orderBy("createdAt", "desc")
                );
                
                const querySnapshot = await getDocs(q);
                allTransactions = [];

                querySnapshot.forEach((doc) => {
                    allTransactions.push({ id: doc.id, ...doc.data() });
                });

                renderTransactions(allTransactions);

            } catch (error) {
                console.error("Error fetching transactions:", error);
                document.getElementById('transactionList').innerHTML = `
                    <div class="text-center py-10 text-red-400 text-xs">
                        <i class="fa-solid fa-triangle-exclamation text-xl mb-2"></i>
                        <p>Failed to load transaction history or collection is empty.</p>
                    </div>
                `;
            }
        });

        window.renderTransactions = function(data) {
            const container = document.getElementById('transactionList');
            if (data.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-400 text-xs">
                        <i class="fa-solid fa-box-open text-3xl mb-2 text-gray-300"></i>
                        <p>No transaction history found!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = data.map(item => {
                let icon = 'fa-exchange-alt';
                let colorClass = 'bg-purple-100 text-purple-600';
                let sign = '+';
                
                if (item.type === 'deposit') {
                    icon = 'fa-arrow-down';
                    colorClass = 'bg-emerald-100 text-emerald-600';
                } else if (item.type === 'withdraw') {
                    icon = 'fa-arrow-up';
                    colorClass = 'bg-amber-100 text-amber-600';
                    sign = '-';
                } else if (item.type === 'earning') {
                    icon = 'fa-wallet';
                    colorClass = 'bg-indigo-100 text-indigo-600';
                }

                // Date formatting safely
                let dateStr = 'Recently';
                if (item.createdAt && item.createdAt.seconds) {
                    dateStr = new Date(item.createdAt.seconds * 1000).toLocaleString();
                }

                return `
                    <div class="p-3.5 bg-gray-50 border border-gray-100 rounded-2xl flex items-center justify-between shadow-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl ${colorClass} flex items-center justify-center font-bold">
                                <i class="fa-solid ${icon}"></i>
                            </div>
                            <div>
                                <h4 class="text-xs font-bold text-gray-800 capitalize">${item.title || item.type || 'Transaction'}</h4>
                                <p class="text-[10px] text-gray-400">${dateStr}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-extrabold ${sign === '+' ? 'text-emerald-600' : 'text-amber-600'}">${sign} ৳ ${item.amount || 0}</span>
                            <span class="block text-[9px] px-2 py-0.5 mt-1 rounded-full uppercase font-bold ${item.status === 'success' || item.status === 'approved' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${item.status || 'Pending'}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.filterTransactions = function(type) {
            // Update Tab Active Classes
            ['all', 'deposit', 'withdraw', 'earning'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === type) {
                    btn.className = "flex-1 py-2 rounded-xl bg-indigo-600 text-white transition shadow";
                } else {
                    btn.className = "flex-1 py-2 rounded-xl transition hover:text-indigo-600 text-gray-600";
                }
            });

            if (type === 'all') {
                renderTransactions(allTransactions);
            } else {
                const filtered = allTransactions.filter(item => item.type === type);
                renderTransactions(filtered);
            }
        }
    </script>
</body>
</html>
