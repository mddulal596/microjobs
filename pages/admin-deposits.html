<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Deposits - Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f3f4f6; color: #1f2937; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; min-height: 100vh; background-color: #ffffff; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; padding-bottom: 90px; }
        
        /* Header */
        header { background-color: #1e1b4b; color: #ffffff; padding: 20px; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; box-shadow: 0 4px 12px rgba(30, 27, 75, 0.2); }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .profile-btn { display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); padding: 6px 12px; border-radius: 50px; color: #fff; text-decoration: none; font-size: 12px; font-weight: bold; }
        .profile-icon { width: 24px; height: 24px; background: #ffffff; color: #1e1b4b; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; }
        .home-link { background: rgba(255, 255, 255, 0.15); padding: 6px 14px; border-radius: 50px; color: #fff; text-decoration: none; font-size: 12px; font-weight: bold; }
        
        .header-title { font-size: 14px; font-weight: 700; color: #e0e7ff; }

        /* Main Content */
        main { padding: 16px; flex-grow: 1; overflow-y: auto; }
        .section-title { font-size: 11px; font-weight: bold; color: #374151; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; }

        /* Deposit List Box */
        .deposit-list { display: flex; flex-direction: column; gap: 10px; }
        .deposit-card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 14px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .deposit-info h4 { font-size: 12px; font-weight: 700; color: #1f2937; margin-bottom: 2px; }
        .deposit-info p { font-size: 10px; color: #6b7280; line-height: 1.4; }
        .deposit-amount { font-size: 11px; font-weight: 800; color: #16a34a; background: #dcfce7; padding: 2px 6px; border-radius: 6px; display: inline-block; margin-top: 4px; }

        .card-actions { display: flex; gap: 6px; }
        .btn-approve { background: #dcfce7; color: #15803d; border: none; padding: 6px 10px; border-radius: 8px; font-size: 10px; font-weight: bold; cursor: pointer; }
        .btn-reject { background: #fee2e2; color: #b91c1c; border: none; padding: 6px 10px; border-radius: 8px; font-size: 10px; font-weight: bold; cursor: pointer; }

        /* Bottom Nav */
        nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #ffffff; border-top: 1px solid #e5e7eb; display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #6b7280; font-size: 10px; gap: 2px; }
        .nav-icon-circle { width: 36px; height: 36px; background: #f3f4f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #4b5563; }
        .nav-item:hover { color: #4f46e5; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Top Header -->
        <header>
            <div class="header-top">
                <a href="admin.html" class="profile-btn">
                    <div class="profile-icon">A</div>
                    <span>Admin Control</span>
                </a>
                <a href="admin.html" class="home-link">Home</a>
            </div>
            <p class="header-title">Pending Deposit Requests</p>
        </header>

        <!-- Main Content Area -->
        <main>
            <h2 class="section-title">Review User Deposit Requests</h2>

            <!-- Deposit List Container -->
            <div class="deposit-list" id="depositListContainer">
                <div class="deposit-card" id="dep-1">
                    <div class="deposit-info">
                        <h4>Rakib Hasan (bKash)</h4>
                        <p>Number: 01712345678<br>TrxID: <strong>TRX987654321</strong></p>
                        <span class="deposit-amount">Amount: ৳ 500.00</span>
                    </div>
                    <div class="card-actions">
                        <button onclick="handleDepositAction('dep-1', 'Rakib Hasan', 500, 'approved')" class="btn-approve">Approve</button>
                        <button onclick="handleDepositAction('dep-1', 'Rakib Hasan', 500, 'rejected')" class="btn-reject">Reject</button>
                    </div>
                </div>

                <div class="deposit-card" id="dep-2">
                    <div class="deposit-info">
                        <h4>Sumaiya Akter (Nagad)</h4>
                        <p>Number: 01812345678<br>TrxID: <strong>TRX123456789</strong></p>
                        <span class="deposit-amount">Amount: ৳ 200.00</span>
                    </div>
                    <div class="card-actions">
                        <button onclick="handleDepositAction('dep-2', 'Sumaiya Akter', 200, 'approved')" class="btn-approve">Approve</button>
                        <button onclick="handleDepositAction('dep-2', 'Sumaiya Akter', 200, 'rejected')" class="btn-reject">Reject</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav>
            <a href="https://t.me/microjobspro" target="_blank" class="nav-item">
                <span style="font-size: 16px;">🎧</span>
                <span>Help</span>
            </a>
            <a href="wallet.html" class="nav-item">
                <span style="font-size: 16px;">👛</span>
                <span>Wallet</span>
            </a>
            <a href="admin.html" class="nav-item">
                <div class="nav-icon-circle">🏠</div>
                <span style="font-weight: 500;">Home</span>
            </a>
            <a href="referral.html" class="nav-item">
                <div class="nav-icon-circle">👥</div>
                <span style="font-weight: 500;">Team</span>
            </a>
            <a href="profile.html" class="nav-item">
                <span style="font-size: 16px;">👤</span>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <!-- Firebase Script & Logic -->
    <script type="module">
        import { observeAuthState } from '../firebase/auth.js';

        observeAuthState((userData) => {
            if (!userData) {
                window.location.href = 'login.html';
            }
        });

        window.handleDepositAction = function(cardId, userName, amount, status) {
            const cardElement = document.getElementById(cardId);
            if (status === 'approved') {
                alert(`"${userName}" এর ৳${amount} ডিপোজিট রিকোয়েস্ট অ্যাপ্রুভ করা হয়েছে এবং ডিপোজিট ব্যালেন্সে যোগ করা হয়েছে!`);
            } else {
                alert(`"${userName}" এর ডিপোজিট রিকোয়েস্ট রিজেক্ট বা বাতিল করা হয়েছে।`);
            }
            if (cardElement) {
                cardElement.remove();
            }
        }
    </script>
</body>
</html>
