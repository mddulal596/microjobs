<!DOCTYPE html>
<html lang="en" class="transform-gpu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased transform-gpu">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between">
        <header class="p-4 bg-indigo-600 text-white rounded-b-3xl shadow-md flex justify-between items-center">
            <h1 class="text-lg font-bold">Withdraw Funds</h1>
            <a href="dashboard.html" class="text-xs bg-indigo-700 px-3 py-1 rounded-full">Dashboard</a>
        </header>

        <main class="p-4 flex-grow space-y-4">
            <div class="bg-indigo-50 p-4 rounded-2xl">
                <p class="text-xs text-indigo-600 font-medium">Available Balance</p>
                <h2 id="availBalance" class="text-2xl font-extrabold text-indigo-700 mt-1">৳ 0.00</h2>
            </div>

            <form id="withdrawForm" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Payment Method</label>
                    <select id="method" class="w-full text-sm px-3 py-3 border border-gray-300 rounded-xl">
                        <option value="bKash">bKash</option>
                        <option value="Nagad">Nagad</option>
                        <option value="Rocket">Rocket</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Account Number</label>
                    <input type="text" id="accountNo" required placeholder="01XXXXXXXXX" class="w-full text-sm px-3 py-3 border border-gray-300 rounded-xl">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Amount (BDT)</label>
                    <input type="number" id="amount" required placeholder="100" class="w-full text-sm px-3 py-3 border border-gray-300 rounded-xl">
                </div>
                <button type="submit" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-lg hover:bg-indigo-700 transition">Request Withdrawal</button>
            </form>
        </main>
    </div>

    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { observeAuthState } from '../firebase/auth.js';
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let userDataGlobal = null;

        observeAuthState((userData) => {
            if (!userData) {
                window.location.href = 'login.html';
                return;
            }
            userDataGlobal = userData;
            const mainBal = userData.balances?.main ?? userData.mainBalance ?? 0;
            document.getElementById('availBalance').innerText = `৳ ${Number(mainBal).toFixed(2)}`;
        });

        document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const method = document.getElementById('method').value;
            const accountNo = document.getElementById('accountNo').value;
            const amount = parseFloat(document.getElementById('amount').value);

            const currentMain = userDataGlobal.balances?.main ?? userDataGlobal.mainBalance ?? 0;

            if (amount < 50) {
                alert("Minimum withdrawal amount is ৳ 50");
                return;
            }

            if (amount > currentMain) {
                alert("Insufficient balance!");
                return;
            }

            try {
                await addDoc(collection(db, "withdrawals"), {
                    userId: userDataGlobal.uid,
                    userEmail: userDataGlobal.email,
                    method,
                    accountNo,
                    amount,
                    status: "pending",
                    requestedAt: serverTimestamp()
                });

                alert("Withdrawal request submitted successfully!");
                window.location.href = 'dashboard.html';
            } catch (err) {
                console.error(err);
                alert("Error: " + err.message);
            }
        });
    </script>
</body>
</html>
