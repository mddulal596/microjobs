<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referral Team - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>  
    
    <style>
        .nav-container {  
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);  
            width: 92%; max-width: 440px; height: 70px; background: #4f46e5;  
            border-radius: 22px; display: flex; justify-content: space-around;  
            align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,.2); z-index: 100;  
        }  
        .nav-item-animated { flex: 1; text-decoration: none; color: #fff; text-align: center; position: relative; z-index: 2; }  
        .nav-item-animated i { font-size: 22px; transition: .35s; }  
        .nav-item-animated span { display: block; font-size: 11px; margin-top: 4px; transition: .35s; }  
        .nav-item-animated.active i { transform: translateY(-10px); }  
        .nav-item-animated.active span { font-weight: bold; }  
        .indicator {  
            position: absolute; top: -15px; width: 60px; height: 60px;  
            background: #312e81; border-radius: 50%; border: 4px solid #fff;  
            transition: left .35s ease; box-shadow: 0 0 20px rgba(49,46,129,.5); z-index: 1;  
        }  
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-28">
        
        <header class="p-5 bg-gradient-to-r from-purple-600 to-indigo-700 text-white rounded-b-3xl shadow-lg">
            <div class="flex justify-between items-center mb-2">
                <a href="dashboard.html" class="text-xs bg-white/25 hover:bg-white/40 transition px-3 py-1.5 rounded-full font-semibold flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-left"></i> Home
                </a>
                <span class="text-xs font-bold tracking-wider uppercase text-purple-200">Referral Team</span>
                <div class="w-12"></div>
            </div>
            <div class="text-base font-extrabold mt-1">Invite & Earn</div>
        </header>

        <main class="p-4 flex-grow">
            <div class="bg-indigo-50 border border-indigo-200 rounded-2xl p-4 mb-4 text-center shadow-sm">
                <h3 class="text-xs font-bold text-indigo-900 mb-1">🔗 আপনার রেফারেল লিংক</h3>
                <p id="refLinkText" class="text-[11px] text-indigo-700 break-all bg-white p-2.5 rounded-xl border border-indigo-100 my-2">Loading referral link...</p>
                <button onclick="copyRefLink()" class="w-full py-2.5 bg-indigo-600 text-white rounded-xl text-xs font-bold shadow hover:bg-indigo-700 transition">Copy Link</button>
            </div>

            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3 px-1">Team Statistics</h2>
            <div class="grid grid-cols-2 gap-3">
                <div class="p-4 bg-purple-50/60 border border-purple-100 rounded-2xl text-center shadow-sm">
                    <p class="text-[11px] text-purple-600 font-bold uppercase">Total Referrals</p>
                    <h3 class="text-lg font-extrabold text-purple-900 mt-1" id="totalReferrals">0</h3>
                </div>
                <div class="p-4 bg-emerald-50/60 border border-emerald-100 rounded-2xl text-center shadow-sm">
                    <p class="text-[11px] text-emerald-600 font-bold uppercase">Referral Earnings</p>
                    <h3 class="text-lg font-extrabold text-emerald-900 mt-1">৳ <span id="refEarnings">0.00</span></h3>
                </div>
            </div>
        </main>

        <div class="nav-container">  
            <div class="indicator"></div>  
            <a href="https://t.me/microjobspro" target="_blank" class="nav-item-animated"><i class="fa-solid fa-headset"></i><span>Help</span></a>  
            <a href="wallet.html" class="nav-item-animated"><i class="fa-solid fa-wallet"></i><span>Wallet</span></a>  
            <a href="dashboard.html" class="nav-item-animated"><i class="fa-solid fa-house"></i><span>Home</span></a>  
            <a href="referral.html" class="nav-item-animated active"><i class="fa-solid fa-user-group"></i><span>Team</span></a>  
            <a href="profile.html" class="nav-item-animated"><i class="fa-solid fa-user"></i><span>Profile</span></a>  
        </div>  
    </div>

    <script>  
        const items = document.querySelectorAll(".nav-item-animated");  
        const indicator = document.querySelector(".indicator");  
        function moveIndicator(el){  
            if (!el) return;
            const left = el.offsetLeft + (el.offsetWidth / 2) - (indicator.offsetWidth / 2);  
            indicator.style.left = left + "px";  
            items.forEach(i => i.classList.remove("active"));  
            el.classList.add("active");  
        }  
        items.forEach(item => item.addEventListener("click", () => moveIndicator(item)));  
        window.onload = () => moveIndicator(document.querySelector(".nav-item-animated.active"));  
        window.onresize = () => moveIndicator(document.querySelector(".nav-item-animated.active"));  
    </script>

    <script type="module">
        import { observeAuthState } from '../firebase/auth.js';
        import { db } from '../firebase/firebase-config.js';
        import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        observeAuthState((user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            
            const refUrl = `${window.location.origin}/pages/register.html?ref=${user.uid}`;
            document.getElementById('refLinkText').innerText = refUrl;

            onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('totalReferrals').innerText = data.totalReferrals || 0;
                    document.getElementById('refEarnings').innerText = Number(data.referralEarnings || 0).toFixed(2);
                }
            });
        });

        window.copyRefLink = function() {
            const linkText = document.getElementById('refLinkText').innerText;
            navigator.clipboard.writeText(linkText);
            alert("রেফারেল লিংক কপি করা হয়েছে!");
        }
    </script>
</body>
</html>
