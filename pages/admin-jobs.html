<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Jobs - Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f3f4f6; color: #1f2937; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; min-height: 100vh; background-color: #ffffff; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; padding-bottom: 90px; }
        
        /* Header */
        header { background-color: #1e1b4b; color: #ffffff; padding: 20px; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; box-shadow: 0 4px 12px rgba(30, 27, 75, 0.2); }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .profile-btn { display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); padding: 6px 12px; border-radius: 50px; color: #fff; text-decoration: none; font-size: 12px; font-weight: bold; }
        .profile-icon { width: 24px; height: 24px; background: #ffffff; color: #1e1b4b; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; }
        .home-link { background: rgba(255, 255, 255, 0.15); padding: 6px 14px; border-radius: 50px; color: #fff; text-decoration: none; font-size: 12px; font-weight: bold; }
        
        .header-title { font-size: 14px; font-weight: 700; color: #e0e7ff; }

        /* Main Content */
        main { padding: 16px; flex-grow: 1; overflow-y: auto; }
        .section-title { font-size: 11px; font-weight: bold; color: #374151; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; }

        /* Job List Box */
        .job-list { display: flex; flex-direction: column; gap: 10px; }
        .job-card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 14px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .job-info h4 { font-size: 12px; font-weight: 700; color: #1f2937; margin-bottom: 2px; }
        .job-info p { font-size: 10px; color: #6b7280; line-height: 1.4; }
        .job-reward { font-size: 11px; font-weight: 800; color: #16a34a; background: #dcfce7; padding: 2px 6px; border-radius: 6px; display: inline-block; margin-top: 4px; }

        .card-actions { display: flex; gap: 6px; }
        .btn-approve { background: #dcfce7; color: #15803d; border: none; padding: 6px 10px; border-radius: 8px; font-size: 10px; font-weight: bold; cursor: pointer; }
        .btn-reject { background: #fee2e2; color: #b91c1c; border: none; padding: 6px 10px; border-radius: 8px; font-size: 10px; font-weight: bold; cursor: pointer; }
        .no-data { text-align: center; color: #6b7280; font-size: 12px; margin-top: 30px; }

        /* Bottom Nav */
        nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #ffffff; border-top: 1px solid #e5e7eb; display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #6b7280; font-size: 10px; gap: 2px; }
        .nav-icon-circle { width: 36px; height: 36px; background: #f3f4f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #4b5563; }
        .nav-item:hover { color: #4f46e5; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Top Header -->
        <header>
            <div class="header-top">
                <a href="admin.html" class="profile-btn">
                    <div class="profile-icon">A</div>
                    <span>Admin Control</span>
                </a>
                <a href="admin.html" class="home-link">Home</a>
            </div>
            <p class="header-title">Pending Job Approvals</p>
        </header>

        <!-- Main Content Area -->
        <main>
            <h2 class="section-title">Review User Posted Jobs</h2>

            <!-- Job List Container -->
            <div class="job-list" id="jobListContainer">
                <div class="no-data">Loading pending jobs...</div>
            </div>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav>
            <a href="https://t.me/microjobspro" target="_blank" class="nav-item">
                <span style="font-size: 16px;">🎧</span>
                <span>Help</span>
            </a>
            <a href="wallet.html" class="nav-item">
                <span style="font-size: 16px;">👛</span>
                <span>Wallet</span>
            </a>
            <a href="admin.html" class="nav-item">
                <div class="nav-icon-circle">🏠</div>
                <span style="font-weight: 500;">Home</span>
            </a>
            <a href="referral.html" class="nav-item">
                <div class="nav-icon-circle">👥</div>
                <span style="font-weight: 500;">Team</span>
            </a>
            <a href="profile.html" class="nav-item">
                <span style="font-size: 16px;">👤</span>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <!-- Firebase Script & Logic -->
    <script type="module">
        import { observeAuthState } from '../firebase/auth.js';
        import { db } from '../firebase/firebase-config.js';
        import { collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        observeAuthState(async (userData) => {
            if (!userData) {
                window.location.href = 'login.html';
                return;
            }
            await loadPendingJobs();
        });

        async function loadPendingJobs() {
            const container = document.getElementById('jobListContainer');
            try {
                const q = query(collection(db, "tasks"), where("status", "==", "pending"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    container.innerHTML = `<div class="no-data">কোনো পেন্ডিং জব অ্যাপ্রুভালের জন্য নেই।</div>`;
                    return;
                }

                container.innerHTML = "";
                querySnapshot.forEach((document) => {
                    const data = document.data();
                    const docId = document.id;
                    const totalBudget = (data.slots || 0) * (data.reward || 0);

                    const card = document.createElement('div');
                    card.className = 'job-card';
                    card.id = docId;
                    card.innerHTML = `
                        <div class="job-info">
                            <h4>${data.title || 'Untitled Job'}</h4>
                            <p>By: ${data.userName || 'User'}<br>Workers Needed: ${data.slots || 0} | Per Task: ৳${data.reward || 0}</p>
                            <span class="job-reward">Total Budget: ৳ ${totalBudget.toFixed(2)}</span>
                        </div>
                        <div class="card-actions">
                            <button onclick="handleJobAction('${docId}', '${data.title || 'Job'}', 'approved')" class="btn-approve">Approve</button>
                            <button onclick="handleJobAction('${docId}', '${data.title || 'Job'}', 'rejected')" class="btn-reject">Reject</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading jobs: ", error);
                container.innerHTML = `<div class="no-data" style="color: red;">জব ডেটা লোড করতে সমস্যা হয়েছে।</div>`;
            }
        }

        window.handleJobAction = async function(jobId, jobTitle, status) {
            if (!confirm(`আপনি কি "${jobTitle}" জবটি ${status === 'approved' ? 'অ্যাপ্রুভ ও লাইভ' : 'বাতিল'} করতে চান?`)) return;

            try {
                const jobRef = doc(db, "tasks", jobId);

                if (status === 'approved') {
                    await updateDoc(jobRef, { status: 'active' });
                    alert(`"${jobTitle}" জবটি সফলভাবে অ্যাপ্রুভ করা হয়েছে এবং লাইভ করা হয়েছে!`);
                } else {
                    await updateDoc(jobRef, { status: 'rejected' });
                    alert(`"${jobTitle}" জবটি রিজেক্ট করা হয়েছে।`);
                }

                // UI থেকে কার্ড রিমুভ করা
                const cardElement = document.getElementById(jobId);
                if (cardElement) cardElement.remove();

                if (document.getElementById('jobListContainer').children.length === 0) {
                    document.getElementById('jobListContainer').innerHTML = `<div class="no-data">কোনো পেন্ডিং জব অ্যাপ্রুভালের জন্য নেই।</div>`;
                }

            } catch (error) {
                console.error("Error processing job action: ", error);
                alert("অপারেশন সম্পন্ন করতে সমস্যা হয়েছে।");
            }
        }
    </script>
</body>
</html>
