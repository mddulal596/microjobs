<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between relative pb-20">
        
        <!-- Dashboard Header -->
        <header class="p-5 bg-gradient-to-r from-purple-600 to-indigo-700 text-white rounded-b-3xl shadow-lg">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center space-x-3">
                    <!-- Profile Picture / First Letter Icon -->
                    <div id="profilePicContainer" class="w-12 h-12 rounded-full border-2 border-white overflow-hidden bg-white text-purple-700 flex items-center justify-center font-bold text-lg shadow-md">
                        <span id="profileInitial">U</span>
                        <img id="profileImage" src="" alt="" class="w-full h-full object-cover hidden">
                    </div>
                    <div>
                        <h2 id="userNameDisplay" class="text-base font-bold">Loading...</h2>
                        <span class="text-xs text-purple-200">Welcome back!</span>
                    </div>
                </div>
                <a href="profile.html" class="text-xs bg-white/20 hover:bg-white/35 transition px-3 py-1.5 rounded-full font-semibold">Profile</a>
            </div>

            <!-- Balance Card inside Header -->
            <div class="bg-white/10 backdrop-blur-md p-4 rounded-2xl border border-white/20 flex justify-between items-center">
                <div>
                    <p class="text-xs text-purple-200 font-medium">Main Balance</p>
                    <h3 class="text-xl font-extrabold mt-0.5">৳ <span id="mainBalance">0.00</span></h3>
                </div>
                <a href="wallet.html" class="bg-white text-purple-700 px-4 py-2 rounded-xl text-xs font-bold shadow hover:bg-purple-50 transition">Wallet</a>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="p-6 flex-grow">
            <div class="grid grid-cols-2 gap-4">
                <a href="microjobs.html" class="p-4 bg-purple-50 border border-purple-100 rounded-2xl text-center hover:bg-purple-100 transition shadow-sm">
                    <span class="text-2xl">💼</span>
                    <h4 class="text-sm font-bold mt-2 text-purple-900">Micro Jobs</h4>
                </a>
                <!-- Lucky Spin Link Updated -->
                <a href="lucky-spin.html" class="p-4 bg-pink-50 border border-pink-100 rounded-2xl text-center hover:bg-pink-100 transition shadow-sm">
                    <span class="text-2xl">🎡</span>
                    <h4 class="text-sm font-bold mt-2 text-pink-900">Lucky Spin</h4>
                </a>
            </div>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="absolute bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-100 py-2 px-4 flex justify-between items-end text-xs text-gray-500 shadow-2xl z-50">
            <a href="help.html" class="flex flex-col items-center hover:text-purple-600 pb-1">
                <span class="text-lg">🎧</span> Help
            </a>
            <a href="wallet.html" class="flex flex-col items-center hover:text-purple-600 pb-1">
                <span class="text-lg">💳</span> Wallet
            </a>
            <!-- Floating Center Home Button -->
            <div class="relative -top-4 flex flex-col items-center">
                <a href="dashboard.html" class="w-14 h-14 bg-sky-500 rounded-full border-4 border-white text-white flex items-center justify-center text-2xl shadow-lg hover:bg-sky-600 transition">
                    🏠
                </a>
            </div>
            <!-- Team Link Updated -->
            <a href="pages/referral.html" class="flex flex-col items-center hover:text-purple-600 pb-1">
                <span class="text-lg">👥</span> Team
            </a>
            <a href="profile.html" class="flex flex-col items-center hover:text-purple-600 pb-1">
                <span class="text-lg">👤</span> Profile
            </a>
        </nav>
    </div>

    <!-- Firebase & Auth Script -->
    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { observeAuthState } from '../firebase/auth.js';
        import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        observeAuthState(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            // নাম এবং ছবি সেট করা
            const name = user.fullName || user.displayName || "User";
            document.getElementById('userNameDisplay').innerText = name;

            const profileImgTag = document.getElementById('profileImage');
            const profileInitialTag = document.getElementById('profileInitial');

            if (user.photoURL) {
                profileImgTag.src = user.photoURL;
                profileImgTag.classList.remove('hidden');
                profileInitialTag.classList.add('hidden');
            } else {
                profileInitialTag.innerText = name.charAt(0).toUpperCase();
                profileInitialTag.classList.remove('hidden');
                profileImgTag.classList.add('hidden');
            }

            // ফায়ারবেজ থেকে রিয়েল-টাইমে ব্যালেন্স লোড করা
            const userDocRef = doc(db, "users", user.uid);
            
            onSnapshot(userDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    let balance = 0;
                    if (data.balances && typeof data.balances.main !== 'undefined') {
                        balance = data.balances.main;
                    } else if (typeof data.balance !== 'undefined') {
                        balance = data.balance;
                    }
                    document.getElementById('mainBalance').innerText = Number(balance).toFixed(2);
                }
            }, (error) => {
                console.error("Error fetching balance:", error);
            });
        });
    </script>
</body>
</html>
