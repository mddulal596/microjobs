<!DOCTYPE html>
<html lang="en" class="transform-gpu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Spin - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .wheel-segment {
            position: absolute;
            width: 50%;
            height: 100%;
            top: 0;
            left: 50%;
            transform-origin: left center;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 15px;
            font-size: 11px;
            font-weight: bold;
            color: white;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased transform-gpu">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between">
        <header class="p-4 bg-purple-600 text-white rounded-b-3xl shadow-md flex justify-between items-center">
            <h1 class="text-lg font-bold">Lucky Spin Bonus</h1>
            <a href="dashboard.html" class="text-xs bg-purple-700 px-3 py-1 rounded-full">Dashboard</a>
        </header>

        <main class="p-6 flex-grow flex flex-col items-center justify-center space-y-6">
            <!-- Pointer Arrow -->
            <div class="relative flex flex-col items-center">
                <div class="w-0 h-0 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent border-b-[15px] border-b-red-500 z-10 -mb-2"></div>
                
                <!-- Spin Wheel Container -->
                <div class="w-72 h-72 rounded-full border-4 border-purple-600 relative overflow-hidden shadow-2xl bg-white" id="spinWheel" style="transition: transform 3s cubic-bezier(0.15, 0.95, 0.25, 1);">
                    <!-- 10 Segments (1 to 10) -->
                    <div class="wheel-segment" style="transform: rotate(0deg); background: #f87171;">1৳</div>
                    <div class="wheel-segment" style="transform: rotate(36deg); background: #fb923c;">2৳</div>
                    <div class="wheel-segment" style="transform: rotate(72deg); background: #fbbf24;">3৳</div>
                    <div class="wheel-segment" style="transform: rotate(108deg); background: #a3e635;">4৳</div>
                    <div class="wheel-segment" style="transform: rotate(144deg); background: #34d399;">5৳</div>
                    <div class="wheel-segment" style="transform: rotate(180deg); background: #22d3ee;">6৳</div>
                    <div class="wheel-segment" style="transform: rotate(216deg); background: #38bdf8;">7৳</div>
                    <div class="wheel-segment" style="transform: rotate(252deg); background: #818cf8;">8৳</div>
                    <div class="wheel-segment" style="transform: rotate(288deg); background: #c084fc;">9৳</div>
                    <div class="wheel-segment" style="transform: rotate(324deg); background: #f472b6;">10৳</div>
                </div>
            </div>
            
            <p id="spinResult" class="text-sm font-bold text-gray-700 text-center h-6">Tap spin to win ৳1 to ৳10!</p>

            <button id="spinBtn" onclick="startSpin()" class="w-full py-3 bg-purple-600 text-white font-bold rounded-2xl shadow-lg hover:bg-purple-700 transition">Spin Now</button>
        </main>
    </div>

    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { observeAuthState } from '../firebase/auth.js';
        import { doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let currentUser = null;
        observeAuthState((user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = user;
        });

        window.startSpin = async function() {
            const btn = document.getElementById('spinBtn');
            const resultEl = document.getElementById('spinResult');
            const wheel = document.getElementById('spinWheel');
            
            btn.disabled = true;
            resultEl.innerText = "Spinning...";

            // Random winning number between 1 and 10
            const wonAmount = Math.floor(Math.random() * 10) + 1;
            
            // Each segment is 36 degrees (360 / 10). Calculate exact angle to stop at the chosen number.
            const segmentAngle = 36;
            const targetIndex = wonAmount - 1; // 0 to 9
            const randomExtraSpins = 360 * 5; // 5 full rotations
            const targetDegree = randomExtraSpins + (targetIndex * segmentAngle) + (segmentAngle / 2);

            wheel.style.transform = `rotate(-${targetDegree}deg)`;

            setTimeout(async () => {
                resultEl.innerText = `Congratulations! You won ৳ ${wonAmount}`;
                
                try {
                    const userRef = doc(db, "users", currentUser.uid);
                    await updateDoc(userRef, {
                        "balances.main": increment(wonAmount)
                    });
                } catch (err) {
                    console.error("Error updating balance:", err);
                }
                btn.disabled = false;
            }, 3000);
        };
    </script>
</body>
</html>
