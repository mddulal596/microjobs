<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>  
    
    <style>  
        /* Animated Bottom Navigation Styles (Matched with other pages) */
        .nav-container {  
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;  
            max-width: 380px;  
            height: 70px;  
            background: #4f46e5;  
            border-radius: 22px;  
            display: flex;  
            justify-content: space-around;  
            align-items: center;  
            box-shadow: 0 10px 25px rgba(0,0,0,.2);  
            overflow: visible;  
            z-index: 50;
        }  
          
        .nav-item {  
            flex: 1;  
            text-decoration: none;  
            color: #fff;  
            text-align: center;  
            position: relative;  
            z-index: 2;  
        }  
          
        .nav-item i {  
            font-size: 22px;  
            transition: .35s;  
        }  
          
        .nav-item span {  
            display: block;  
            font-size: 11px;  
            margin-top: 4px;  
            transition: .35s;  
        }  
          
        .nav-item.active i {  
            transform: translateY(-10px);  
        }  
          
        .nav-item.active span {  
            font-weight: bold;  
        }  
          
        .indicator {  
            position: absolute;  
            top: -24px;  
            width: 60px;  
            height: 60px;  
            background: #312e81;  
            border-radius: 50%;  
            border: 4px solid #fff;  
            transition: left .35s ease;  
            box-shadow: 0 0 20px rgba(49,46,129,.5);  
            z-index: 1;  
        }  
          
        .indicator::before {  
            content: "";  
            position: absolute;  
            inset: -6px;  
            border-radius: 50%;  
            border: 2px solid rgba(49,46,129,.4);  
            animation: pulse 2s infinite;  
        }  
          
        @keyframes pulse {  
            0% {  
                transform: scale(1);  
                opacity: 1;  
            }  
            100% {  
                transform: scale(1.4);  
                opacity: 0;  
            }  
        }  
    </style>  
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between relative pb-28">
        
        <!-- Dashboard Header -->
        <header class="p-5 bg-gradient-to-r from-purple-600 to-indigo-700 text-white rounded-b-3xl shadow-lg">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center space-x-3">
                    <!-- Profile Picture / First Letter Icon -->
                    <div id="profilePicContainer" class="w-12 h-12 rounded-full border-2 border-white overflow-hidden bg-white text-purple-700 flex items-center justify-center font-bold text-lg shadow-md">
                        <span id="profileInitial">U</span>
                        <img id="profileImage" src="" alt="" class="w-full h-full object-cover hidden">
                    </div>
                    <div>
                        <h2 id="userNameDisplay" class="text-base font-bold">Loading...</h2>
                        <span class="text-xs text-purple-200">Welcome back!</span>
                    </div>
                </div>
                <a href="profile.html" class="text-xs bg-white/25 hover:bg-white/35 transition px-3 py-1.5 rounded-full font-semibold">Profile</a>
            </div>

            <!-- Balance Card inside Header -->
            <div class="bg-white/10 backdrop-blur-md p-4 rounded-2xl border border-white/20 flex justify-between items-center">
                <div>
                    <p class="text-xs text-purple-200 font-medium">Main Balance</p>
                    <h3 class="text-xl font-extrabold mt-0.5">৳ <span id="mainBalance">0.00</span></h3>
                </div>
                <a href="wallet.html" class="bg-white text-purple-700 px-4 py-2 rounded-xl text-xs font-bold shadow hover:bg-purple-50 transition">Wallet</a>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="p-6 flex-grow">
            <div class="grid grid-cols-2 gap-4">
                <a href="microjobs.html" class="p-4 bg-purple-50 border border-purple-100 rounded-2xl text-center hover:bg-purple-100 transition shadow-sm">
                    <span class="text-2xl">💼</span>
                    <h4 class="text-sm font-bold mt-2 text-purple-900">Micro Jobs</h4>
                </a>
                <a href="lucky-spin.html" class="p-4 bg-pink-50 border border-pink-100 rounded-2xl text-center hover:bg-pink-100 transition shadow-sm">
                    <span class="text-2xl">🎡</span>
                    <h4 class="text-sm font-bold mt-2 text-pink-900">Lucky Spin</h4>
                </a>
            </div>
        </main>

        <!-- Animated Bottom Navigation Bar -->
        <div class="nav-container">  
            <div class="indicator"></div>  
            
            <a href="wallet.html" class="nav-item">  
                <i class="fa-solid fa-wallet"></i>  
                <span>Wallet</span>  
            </a>  

            <a href="https://t.me/microjobspro" target="_blank" class="nav-item">  
                <i class="fa-solid fa-headset"></i>  
                <span>Help</span>  
            </a>  
            
            <a href="dashboard.html" class="nav-item active">  
                <i class="fa-solid fa-house"></i>  
                <span>Home</span>  
            </a>  
            
            <a href="referral.html" class="nav-item">  
                <i class="fa-solid fa-user-group"></i>  
                <span>Team</span>  
            </a>  
            
            <a href="profile.html" class="nav-item">  
                <i class="fa-solid fa-user"></i>  
                <span>Profile</span>  
            </a>  
        </div>  
    </div>

    <!-- Navigation Animation Script -->
    <script>  
        const items = document.querySelectorAll(".nav-item");  
        const indicator = document.querySelector(".indicator");  
          
        function moveIndicator(el){  
            if (!el) return;
            const left = el.offsetLeft + (el.offsetWidth / 2) - (indicator.offsetWidth / 2);  
            indicator.style.left = left + "px";  
            items.forEach(i => i.classList.remove("active"));  
            el.classList.add("active");  
        }  
          
        items.forEach(item => {  
            item.addEventListener("click", e => {  
                moveIndicator(item);  
            });  
        });  
          
        window.onload = () => moveIndicator(document.querySelector(".nav-item.active"));  
        window.onresize = () => moveIndicator(document.querySelector(".nav-item.active"));  
    </script>

    <!-- Firebase & Auth Script -->
    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { observeAuthState } from '../firebase/auth.js';
        import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        observeAuthState(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const name = user.fullName || user.displayName || "User";
            document.getElementById('userNameDisplay').innerText = name;

            const profileImgTag = document.getElementById('profileImage');
            const profileInitialTag = document.getElementById('profileInitial');

            if (user.photoURL) {
                profileImgTag.src = user.photoURL;
                profileImgTag.classList.remove('hidden');
                profileInitialTag.classList.add('hidden');
            } else {
                profileInitialTag.innerText = name.charAt(0).toUpperCase();
                profileInitialTag.classList.remove('hidden');
                profileImgTag.classList.add('hidden');
            }

            const userDocRef = doc(db, "users", user.uid);
            
            onSnapshot(userDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    let balance = 0;
                    if (data.balances && typeof data.balances.main !== 'undefined') {
                        balance = data.balances.main;
                    } else if (typeof data.balance !== 'undefined') {
                        balance = data.balance;
                    }
                    document.getElementById('mainBalance').innerText = Number(balance).toFixed(2);
                }
            }, (error) => {
                console.error("Error fetching balance:", error);
            });
        });
    </script>
</body>
</html>
