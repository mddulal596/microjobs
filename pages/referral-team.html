<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referral Team (10 Levels) - Micro Job Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>  
    
    <style>
        .nav-container {  
            position: fixed;  
            bottom: 15px;  
            left: 50%;
            transform: translateX(-50%);
            width: 92%;  
            max-width: 440px;  
            height: 70px;  
            background: #4f46e5;  
            border-radius: 22px;  
            display: flex;  
            justify-content: space-around;  
            align-items: center;  
            box-shadow: 0 10px 25px rgba(0,0,0,.2);  
            overflow: visible;  
            z-index: 100;
        }  
        .nav-item-animated {  
            flex: 1;  
            text-decoration: none;  
            color: #fff;  
            text-align: center;  
            position: relative;  
            z-index: 2;  
        }  
        .nav-item-animated i { font-size: 22px; transition: .35s; }  
        .nav-item-animated span { display: block; font-size: 11px; margin-top: 4px; transition: .35s; }  
        .nav-item-animated.active i { transform: translateY(-10px); }  
        .nav-item-animated.active span { font-weight: bold; }  
        .indicator {  
            position: absolute;  
            top: -15px;  
            width: 60px;  
            height: 60px;  
            background: #312e81;  
            border-radius: 50%;  
            border: 4px solid #fff;  
            transition: left .35s ease;  
            box-shadow: 0 0 20px rgba(49,46,129,.5);  
            z-index: 1;  
        }  
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-28">
        
        <!-- Header Section -->
        <header class="p-5 bg-gradient-to-r from-purple-600 to-indigo-700 text-white rounded-b-3xl shadow-lg space-y-3">
            <div class="flex justify-between items-center">
                <a href="referral.html" class="bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-full text-xs font-semibold transition flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-left"></i> Back
                </a>
                <h1 class="text-sm font-bold">Referral Team (10 Levels)</h1>
                <div class="w-12"></div>
            </div>
            <div class="bg-white/10 backdrop-blur-md p-3 rounded-2xl border border-white/20 text-center">
                <p class="text-xs text-purple-100">Explore your multi-level referral network and track your earnings across 10 generations!</p>
            </div>
        </header>

        <!-- Main Content Area (10 Levels List) -->
        <main class="p-4 space-y-3">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider px-1">Network Levels</h2>
            
            <div id="levelsContainer" class="space-y-2.5">
                <!-- Levels will be dynamically injected via script -->
            </div>
        </main>

        <!-- Bottom Navigation Bar -->
        <div class="nav-container">  
            <div class="indicator"></div>  
            <a href="https://t.me/microjobspro" target="_blank" class="nav-item-animated">  
                <i class="fa-solid fa-headset"></i><span>Help</span>  
            </a>  
            <a href="wallet.html" class="nav-item-animated">  
                <i class="fa-solid fa-wallet"></i><span>Wallet</span>  
            </a>  
            <a href="dashboard.html" class="nav-item-animated">  
                <i class="fa-solid fa-house"></i><span>Home</span>  
            </a>  
            <a href="referral.html" class="nav-item-animated active">  
                <i class="fa-solid fa-user-group"></i><span>Team</span>  
            </a>  
            <a href="profile.html" class="nav-item-animated">  
                <i class="fa-solid fa-user"></i><span>Profile</span>  
            </a>  
        </div>  
    </div>

    <!-- Script Logic -->
    <script type="module">
        import { observeAuthState } from '../firebase/auth.js';

        // Bottom Nav Indicator Movement Logic
        const items = document.querySelectorAll(".nav-item-animated");  
        const indicator = document.querySelector(".indicator");  
          
        function moveIndicator(el){  
            if (!el) return;
            const left = el.offsetLeft + (el.offsetWidth / 2) - (indicator.offsetWidth / 2);  
            indicator.style.left = left + "px";  
            items.forEach(i => i.classList.remove("active"));  
            el.classList.add("active");  
        }  
        items.forEach(item => { item.addEventListener("click", () => moveIndicator(item)); });  
        window.onload = () => moveIndicator(document.querySelector(".nav-item-animated.active"));  

        observeAuthState((user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
        });

        // Generate 10 Levels UI Dynamically
        const levelsContainer = document.getElementById('levelsContainer');
        let levelsHTML = '';

        for (let i = 1; i <= 10; i++) {
            levelsHTML += `
                <div class="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm flex items-center justify-between hover:border-indigo-100 transition">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-black text-xs">
                            L-${i}
                        </div>
                        <div>
                            <h3 class="text-xs font-bold text-gray-800">Level ${i} Team</h3>
                            <p class="text-[11px] text-gray-400 mt-0.5">0 Members</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-extrabold text-emerald-600">৳ 0.00</span>
                        <p class="text-[10px] text-gray-400 mt-0.5">Commission</p>
                    </div>
                </div>
            `;
        }

        levelsContainer.innerHTML = levelsHTML;
    </script>
</body>
</html>
