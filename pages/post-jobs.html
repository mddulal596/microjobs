<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Jobs - Micro Job Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    
    <style>
        /* Animated Bottom Nav Styles */
        .nav-container {  
            position: fixed;  
            bottom: 15px;  
            left: 50%;
            transform: translateX(-50%);
            width: 92%;  
            max-width: 440px;  
            height: 70px;  
            background: #4f46e5;  
            border-radius: 22px;  
            display: flex;  
            justify-content: space-around;  
            align-items: center;  
            box-shadow: 0 10px 25px rgba(0,0,0,.2);  
            overflow: visible;  
            z-index: 100;
        }  
          
        .nav-item-animated {  
            flex: 1;  
            text-decoration: none;  
            color: #fff;  
            text-align: center;  
            position: relative;  
            z-index: 2;  
        }  
          
        .nav-item-animated i {  
            font-size: 22px;  
            transition: .35s;  
        }  
          
        .nav-item-animated span {  
            display: block;  
            font-size: 11px;  
            margin-top: 4px;  
            transition: .35s;  
        }  
          
        .nav-item-animated.active i {  
            transform: translateY(-10px);  
        }  
          
        .nav-item-animated.active span {  
            font-weight: bold;  
        }  
          
        .indicator {  
            position: absolute;  
            top: -15px;  
            width: 60px;  
            height: 60px;  
            background: #312e81;  
            border-radius: 50%;  
            border: 4px solid #fff;  
            transition: left .35s ease;  
            box-shadow: 0 0 20px rgba(49,46,129,.5);  
            z-index: 1;  
        }  
          
        .indicator::before {  
            content: "";  
            position: absolute;  
            inset: -6px;  
            border-radius: 50%;  
            border: 2px solid rgba(49,46,129,.4);  
            animation: pulse 2s infinite;  
        }  
          
        @keyframes pulse {  
            0% { transform: scale(1); opacity: 1; }  
            100% { transform: scale(1.4); opacity: 0; }  
        } 
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans">
    <div class="max-w-md mx-auto min-h-screen bg-gray-50 flex flex-col justify-between pb-28 relative shadow-xl">
        
        <!-- Header -->
        <header class="p-5 bg-gradient-to-r from-purple-800 via-indigo-700 to-indigo-800 text-white rounded-b-3xl shadow-md">
            <div class="flex items-center justify-between mb-5">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center font-bold text-base shadow-inner" id="userInitial">M</div>
                    <span class="text-sm font-semibold tracking-wide" id="userName">Loading...</span>
                </div>
                <a href="dashboard.html" class="text-xs bg-white/15 px-3.5 py-1.5 rounded-full hover:bg-white/25 transition flex items-center gap-1.5 font-medium border border-white/10">
                    <i class="fa-solid fa-house text-xs"></i> Home
                </a>
            </div>

            <!-- Balance Cards -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white/10 p-3.5 rounded-2xl backdrop-blur-md border border-white/10">
                    <p class="text-[11px] text-purple-200 font-medium">Main Balance</p>
                    <h3 class="text-base font-black mt-1">৳ <span id="mainBalance">0.00</span></h3>
                </div>
                <div class="bg-white/10 p-3.5 rounded-2xl backdrop-blur-md border border-white/10">
                    <p class="text-[11px] text-purple-200 font-medium">Deposit Balance</p>
                    <h3 class="text-base font-black mt-1">৳ <span id="depositBalance">0.00</span></h3>
                </div>
            </div>
        </header>

        <!-- Main Task List Container -->
        <main class="p-4 flex-grow space-y-3">
            <h2 class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2">Available Daily Jobs</h2>
            
            <div id="jobsListContainer" class="space-y-3">
                <p class="text-center text-xs text-gray-400 py-6">Loading active jobs...</p>
            </div>
        </main>

        <!-- Animated Bottom Navigation Bar -->
        <div class="nav-container">  
            <div class="indicator"></div>  
            
            <a href="https://t.me/microjobspro" target="_blank" class="nav-item-animated">  
                <i class="fa-solid fa-headset"></i>  
                <span>Help</span>  
            </a>  

            <a href="wallet.html" class="nav-item-animated">  
                <i class="fa-solid fa-wallet"></i>  
                <span>Wallet</span>  
            </a>  
            
            <a href="dashboard.html" class="nav-item-animated">  
                <i class="fa-solid fa-house"></i>  
                <span>Home</span>  
            </a>  
            
            <a href="referral.html" class="nav-item-animated">  
                <i class="fa-solid fa-user-group"></i>  
                <span>Team</span>  
            </a>  
            
            <a href="profile.html" class="nav-item-animated">  
                <i class="fa-solid fa-user"></i>  
                <span>Profile</span>  
            </a>  
        </div>

    </div>

    <!-- Navigation Animation Script -->
    <script>  
        const items = document.querySelectorAll(".nav-item-animated");  
        const indicator = document.querySelector(".indicator");  
          
        function moveIndicator(el){  
            if (!el) return;
            const left = el.offsetLeft + (el.offsetWidth / 2) - (indicator.offsetWidth / 2);  
            indicator.style.left = left + "px";  
            items.forEach(i => i.classList.remove("active"));  
            el.classList.add("active");  
        }  
          
        items.forEach(item => {  
            item.addEventListener("click", () => {  
                moveIndicator(item);  
            });  
        });  
          
        window.onload = () => moveIndicator(document.querySelector(".nav-item-animated:nth-child(3)")); 
        window.onresize = () => moveIndicator(document.querySelector(".nav-item-animated.active"));  
    </script>

    <!-- Firebase Script -->
    <script type="module">
        import { db, auth } from '../firebase/firebase-config.js';
        import { collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        const data = userDoc.data();
                        const displayName = data.username || data.fullName || data.name || user.email.split('@')[0];
                        
                        document.getElementById('userName').innerText = displayName;
                        document.getElementById('userInitial').innerText = displayName[0].toUpperCase();
                        
                        const main = data.mainBalance !== undefined ? data.mainBalance : (data.balances?.main || 0);
                        const deposit = data.depositBalance !== undefined ? data.depositBalance : (data.balances?.deposit || 0);

                        document.getElementById('mainBalance').innerText = Number(main).toFixed(2);
                        document.getElementById('depositBalance').innerText = Number(deposit).toFixed(2);
                    }
                } catch (e) {
                    console.error("Error loading user profile:", e);
                }
                loadActiveJobs();
            } else {
                window.location.href = "login.html";
            }
        });

        async function loadActiveJobs() {
            const container = document.getElementById('jobsListContainer');
            try {
                const q = query(
                    collection(db, "tasks"), 
                    where("status", "==", "active")
                );

                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    container.innerHTML = `
                        <div class="text-center py-10 bg-white rounded-2xl p-6 border border-gray-100 shadow-sm">
                            <i class="fa-solid fa-briefcase text-4xl text-gray-300 mb-2"></i>
                            <p class="text-xs text-gray-400 font-medium">কোনো ডেইলিজব উপলব্ধ নেই!</p>
                        </div>`;
                    return;
                }

                container.innerHTML = "";
                querySnapshot.forEach((docSnap) => {
                    const job = docSnap.data();
                    const jobId = docSnap.id;

                    const card = document.createElement('div');
                    card.className = "bg-white border border-gray-100 p-4 rounded-2xl shadow-sm hover:shadow-md transition flex items-center justify-between";
                    card.innerHTML = `
                        <div class="space-y-1.5 pr-2">
                            <span class="text-[9px] bg-indigo-50 text-indigo-600 px-2.5 py-0.5 rounded-full font-bold uppercase tracking-wider">${job.category || 'DAILY-JOBS'}</span>
                            <h3 class="font-bold text-gray-800 text-xs">${job.title}</h3>
                            <p class="text-[10px] text-gray-500">Reward: <span class="font-bold text-emerald-600">৳ ${job.reward}</span> | Workers Left: ${job.workers || 0}</p>
                        </div>
                        <a href="task-details.html?id=${jobId}" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] font-bold px-4 py-2 rounded-full transition shadow-sm whitespace-nowrap">
                            Start Task
                        </a>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading active jobs:", error);
                container.innerHTML = `<p class="text-xs text-red-500 text-center py-4">জব লোড করতে সমস্যা হয়েছে!</p>`;
            }
        }
    </script>
</body>
</html>
