<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post New Job - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>  
</head>
<body class="bg-gray-100 text-gray-800 antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-12">
        
        <!-- Header -->
        <header class="p-5 bg-gradient-to-r from-indigo-700 to-purple-800 text-white rounded-b-3xl shadow-lg flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="dashboard.html" class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center text-white hover:bg-white/30 transition">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </a>
                <h1 class="text-sm font-bold">Post New Job</h1>
            </div>
            <span class="text-xs bg-indigo-500 px-3 py-1 rounded-full font-semibold">User Panel</span>
        </header>

        <!-- Main Form -->
        <main class="p-4 flex-grow space-y-4">
            <div class="bg-white border border-gray-100 p-4 rounded-2xl shadow-sm space-y-3">
                <form id="userPostJobForm" class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">Category</label>
                        <select id="jobCategory" required class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-600">
                            <option value="daily-jobs">Daily Jobs</option>
                            <option value="video">Video Task</option>
                            <option value="microjobs">Micro Jobs</option>
                            <option value="social">Social Media</option>
                            <option value="survey">Survey & Review</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">Job Title</label>
                        <input type="text" id="jobTitle" required placeholder="e.g. Website Visit & Article Read" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-600">
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">Job Description / Instructions</label>
                        <textarea id="jobInstructions" rows="3" required placeholder="Required Proof / প্রমাণের জন্য যা জমা দিতে হবে..." class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-600"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 mb-1">Required Workers</label>
                            <input type="number" id="jobWorkers" required placeholder="100" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-600">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 mb-1">Reward Per Worker (৳)</label>
                            <input type="number" step="0.01" id="jobReward" required placeholder="0.18" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-600">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">Task Link / Website URL</label>
                        <input type="url" id="jobLink" required placeholder="https://example.com" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-600">
                    </div>

                    <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition mt-2">
                        Submit Job for Approval
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { db, auth } from '../firebase/firebase-config.js';
        import { collection, addDoc, doc, updateDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
            } else {
                window.location.href = "login.html";
            }
        });

        document.getElementById('userPostJobForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!currentUser) return alert("Please login first!");

            const category = document.getElementById('jobCategory').value;
            const title = document.getElementById('jobTitle').value;
            const instructions = document.getElementById('jobInstructions').value;
            const workers = parseInt(document.getElementById('jobWorkers').value);
            const reward = parseFloat(document.getElementById('jobReward').value);
            const link = document.getElementById('jobLink').value;

            const totalCost = workers * reward;
            const targetPage = (category === 'video') ? 'video.html' : 'daily-jobs.html';

            if (confirm(`Total budget: ৳${totalCost.toFixed(2)}. Do you want to proceed?`)) {
                try {
                    //১. ডাটাবেজে পেন্ডিং হিসেবে জব সেভ করা
                    await addDoc(collection(db, "tasks"), {
                        category,
                        title,
                        instructions,
                        workers,
                        reward,
                        link,
                        targetPage,
                        status: "pending", // 👈 পেন্ডিং স্ট্যাটাস
                        postedBy: currentUser.uid,
                        timestamp: serverTimestamp()
                    });

                    // ২. ইউজারের ব্যালেন্স কেটে নেওয়া
                    await updateDoc(doc(db, "users", currentUser.uid), {
                        mainBalance: increment(-totalCost),
                        "balances.main": increment(-totalCost)
                    });

                    alert(`আপনার জব পোস্ট সফলভাবে জমা হয়েছে! মোট বাজেট ৳${totalCost.toFixed(2)} কেটে নেওয়া হয়েছে। অ্যাডমিন রিভিউ করার পর কাজ এক্টিভ হবে।`);
                    document.getElementById('userPostJobForm').reset();

                } catch (error) {
                    console.error("Error posting job: ", error);
                    alert("জব পোস্ট করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।");
                }
            }
        });
    </script>
</body>
</html>
