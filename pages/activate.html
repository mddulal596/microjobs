<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Account - Micro Job Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f3f4f6; color: #1f2937; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; min-height: 100vh; background-color: #ffffff; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; padding-bottom: 90px; }
        
        /* Top Header */
        header { background: linear-gradient(135deg, #4f46e5 0%, #312e81 100%); color: #ffffff; padding: 20px; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; box-shadow: 0 4px 12px rgba(30, 27, 75, 0.2); }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .profile-btn { display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); padding: 6px 12px; border-radius: 50px; color: #fff; text-decoration: none; font-size: 12px; font-weight: bold; }
        .profile-icon { width: 24px; height: 24px; background: #ffffff; color: #1e1b4b; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; }
        .home-link { background: rgba(255, 255, 255, 0.15); padding: 6px 14px; border-radius: 50px; color: #fff; text-decoration: none; font-size: 12px; font-weight: bold; }
        
        .header-title { font-size: 16px; font-weight: 800; }

        /* Main Content */
        main { padding: 16px; flex-grow: 1; overflow-y: auto; }
        .info-card { background: #fffbeb; border: 1px solid #fef3c7; border-radius: 16px; padding: 16px; margin-bottom: 16px; text-align: center; }
        .info-card h3 { font-size: 14px; font-weight: 800; color: #b45309; margin-bottom: 6px; }
        .info-card p { font-size: 11px; color: #92400e; line-height: 1.5; }

        .fee-box { background: #f3f4f6; padding: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: #4f46e5; margin-bottom: 16px; }

        .btn-submit { width: 100%; background: linear-gradient(135deg, #4f46e5 0%, #312e81 100%); color: #ffffff; border: none; padding: 12px; border-radius: 12px; font-size: 13px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(79,70,229,0.3); }
        .btn-submit:hover { opacity: 0.9; }

        /* Bottom Nav */
        nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #ffffff; border-top: 1px solid #e5e7eb; display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #6b7280; font-size: 10px; gap: 2px; }
        .nav-icon-circle { width: 36px; height: 36px; background: #f3f4f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #4b5563; }
        .nav-item:hover { color: #4f46e5; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Top Header -->
        <header>
            <div class="header-top">
                <a href="dashboard.html" class="profile-btn">
                    <div class="profile-icon">M</div>
                    <span>Micro Job Pro</span>
                </a>
                <a href="dashboard.html" class="home-link">Home</a>
            </div>
            <div class="header-title">Account Activation</div>
        </header>

        <!-- Main Content Area -->
        <main id="mainContainer">
            <div class="info-card">
                <h3>⭐ প্রিমিয়াম মেম্বারশিপ</h3>
                <p>অ্যাকাউন্ট একটিভ করার মাধ্যমে আপনার ডিপোজিট ব্যালেন্স থেকে স্বয়ংক্রিয়ভাবে ফি কেটে নেওয়া হবে এবং সকল প্রিমিয়াম সুবিধা আনলক হয়ে যাবে।</p>
            </div>

            <div id="dynamicContent">
                <!-- Content will load dynamically based on deposit balance -->
            </div>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav>
            <a href="support.html" class="nav-item">
                <span style="font-size: 16px;">🎧</span>
                <span>Help</span>
            </a>
            <a href="wallet.html" class="nav-item">
                <span style="font-size: 16px;">👛</span>
                <span>Wallet</span>
            </a>
            <a href="dashboard.html" class="nav-item">
                <div class="nav-icon-circle">🏠</div>
                <span style="font-weight: 500;">Home</span>
            </a>
            <a href="referral.html" class="nav-item">
                <div class="nav-icon-circle">👥</div>
                <span style="font-weight: 500;">Team</span>
            </a>
            <a href="profile.html" class="nav-item">
                <span style="font-size: 16px;">👤</span>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <!-- Firebase Script & Logic -->
    <script type="module">
        import { observeAuthState } from '../firebase/auth.js';
        import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const db = getFirestore();
        let currentUserUid = null;

        observeAuthState((userData) => {
            if (!userData) {
                window.location.href = 'login.html';
                return;
            }

            currentUserUid = userData.uid;

            // যদি অ্যাকাউন্ট ইতিমধ্যে একটিভ থাকে
            if (userData.isActivated) {
                document.getElementById('mainContainer').innerHTML = `
                    <div style="background: #f0fdf4; border: 1px solid #dcfce7; border-radius: 16px; padding: 24px; text-align: center;">
                        <span style="font-size: 40px; display: block; margin-bottom: 10px;">🎉</span>
                        <h4 style="font-size: 16px; font-weight: 800; color: #15803d; margin-bottom: 6px;">আপনার অ্যাকাউন্টটি ইতিমধ্যে একটিভ রয়েছে!</h4>
                        <p style="font-size: 12px; color: #166534; line-height: 1.5; margin-bottom: 16px;">
                            আপনি এখন সকল প্রিমিয়াম জব এবং ইনকাম ফিচার ব্যবহার করতে পারছেন।
                        </p>
                        <a href="dashboard.html" style="background: #16a34a; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 12px; font-size: 12px; font-weight: bold; display: inline-block;">ড্যাশবোর্ডে ফিরে যান</a>
                    </div>
                `;
                return;
            }

            const activationFee = 100; // একটিভেশন ফি ৳ ১০০
            const userDepositBalance = userData.depositBalance || 0; 
            const contentArea = document.getElementById('dynamicContent');

            if (userDepositBalance < activationFee) {
                contentArea.innerHTML = `
                    <div style="background: #fee2e2; border: 1px solid #fecaca; border-radius: 16px; padding: 16px; text-align: center;">
                        <h4 style="font-size: 14px; font-weight: 800; color: #b91c1c; margin-bottom: 6px;">❌ পর্যাপ্ত ডিপোজিট ব্যালেন্স নেই!</h4>
                        <p style="font-size: 11px; color: #7f1d1d; line-height: 1.5; margin-bottom: 14px;">
                            অ্যাকাউন্ট অ্যাক্টিভ করতে প্রয়োজন ৳${activationFee}। বর্তমানে আপনার ডিপোজিট ব্যালেন্স আছে ৳${userDepositBalance}। অনুগ্রহ করে আগে ওয়ালেটে ডিপোজিট করুন।
                        </p>
                        <a href="wallet.html" style="background: #4f46e5; color: #fff; text-decoration: none; padding: 10px 20px; border-radius: 12px; font-size: 12px; font-weight: bold; display: inline-block; box-shadow: 0 4px 12px rgba(79,70,229,0.3);">Add Money to Deposit</a>
                    </div>
                `;
            } else {
                contentArea.innerHTML = `
                    <form id="activateForm" onsubmit="submitActivation(event, ${userDepositBalance}, ${activationFee})">
                        <div class="fee-box">
                            <span>Activation Fee:</span>
                            <span style="font-size: 15px; color: #16a34a;">৳ ${activationFee}.00</span>
                        </div>
                        <div style="background: #f0fdf4; border: 1px solid #dcfce7; padding: 12px; border-radius: 12px; font-size: 11px; color: #166534; margin-bottom: 16px; text-align: center;">
                            আপনার ডিপোজিট ব্যালেন্স: <strong>৳ ${userDepositBalance}.00</strong> (পর্যাপ্ত আছে)
                        </div>
                        <button type="submit" class="btn-submit">Confirm & Active Account</button>
                    </form>
                `;
            }
        });

        // অটোমেটিক ডাটাবেজ আপডেট করার ফাংশন
        window.submitActivation = async function(event, currentBalance, fee) {
            event.preventDefault();
            
            let confirmPay = confirm(`আপনার ডিপোজিট ব্যালেন্স থেকে ৳${fee} কেটে নিয়ে অ্যাকাউন্ট সফলভাবে অ্যাক্টিভ করা হবে। আপনি কি নিশ্চিত?`);
            
            if (confirmPay && currentUserUid) {
                try {
                    const userRef = doc(db, "users", currentUserUid);
                    await updateDoc(userRef, {
                        depositBalance: currentBalance - fee,
                        isActivated: true
                    });

                    alert(`অভিনন্দন! আপনার ডিপোজিট ব্যালেন্স থেকে সফলভাবে ফি কেটে নেওয়া হয়েছে এবং অ্যাকাউন্ট একটিভ করা হয়েছে।`);
                    window.location.href = 'dashboard.html';
                } catch (error) {
                    console.error("Activation Error: ", error);
                    alert("অ্যাক্টিভেশন সম্পন্ন করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।");
                }
            }
        }
    </script>
</body>
</html>
