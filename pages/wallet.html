<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>  
    
    <style>
        .nav-container {  
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);  
            width: 92%; max-width: 440px; height: 70px; background: #4f46e5;  
            border-radius: 22px; display: flex; justify-content: space-around;  
            align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,.2); z-index: 100;  
        }  
        .nav-item-animated { flex: 1; text-decoration: none; color: #fff; text-align: center; position: relative; z-index: 2; }  
        .nav-item-animated i { font-size: 22px; transition: .25s; }  
        .nav-item-animated span { display: block; font-size: 11px; margin-top: 4px; transition: .25s; }  
        .nav-item-animated.active i { transform: translateY(-10px); }  
        .nav-item-animated.active span { font-weight: bold; }  
        .indicator {  
            position: absolute; top: -15px; width: 60px; height: 60px;  
            background: #312e81; border-radius: 50%; border: 4px solid #fff;  
            transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1);  
            box-shadow: 0 0 20px rgba(49,46,129,.5); z-index: 1;  
        }  
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-28">
        
        <!-- Header -->
        <header class="p-5 bg-gradient-to-r from-purple-600 to-indigo-700 text-white rounded-b-3xl shadow-lg">
            <div class="flex justify-between items-center mb-4">
                <a href="dashboard.html" class="text-xs bg-white/20 hover:bg-white/35 transition px-3 py-1.5 rounded-full font-semibold flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-left"></i> Back
                </a>
                <span class="text-xs font-bold tracking-wider uppercase text-purple-200">My Wallet</span>
                <div class="w-12"></div>
            </div>

            <!-- Balances Summary Card -->
            <div class="grid grid-cols-2 gap-3 mt-2">
                <div class="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/20">
                    <p class="text-[11px] text-purple-200 font-medium">Main Balance</p>
                    <h3 class="text-lg font-extrabold mt-0.5">৳ <span id="mainBalance">0.00</span></h3>
                </div>
                <div class="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/20">
                    <p class="text-[11px] text-purple-200 font-medium">Deposit Balance</p>
                    <h3 class="text-lg font-extrabold mt-0.5">৳ <span id="depositBalance">0.00</span></h3>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="p-4 flex-grow">
            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3 px-1">Wallet Actions</h2>
            
            <div class="grid grid-cols-2 gap-3 mb-4">
                <a href="deposit.html" class="p-4 bg-amber-50 border border-amber-100 rounded-2xl text-center hover:bg-amber-100 transition shadow-sm flex flex-col items-center justify-center gap-2">
                    <span class="text-2xl">💳</span>
                    <h4 class="text-xs font-bold text-amber-900">Deposit Money</h4>
                </a>
                <a href="withdraw.html" class="p-4 bg-teal-50 border border-teal-100 rounded-2xl text-center hover:bg-teal-100 transition shadow-sm flex flex-col items-center justify-center gap-2">
                    <span class="text-2xl">💸</span>
                    <h4 class="text-xs font-bold text-teal-900">Withdraw Funds</h4>
                </a>
            </div>

            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3 px-1">Quick Links</h2>
            
            <!-- Quick Links (Side by Side) -->
            <div class="grid grid-cols-2 gap-3 mb-4">
                <a href="transactions.html" class="p-4 bg-cyan-50 border border-cyan-100 rounded-2xl text-center hover:bg-cyan-100 transition shadow-sm flex flex-col items-center justify-center gap-2">
                    <span class="text-2xl">📜</span>
                    <h4 class="text-xs font-bold text-cyan-900">Transaction History</h4>
                </a>
                <a href="activate-account.html" class="p-4 bg-purple-50 border border-purple-100 rounded-2xl text-center hover:bg-purple-100 transition shadow-sm flex flex-col items-center justify-center gap-2">
                    <span class="text-2xl">⭐</span>
                    <h4 class="text-xs font-bold text-purple-900">Account Activation</h4>
                </a>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <div class="nav-container">  
            <div class="indicator"></div>  
            <a href="https://t.me/microjobspro" target="_blank" class="nav-item-animated"><i class="fa-solid fa-headset"></i><span>Help</span></a>  
            <a href="wallet.html" class="nav-item-animated active"><i class="fa-solid fa-wallet"></i><span>Wallet</span></a>  
            <a href="dashboard.html" class="nav-item-animated"><i class="fa-solid fa-house"></i><span>Home</span></a>  
            <a href="referral.html" class="nav-item-animated"><i class="fa-solid fa-user-group"></i><span>Team</span></a>  
            <a href="profile.html" class="nav-item-animated"><i class="fa-solid fa-user"></i><span>Profile</span></a>  
        </div>  
    </div>

    <script>  
        const items = document.querySelectorAll(".nav-item-animated");  
        const indicator = document.querySelector(".indicator");  
        
        function moveIndicator(el){  
            if (!el) return;
            const left = el.offsetLeft + (el.offsetWidth / 2) - (indicator.offsetWidth / 2);  
            indicator.style.left = left + "px";  
            items.forEach(i => i.classList.remove("active"));  
            el.classList.add("active");  
        }  
        
        items.forEach(item => item.addEventListener("click", (e) => moveIndicator(item)));  
        
        const activeItem = document.querySelector(".nav-item-animated.active") || items[1];
        moveIndicator(activeItem);

        window.addEventListener('resize', () => {
            moveIndicator(document.querySelector(".nav-item-animated.active"));
        });
    </script>

    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { observeAuthState } from '../firebase/auth.js';
        import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        observeAuthState((user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    let main = data.balances?.main ?? data.mainBalance ?? 0;
                    let deposit = data.depositBalance ?? 0;
                    document.getElementById('mainBalance').innerText = Number(main).toFixed(2);
                    document.getElementById('depositBalance').innerText = Number(deposit).toFixed(2);
                }
            });
        });
    </script>
</body>
</html>
