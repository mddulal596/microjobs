<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Details - Micro Job Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    
    <style>
        /* Animated Bottom Nav Styles */
        .nav-container {  
            position: fixed;  
            bottom: 15px;  
            left: 50%;
            transform: translateX(-50%);
            width: 92%;  
            max-width: 440px;  
            height: 70px;  
            background: #4f46e5;  
            border-radius: 22px;  
            display: flex;  
            justify-content: space-around;  
            align-items: center;  
            box-shadow: 0 10px 25px rgba(0,0,0,.2);  
            overflow: visible;  
            z-index: 100;
        }  
          
        .nav-item-animated {  
            flex: 1;  
            text-decoration: none;  
            color: #fff;  
            text-align: center;  
            position: relative;  
            z-index: 2;  
        }  
          
        .nav-item-animated i {  
            font-size: 22px;  
            transition: .35s;  
        }  
          
        .nav-item-animated span {  
            display: block;  
            font-size: 11px;  
            margin-top: 4px;  
            transition: .35s;  
        }  
          
        .nav-item-animated.active i {  
            transform: translateY(-10px);  
        }  
          
        .nav-item-animated.active span {  
            font-weight: bold;  
        }  
          
        .indicator {  
            position: absolute;  
            top: -15px;  
            width: 60px;  
            height: 60px;  
            background: #312e81;  
            border-radius: 50%;  
            border: 4px solid #fff;  
            transition: left .35s ease;  
            box-shadow: 0 0 20px rgba(49,46,129,.5);  
            z-index: 1;  
        }  
          
        .indicator::before {  
            content: "";  
            position: absolute;  
            inset: -6px;  
            border-radius: 50%;  
            border: 2px solid rgba(49,46,129,.4);  
            animation: pulse 2s infinite;  
        }  
          
        @keyframes pulse {  
            0% { transform: scale(1); opacity: 1; }  
            100% { transform: scale(1.4); opacity: 0; }  
        } 
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans">
    <div class="max-w-md mx-auto min-h-screen bg-gray-50 flex flex-col justify-between pb-28 relative shadow-xl">
        
        <!-- Header -->
        <header class="p-5 bg-gradient-to-r from-purple-800 via-indigo-700 to-indigo-800 text-white rounded-b-3xl shadow-md">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <a href="daily-jobs.html" class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center text-white hover:bg-white/30 transition">
                        <i class="fa-solid fa-arrow-left text-sm"></i>
                    </a>
                    <h1 class="text-sm font-bold tracking-wide">Task Details</h1>
                </div>
                <a href="dashboard.html" class="text-xs bg-white/15 px-3.5 py-1.5 rounded-full hover:bg-white/25 transition flex items-center gap-1.5 font-medium border border-white/10">
                    <i class="fa-solid fa-house text-xs"></i> Home
                </a>
            </div>
        </header>

        <!-- Main Task Content -->
        <main class="p-4 flex-grow space-y-4">
            
            <!-- Loading Spinner -->
            <div id="loadingContainer" class="text-center py-12">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-600 mb-3"></i>
                <p class="text-xs text-gray-500 font-medium">টাস্কের বিবরণ লোড হচ্ছে...</p>
            </div>

            <!-- Error Container -->
            <div id="errorContainer" class="hidden text-center py-10 bg-white rounded-2xl p-6 border border-gray-100 shadow-sm space-y-3">
                <i class="fa-solid fa-triangle-exclamation text-4xl text-amber-500"></i>
                <p class="text-xs text-gray-600 font-medium">টাস্কটি খুঁজে পাওয়া যায়নি অথবা মুছে ফেলা হয়েছে।</p>
                <a href="daily-jobs.html" class="inline-block bg-indigo-600 text-white text-xs font-bold px-4 py-2 rounded-full shadow hover:bg-indigo-700 transition">
                    Back to Tasks
                </a>
            </div>

            <!-- Task Details Card -->
            <div id="taskCard" class="hidden bg-white rounded-2xl p-5 border border-gray-100 shadow-sm space-y-4">
                
                <!-- Category, Title & Estimated Time Badge -->
                <div>
                    <div class="flex items-center justify-between gap-2">
                        <span id="taskCategory" class="text-[9px] bg-indigo-50 text-indigo-600 px-2.5 py-0.5 rounded-full font-bold uppercase tracking-wider">Category</span>
                        <!-- Estimated Time Display -->
                        <span id="taskDuration" class="text-[10px] bg-amber-50 text-amber-700 px-2.5 py-0.5 rounded-full font-bold border border-amber-200 flex items-center gap-1">
                            <i class="fa-regular fa-clock"></i> <span id="durationText">N/A</span>
                        </span>
                    </div>
                    <h2 id="taskTitle" class="text-sm font-bold text-gray-800 mt-2">Job Title Loading...</h2>
                </div>

                <!-- Reward & Workers Info -->
                <div class="bg-indigo-50/70 p-3.5 rounded-xl border border-indigo-100 flex justify-between items-center">
                    <div>
                        <p class="text-[10px] text-gray-500 font-medium">Task Reward</p>
                        <h3 class="text-base font-black text-emerald-600 mt-0.5">৳ <span id="taskReward">0.00</span></h3>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] text-gray-500 font-medium">Workers Remaining</p>
                        <h3 class="text-sm font-bold text-indigo-700 mt-0.5" id="taskWorkers">0</h3>
                    </div>
                </div>

                <!-- Task Link -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Task Link</label>
                    <a id="taskLink" href="#" target="_blank" class="w-full bg-indigo-50 text-indigo-700 border border-indigo-100 rounded-xl p-3 text-xs font-bold flex items-center justify-between hover:bg-indigo-100 transition truncate">
                        <span id="taskLinkText" class="truncate">https://example.com</span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs ml-2"></i>
                    </a>
                </div>

                <!-- Instructions -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Work Description / Instructions</label>
                    <div id="taskInstructions" class="bg-gray-50 border border-gray-200 text-xs text-gray-700 rounded-xl p-3 whitespace-pre-line leading-relaxed">
                        Instructions will appear here...
                    </div>
                </div>

                <!-- Submission Form -->
                <form id="submissionForm" class="space-y-3 pt-2 border-t border-gray-100">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Proof / Submission Work</label>
                        <textarea id="proofText" rows="3" required placeholder="প্রমাণের বিবরণ অথবা রিকোয়ার্ড লিঙ্ক/টেক্সট এখানে লিখুন..." class="w-full bg-gray-50 border border-gray-200 text-xs rounded-xl p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"></textarea>
                    </div>

                    <button type="submit" id="submitProofBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-3.5 rounded-xl transition shadow-md flex justify-center items-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> Submit Task Proof
                    </button>
                </form>

            </div>

        </main>

        <!-- Animated Bottom Navigation Bar -->
        <div class="nav-container">  
            <div class="indicator"></div>  
            
            <a href="https://t.me/microjobspro" target="_blank" class="nav-item-animated">  
                <i class="fa-solid fa-headset"></i>  
                <span>Help</span>  
            </a>  

            <a href="wallet.html" class="nav-item-animated">  
                <i class="fa-solid fa-wallet"></i>  
                <span>Wallet</span>  
            </a>  
            
            <a href="dashboard.html" class="nav-item-animated">  
                <i class="fa-solid fa-house"></i>  
                <span>Home</span>  
            </a>  
            
            <a href="referral.html" class="nav-item-animated">  
                <i class="fa-solid fa-user-group"></i>  
                <span>Team</span>  
            </a>  
            
            <a href="profile.html" class="nav-item-animated">  
                <i class="fa-solid fa-user"></i>  
                <span>Profile</span>  
            </a>  
        </div>

    </div>

    <!-- Navigation Animation Script -->
    <script>  
        const items = document.querySelectorAll(".nav-item-animated");  
        const indicator = document.querySelector(".indicator");  
          
        function moveIndicator(el){  
            if (!el) return;
            const left = el.offsetLeft + (el.offsetWidth / 2) - (indicator.offsetWidth / 2);  
            indicator.style.left = left + "px";  
            items.forEach(i => i.classList.remove("active"));  
            el.classList.add("active");  
        }  
          
        items.forEach(item => {  
            item.addEventListener("click", () => {  
                moveIndicator(item);  
            });  
        });  
          
        window.addEventListener("DOMContentLoaded", () => {
            const homeBtn = Array.from(items).find(item => item.getAttribute("href") === "dashboard.html") || items[2];
            moveIndicator(homeBtn);
        });

        window.onresize = () => moveIndicator(document.querySelector(".nav-item-animated.active"));  
    </script>

    <!-- Firebase Script -->
    <script type="module">
        import { db, auth } from '../firebase/firebase-config.js';
        import { doc, getDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        let currentUser = null;
        let currentTaskId = null;
        let currentTaskData = null;

        const urlParams = new URLSearchParams(window.location.search);
        currentTaskId = urlParams.get('id');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                if (currentTaskId) {
                    loadTaskDetails(currentTaskId);
                } else {
                    showError();
                }
            } else {
                window.location.href = "login.html";
            }
        });

        async function loadTaskDetails(taskId) {
            try {
                const taskRef = doc(db, "tasks", taskId);
                const taskSnap = await getDoc(taskRef);

                if (taskSnap.exists()) {
                    currentTaskData = taskSnap.data();
                    
                    document.getElementById('taskCategory').innerText = currentTaskData.category || 'Custom Task';
                    document.getElementById('taskTitle').innerText = currentTaskData.title || 'Untitled Job';
                    document.getElementById('taskReward').innerText = Number(currentTaskData.reward || 0).toFixed(2);
                    document.getElementById('taskWorkers').innerText = currentTaskData.workers || 0;
                    
                    // Task Duration / Time Display
                    document.getElementById('durationText').innerText = currentTaskData.duration || 'Flexible';

                    const link = currentTaskData.link || '#';
                    document.getElementById('taskLink').href = link;
                    document.getElementById('taskLinkText').innerText = link;

                    document.getElementById('taskInstructions').innerText = currentTaskData.instructions || currentTaskData.description || 'কোনো নির্দেশনা দেওয়া হয়নি।';

                    document.getElementById('loadingContainer').classList.add('hidden');
                    document.getElementById('taskCard').classList.remove('hidden');
                } else {
                    showError();
                }
            } catch (error) {
                console.error("Error fetching task details:", error);
                showError();
            }
        }

        function showError() {
            document.getElementById('loadingContainer').classList.add('hidden');
            document.getElementById('taskCard').classList.add('hidden');
            document.getElementById('errorContainer').classList.remove('hidden');
        }

        // Safe Proof Submission Handler
        document.getElementById('submissionForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!currentUser) {
                alert("আপনার সেশন এক্সপায়ার হয়েছে। অনুগ্রহ করে পুনরায় লগইন করুন।");
                window.location.href = "login.html";
                return;
            }

            if (!currentTaskId || !currentTaskData) {
                alert("টাস্কের ডাটা পাওয়া যায়নি!");
                return;
            }

            const proofText = document.getElementById('proofText').value.trim();
            const submitBtn = document.getElementById('submitProofBtn');

            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting Proof...";

            try {
                const submissionPayload = {
                    taskId: currentTaskId,
                    taskName: currentTaskData.title || 'Task',
                    reward: Number(currentTaskData.reward) || 0,
                    userId: currentUser.uid,
                    userEmail: currentUser.email || 'N/A',
                    proofText: proofText,
                    status: "pending",
                    submittedAt: serverTimestamp()
                };

                // কালেকশন নেম পরিবর্তন করে Firestore Rules অনুযায়ী "submissions" করা হলো
                await addDoc(collection(db, "submissions"), submissionPayload);

                alert("আপনার টাস্কের প্রমাণ সফলভাবে জমা দেওয়া হয়েছে!");
                window.location.href = "daily-jobs.html";

            } catch (error) {
                console.error("Error submitting proof:", error);
                alert("প্রমাণ জমা দিতে সমস্যা হয়েছে: " + error.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Task Proof";
            }
        });
    </script>
</body>
</html>
