<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Details - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen overflow-hidden">
    <main class="flex-1 flex flex-col overflow-y-auto p-6 md:p-12">
        <div class="max-w-2xl w-full mx-auto space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-white">Task Details & Proof</h2>
                <a href="tasks.html" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-sm font-semibold transition-all">Back to Marketplace</a>
            </div>

            <!-- Task Info Card -->
            <div id="taskCard" class="p-8 bg-slate-900 border border-slate-800 rounded-3xl shadow-xl space-y-4">
                <div class="flex justify-between items-start">
                    <span id="taskCategory" class="px-2.5 py-0.5 bg-blue-500/10 text-blue-400 text-xs font-semibold rounded-md">Category</span>
                    <span class="text-emerald-400 font-bold text-lg" id="taskReward">$0.00</span>
                </div>
                <h3 id="taskTitle" class="text-xl font-bold text-white">Loading task...</h3>
                
                <!-- Slots & Time Info Section -->
                <div class="space-y-2 pt-2 border-t border-slate-800/80">
                    <div id="taskSlots" class="text-xs text-slate-300 font-medium">
                        Loading slots info...
                    </div>
                    <div>
                        <span id="taskTimeLimit" class="text-xs text-amber-400 font-semibold">Time Limit: 0 Minutes</span>
                    </div>
                </div>

                <div class="pt-2">
                    <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Instructions:</h4>
                    <p id="taskDesc" class="text-sm text-slate-300 whitespace-pre-line">Please wait while loading details...</p>
                </div>
            </div>

            <!-- Proof Submission Form -->
            <div class="p-8 bg-slate-900 border border-slate-800 rounded-3xl shadow-xl space-y-4">
                <h3 class="text-lg font-bold text-white">Submit Your Proof</h3>
                <form id="proofForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Proof Details (Task Proof / Screenshot Link)</label>
                        <textarea id="proofText" rows="4" required placeholder="Enter details or image link proving you completed the task..." class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-blue-500"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-600/30 transition-all">Submit Task Proof</button>
                </form>
            </div>
        </div>
    </main>

    <script type="module">
        import { observeAuthState } from '../firebase/auth.js';
        import { db } from '../firebase/firebase-config.js';
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { submitTaskProof } from '../firebase/firestore.js';

        const urlParams = new URLSearchParams(window.location.search);
        const taskId = urlParams.get('id');

        observeAuthState(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            if (!taskId) {
                alert('Invalid Task ID');
                window.location.href = 'tasks.html';
                return;
            }

            try {
                const taskDoc = await getDoc(doc(db, "tasks", taskId));
                if (taskDoc.exists()) {
                    const task = taskDoc.data();
                    
                    const totalSlots = task.slots || 0;
                    const remaining = task.remainingSlots ?? totalSlots;
                    const completedCount = totalSlots - remaining;

                    document.getElementById('taskTitle').innerText = task.title;
                    document.getElementById('taskCategory').innerText = task.category || 'General';
                    document.getElementById('taskReward').innerText = `$${(task.reward || 0).toFixed(2)}`;
                    
                    // টোটাল, কমপ্লিট এবং রিমেইনিং স্লট হিসাব দেখানো
                    document.getElementById('taskSlots').innerHTML = `
                        Total Slots: <span class="text-white font-bold">${totalSlots}</span> | 
                        Completed: <span class="text-emerald-400 font-bold">${completedCount >= 0 ? completedCount : 0}</span> | 
                        Remaining: <span class="text-amber-400 font-bold">${remaining >= 0 ? remaining : 'Unlimited'}</span>
                    `;

                    document.getElementById('taskTimeLimit').innerText = `Time Limit: ${task.timeLimit || 15} Minutes`;
                    document.getElementById('taskDesc').innerText = task.description;
                } else {
                    alert('Task not found');
                    window.location.href = 'tasks.html';
                }
            } catch (err) {
                console.error(err);
            }
        });

        document.getElementById('proofForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            try {
                await submitTaskProof({
                    taskId: taskId,
                    proof: document.getElementById('proofText').value
                });
                alert('Task proof submitted successfully! Waiting for admin review.');
                window.location.href = 'tasks.html';
            } catch (err) {
                alert('Error submitting proof: ' + err.message);
            }
        });
    </script>
</body>
</html>
