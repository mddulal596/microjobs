<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Details - Micro Job Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; min-height: 100vh; background-color: #1e293b; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 10px 25px rgba(0,0,0,0.3); position: relative; padding-bottom: 30px; }
        
        /* Header */
        header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .back-link { color: #38bdf8; text-decoration: none; font-size: 12px; font-weight: bold; }
        .profile-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid #38bdf8; }

        /* Main Content */
        main { padding: 20px; flex-grow: 1; overflow-y: auto; }
        .task-card { background: #0f172a; border: 1px solid #334155; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .task-title { font-size: 15px; font-weight: 700; color: #f8fafc; margin-bottom: 8px; }
        .task-reward { font-size: 14px; font-weight: 800; color: #4ade80; margin-bottom: 12px; display: inline-block; background: rgba(74, 222, 128, 0.1); padding: 4px 10px; border-radius: 8px; }
        .section-heading { font-size: 12px; font-weight: bold; color: #94a3b8; text-transform: uppercase; margin-top: 14px; margin-bottom: 6px; }
        .task-desc { font-size: 12px; color: #cbd5e1; line-height: 1.5; }
        
        .proof-box { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
        .proof-input { width: 100%; padding: 10px 14px; background: #1e293b; border: 1px solid #475569; border-radius: 10px; color: #fff; font-size: 12px; outline: none; }
        .proof-input:focus { border-color: #38bdf8; }
        
        .btn-submit { width: 100%; background: #2563eb; color: #ffffff; border: none; padding: 12px; border-radius: 12px; font-weight: bold; font-size: 13px; cursor: pointer; margin-top: 16px; transition: 0.2s; }
        .btn-submit:hover { background: #1d4ed8; }

        .error-box { text-align: center; padding: 40px 20px; color: #94a3b8; font-size: 13px; }
        
        /* Footer */
        footer { text-align: center; font-size: 10px; color: #64748b; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <!-- Header -->
            <header>
                <a href="microjobs.html" class="back-link">← Back to Tasks</a>
                <div id="userAvatar">
                    <img src="https://via.placeholder.com/32" alt="Profile" class="profile-img" id="profileImg">
                </div>
            </header>

            <!-- Main Content Area -->
            <main id="mainContent">
                <div class="error-box">টাস্ক লোড হচ্ছে...</div>
            </main>
        </div>

        <footer>
            &copy; 2026 MicroJobPro. All rights reserved.
        </footer>
    </div>

    <!-- Firebase & Logic Script -->
    <script type="module">
        import { observeAuthState } from '../firebase/auth.js';
        import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const db = getFirestore();

        // স্ট্যাটিক টাস্ক ডাটা (যদি ফায়ারবেজে আইডি না থাকে তবে এটি কাজ করবে)
        const staticTasks = {
            "1": {
                title: "YouTube Video Watch & Subscribe",
                reward: "+৳ 0.15",
                amountValue: 0.15,
                description: "1. Watch the full video without skipping.\n2. Like the video and subscribe to the channel permanently.\n3. Drop a positive comment.",
                proofNote: "Submit your YouTube channel username / profile link and comment screenshot text."
            },
            "2": {
                title: "Facebook Page Follow & Share",
                reward: "+৳ 0.15",
                amountValue: 0.15,
                description: "1. Follow our official Facebook page.\n2. Share the pinned post on your personal timeline publicly.",
                proofNote: "Submit your Facebook profile link and your share link."
            },
            "3": {
                title: "Website Visit & Click Ads",
                reward: "+৳ 0.25",
                amountValue: 0.25,
                description: "1. Browse our target website for at least 2 minutes.\n2. Click on any one banner advertisement on the site.",
                proofNote: "Submit the visited page URL or proof of ad click."
            }
        };

        let currentUser = null;
        const urlParams = new URLSearchParams(window.location.search);
        const taskId = urlParams.get('id');

        observeAuthState(async (userData) => {
            if (userData) {
                currentUser = userData;
                const name = userData.fullName || userData.displayName || "U";
                if(userData.photoURL) {
                    document.getElementById('profileImg').src = userData.photoURL;
                }

                await loadTaskDetails(taskId);
            } else {
                window.location.href = 'login.html';
            }
        });

        async function loadTaskDetails(id) {
            const mainContent = document.getElementById('mainContent');
            if (!id) {
                mainContent.innerHTML = `<div class="error-box">টাস্ক আইডি পাওয়া যায়নি! <br><br> <a href="microjobs.html" class="back-link">Back to Tasks</a></div>`;
                return;
            }

            let taskData = null;

            // প্রথমে চেক করবো স্ট্যাটিক লিস্টে আছে কি না
            if (staticTasks[id]) {
                taskData = staticTasks[id];
            } else {
                // যদি ফায়ারবেজ থেকে আনতে হয়
                try {
                    const docRef = doc(db, "microjobs", id);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        taskData = docSnap.data();
                    }
                } catch (err) {
                    console.error(err);
                }
            }

            if (!taskData) {
                mainContent.innerHTML = `
                    <div class="error-box">
                        টাস্কটি খুঁজে পাওয়া যায়নি অথবা মুছে ফেলা হয়েছে।<br><br>
                        <a href="microjobs.html" class="back-link" style="display:inline-block; background:#2563eb; color:#fff; padding:8px 16px; border-radius:8px;">Back to Tasks</a>
                    </div>`;
                return;
            }

            // রেন্ডার টাস্ক ডিটেইলস ফরম
            mainContent.innerHTML = `
                <div class="task-card">
                    <h2 class="task-title">${taskData.title}</h2>
                    <div class="task-reward">${taskData.reward || ('+৳ ' + taskData.amountValue)}</div>
                    
                    <div class="section-heading">Task Description</div>
                    <p class="task-desc" style="white-space: pre-line;">${taskData.description}</p>

                    <div class="section-heading">Required Proof Submission</div>
                    <p class="task-desc">${taskData.proofNote || 'Submit your work proof below:'}</p>

                    <div class="proof-box">
                        <input type="text" id="proofText" class="proof-input" placeholder="Enter your proof details (e.g. username / link)..." required>
                        <button id="submitProofBtn" class="btn-submit">Submit Proof</button>
                    </div>
                </div>
            `;

            document.getElementById('submitProofBtn').addEventListener('click', async () => {
                const proofVal = document.getElementById('proofText').value.trim();
                if (!proofVal) {
                    alert('দয়া করে প্রুফ বা প্রমাণ লিখুন।');
                    return;
                }

                const btn = document.getElementById('submitProofBtn');
                btn.disabled = true;
                btn.innerText = 'Submitting...';

                try {
                    await addDoc(collection(db, "task_submissions"), {
                        taskId: id,
                        taskTitle: taskData.title,
                        userId: currentUser.uid,
                        userName: currentUser.fullName || currentUser.displayName || 'User',
                        proof: proofVal,
                        status: 'pending',
                        timestamp: serverTimestamp()
                    });

                    alert('টাস্ক প্রুফ সফলভাবে জমা হয়েছে!');
                    window.location.href = 'microjobs.html';
                } catch (error) {
                    console.error(error);
                    alert('প্রুফ জমা দিতে সমস্যা হয়েছে। আবার চেষ্টা করুন।');
                    btn.disabled = false;
                    btn.innerText = 'Submit Proof';
                }
            });
        }
    </script>
</body>
</html>
