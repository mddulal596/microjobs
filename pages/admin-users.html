<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f3f4f6; color: #1f2937; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; min-height: 100vh; background-color: #ffffff; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; padding-bottom: 90px; }
        
        /* Header */
        header { background-color: #1e1b4b; color: #ffffff; padding: 20px; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; box-shadow: 0 4px 12px rgba(30, 27, 75, 0.2); }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .profile-btn { display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); padding: 6px 12px; border-radius: 50px; color: #fff; text-decoration: none; font-size: 12px; font-weight: bold; }
        .profile-icon { width: 24px; height: 24px; background: #ffffff; color: #1e1b4b; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; }
        .home-link { background: rgba(255, 255, 255, 0.15); padding: 6px 14px; border-radius: 50px; color: #fff; text-decoration: none; font-size: 12px; font-weight: bold; }
        
        .search-box input { width: 100%; padding: 10px 14px; border-radius: 12px; border: none; outline: none; font-size: 12px; background: rgba(255, 255, 255, 0.15); color: #fff; }
        .search-box input::placeholder { color: #cbd5e1; }

        /* Main Content */
        main { padding: 16px; flex-grow: 1; overflow-y: auto; }
        .section-title { font-size: 11px; font-weight: bold; color: #374151; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; }

        /* User List Box */
        .user-list { display: flex; flex-direction: column; gap: 10px; }
        .user-card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 14px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .user-info h4 { font-size: 12px; font-weight: 700; color: #1f2937; margin-bottom: 2px; }
        .user-info p { font-size: 10px; color: #6b7280; line-height: 1.4; }
        .user-balance { font-size: 11px; font-weight: 700; color: #4f46e5; margin-top: 3px; display: block; }

        .card-actions { display: flex; gap: 6px; }
        .btn-edit { background: #e0e7ff; color: #3730a3; border: none; padding: 6px 10px; border-radius: 8px; font-size: 10px; font-weight: bold; cursor: pointer; }
        .btn-ban { background: #fee2e2; color: #b91c1c; border: none; padding: 6px 10px; border-radius: 8px; font-size: 10px; font-weight: bold; cursor: pointer; }
        .no-data { text-align: center; color: #6b7280; font-size: 12px; margin-top: 30px; }

        /* Bottom Nav */
        nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #ffffff; border-top: 1px solid #e5e7eb; display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #6b7280; font-size: 10px; gap: 2px; }
        .nav-icon-circle { width: 36px; height: 36px; background: #f3f4f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #4b5563; }
        .nav-item:hover { color: #4f46e5; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Top Header -->
        <header>
            <div class="header-top">
                <a href="admin.html" class="profile-btn">
                    <div class="profile-icon">A</div>
                    <span>Admin Control</span>
                </a>
                <a href="admin.html" class="home-link">Home</a>
            </div>
            <div class="search-box">
                <input type="text" placeholder="Search user by name or email..." id="searchInput">
            </div>
        </header>

        <!-- Main Content Area -->
        <main>
            <h2 class="section-title">All Registered Users</h2>

            <!-- User List Container -->
            <div class="user-list" id="userListContainer">
                <div class="no-data">Loading users...</div>
            </div>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav>
            <a href="https://t.me/microjobspro" target="_blank" class="nav-item">
                <span style="font-size: 16px;">🎧</span>
                <span>Help</span>
            </a>
            <a href="wallet.html" class="nav-item">
                <span style="font-size: 16px;">👛</span>
                <span>Wallet</span>
            </a>
            <a href="admin.html" class="nav-item">
                <div class="nav-icon-circle">🏠</div>
                <span style="font-weight: 500;">Home</span>
            </a>
            <a href="referral.html" class="nav-item">
                <div class="nav-icon-circle">👥</div>
                <span style="font-weight: 500;">Team</span>
            </a>
            <a href="profile.html" class="nav-item">
                <span style="font-size: 16px;">👤</span>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <!-- Firebase Script & Logic -->
    <script type="module">
        import { observeAuthState } from '../firebase/auth.js';
        import { db } from '../firebase/firebase-config.js';
        import { collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let allUsersData = [];

        observeAuthState(async (userData) => {
            if (!userData) {
                window.location.href = 'login.html';
                return;
            }
            await loadUsers();
        });

        async function loadUsers() {
            const container = document.getElementById('userListContainer');
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                if (querySnapshot.empty) {
                    container.innerHTML = `<div class="no-data">কোনো রেজিস্টার্ড ইউজার পাওয়া যায়নি।</div>`;
                    return;
                }

                allUsersData = [];
                querySnapshot.forEach((document) => {
                    allUsersData.push({ id: document.id, ...document.data() });
                });

                renderUserList(allUsersData);
            } catch (error) {
                console.error("Error loading users: ", error);
                container.innerHTML = `<div class="no-data" style="color: red;">ইউজার ডেটা লোড করতে সমস্যা হয়েছে।</div>`;
            }
        }

        function renderUserList(users) {
            const container = document.getElementById('userListContainer');
            if (users.length === 0) {
                container.innerHTML = `<div class="no-data">কোনো ইউজার পাওয়া যায়নি।</div>`;
                return;
            }

            container.innerHTML = "";
            users.forEach((data) => {
                const mainBal = data.balances?.main || 0;
                const depositBal = data.balances?.deposit || 0;
                const displayName = data.displayName || data.name || "User";
                const email = data.email || "No Email";

                const card = document.createElement('div');
                card.className = 'user-card';
                card.id = data.id;
                card.innerHTML = `
                    <div class="user-info">
                        <h4>${displayName}</h4>
                        <p>${email}</p>
                        <span class="user-balance">Main: ৳${mainBal.toFixed(2)} | Deposit: ৳${depositBal.toFixed(2)}</span>
                    </div>
                    <div class="card-actions">
                        <button onclick="handleUserEdit('${data.id}', '${displayName}', ${mainBal}, ${depositBal})" class="btn-edit">Edit</button>
                        <button onclick="handleUserBan('${data.id}', '${displayName}')" class="btn-ban">Ban</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // লাইভ সার্চ ফিল্টার লজিক
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchText = e.target.value.toLowerCase();
            const filtered = allUsersData.filter(user => {
                const name = (user.displayName || user.name || "").toLowerCase();
                const email = (user.email || "").toLowerCase();
                return name.includes(searchText) || email.includes(searchText);
            });
            renderUserList(filtered);
        });

        // ব্যালেন্স এডিট ফাংশন
        window.handleUserEdit = async function(userId, userName, currentMain, currentDeposit) {
            const newMain = prompt(`"${userName}" এর নতুন মূল ব্যালেন্স (Main Balance) লিখুন:`, currentMain);
            if (newMain === null) return;
            const newDeposit = prompt(`"${userName}" এর নতুন ডিপোজিট ব্যালেন্স (Deposit Balance) লিখুন:`, currentDeposit);
            if (newDeposit === null) return;

            try {
                const userRef = doc(db, "users", userId);
                await updateDoc(userRef, {
                    "balances.main": Number(newMain),
                    "balances.deposit": Number(newDeposit)
                });
                alert(`"${userName}" এর ব্যালেন্স সফলভাবে আপডেট করা হয়েছে!`);
                location.reload();
            } catch (error) {
                console.error("Error updating user balance: ", error);
                alert("ব্যালেন্স আপডেট করতে সমস্যা হয়েছে।");
            }
        }

        // ইউজার ব্যান বা রিমুভ ফাংশন
        window.handleUserBan = async function(userId, userName) {
            if (!confirm(`আপনি কি নিশ্চিতভাবে "${userName}" ইউজারকে ব্যান করতে চান?`)) return;

            try {
                // চাইলে ডাটাবেজ থেকে ডিলেট বা স্ট্যাটাস 'banned' করা যেতে পারে
                await deleteDoc(doc(db, "users", userId));
                alert(`"${userName}" ইউজারকে সিস্টেম থেকে রিমুভ বা ব্যান করা হয়েছে!`);
                
                const card = document.getElementById(userId);
                if (card) card.remove();

                if (document.getElementById('userListContainer').children.length === 0) {
                    document.getElementById('userListContainer').innerHTML = `<div class="no-data">কোনো ইউজার পাওয়া যায়নি।</div>`;
                }
            } catch (error) {
                console.error("Error banning user: ", error);
                alert("ইউজার ব্যান করতে সমস্যা হয়েছে।");
            }
        }
    </script>
</body>
</html>
