<!DOCTYPE html>
<html lang="en" class="transform-gpu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased transform-gpu">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between">
        <header class="p-4 bg-red-600 text-white rounded-b-3xl shadow-md flex justify-between items-center">
            <h1 class="text-lg font-bold">Admin Panel</h1>
            <a href="dashboard.html" class="text-xs bg-red-700 px-3 py-1 rounded-full">Dashboard</a>
        </header>

        <main class="p-4 flex-grow space-y-6 overflow-y-auto">
            <!-- Task Submissions Section -->
            <div>
                <h2 class="text-sm font-bold text-gray-700 mb-2">Pending Task Submissions</h2>
                <div id="adminSubmissions" class="space-y-3">
                    <p class="text-center text-gray-500 text-xs">Loading submissions...</p>
                </div>
            </div>

            <!-- Withdrawals Section -->
            <div>
                <h2 class="text-sm font-bold text-gray-700 mb-2">Pending Withdrawals</h2>
                <div id="adminWithdrawals" class="space-y-3">
                    <p class="text-center text-gray-500 text-xs">Loading requests...</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { observeAuthState } from '../firebase/auth.js';
        import { collection, getDocs, doc, updateDoc, getDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        observeAuthState((user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            loadSubmissions();
            loadAdminWithdrawals();
        });

        // Load Task Submissions
        async function loadSubmissions() {
            const container = document.getElementById('adminSubmissions');
            try {
                const querySnapshot = await getDocs(collection(db, "submissions"));
                if (querySnapshot.empty) {
                    container.innerHTML = `<p class="text-center text-gray-400 text-xs">No submissions found.</p>`;
                    return;
                }

                container.innerHTML = "";
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    if (data.status !== 'pending') return;

                    const card = document.createElement('div');
                    card.className = "bg-gray-50 border border-gray-200 p-3 rounded-2xl space-y-2 shadow-sm";
                    card.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-gray-800">${data.userEmail}</span>
                            <span class="text-[10px] uppercase font-bold bg-amber-100 text-amber-700 px-2 py-0.5 rounded">${data.status}</span>
                        </div>
                        <p class="text-xs text-gray-600">Proof: <b>${data.proofText}</b></p>
                        ${data.proofImageURL ? `<a href="${data.proofImageURL}" target="_blank" class="text-xs text-indigo-600 underline block">View Screenshot Proof</a>` : ''}
                        <div class="flex justify-end gap-2 pt-1">
                            <button onclick="approveTask('${id}', '${data.userId}', '${data.taskId}')" class="px-3 py-1 bg-emerald-600 text-white text-xs font-bold rounded-lg shadow hover:bg-emerald-700 transition">Approve</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(err);
            }
        }

        window.approveTask = async function(subId, userId, taskId) {
            try {
                // Get task reward
                const taskRef = doc(db, "tasks", taskId);
                const taskSnap = await getDoc(taskRef);
                let reward = 5; // default fallback
                if (taskSnap.exists()) {
                    reward = parseFloat(taskSnap.data().reward || 5);
                }

                // Update submission status
                await updateDoc(doc(db, "submissions", subId), { status: "approved" });

                // Add reward to user balance
                await updateDoc(doc(db, "users", userId), {
                    "balances.main": increment(reward)
                });

                alert("Task approved and reward added to user balance!");
                loadSubmissions();
            } catch (err) {
                alert("Error: " + err.message);
            }
        };

        // Load Withdrawals
        async function loadAdminWithdrawals() {
            const container = document.getElementById('adminWithdrawals');
            try {
                const querySnapshot = await getDocs(collection(db, "withdrawals"));
                if (querySnapshot.empty) {
                    container.innerHTML = `<p class="text-center text-gray-400 text-xs">No withdrawal requests.</p>`;
                    return;
                }

                container.innerHTML = "";
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;

                    const card = document.createElement('div');
                    card.className = "bg-gray-50 border border-gray-200 p-3 rounded-2xl space-y-2 shadow-sm";
                    card.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-gray-800">${data.userEmail}</span>
                            <span class="text-xs font-extrabold text-indigo-600">৳ ${data.amount}</span>
                        </div>
                        <p class="text-xs text-gray-600">Method: <b>${data.method}</b> | A/C: <b>${data.accountNo}</b></p>
                        <div class="flex justify-between items-center pt-1">
                            <span class="text-[10px] uppercase font-bold bg-amber-100 text-amber-700 px-2 py-0.5 rounded">${data.status}</span>
                            ${data.status === 'pending' ? `<button onclick="markAsPaid('${id}')" class="px-3 py-1 bg-emerald-600 text-white text-xs font-bold rounded-lg shadow hover:bg-emerald-700 transition">Mark Paid</button>` : ''}
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(err);
            }
        }

        window.markAsPaid = async function(id) {
            try {
                await updateDoc(doc(db, "withdrawals", id), { status: "paid" });
                alert("Withdrawal marked as paid!");
                loadAdminWithdrawals();
            } catch (err) {
                alert("Error: " + err.message);
            }
        };
    </script>
</body>
</html>
