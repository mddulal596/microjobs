<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin Panel - Micro Job Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>  
</head>
<body class="bg-gray-100 text-gray-800 antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-12">
        
        <!-- Header -->
        <header class="p-5 bg-gradient-to-r from-purple-700 to-indigo-800 text-white rounded-b-3xl shadow-lg flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="dashboard.html" class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center text-white hover:bg-white/30 transition">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </a>
                <h1 class="text-sm font-bold">Master Admin Panel</h1>
            </div>
            <span class="text-xs bg-red-500 px-3 py-1.5 rounded-full font-semibold">Super Admin</span>
        </header>

        <!-- Main Content -->
        <main class="p-4 flex-grow space-y-6">
            
            <!-- 1. Post New Task / Job -->
            <div class="bg-white border border-gray-100 p-4 rounded-2xl shadow-sm space-y-3">
                <h2 class="text-xs font-bold text-gray-800 uppercase tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-indigo-600"></i> Post New Task / Job
                </h2>
                <form id="taskForm" class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">Task Title</label>
                        <input type="text" id="taskTitle" required placeholder="e.g. Watch YouTube Video" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-600">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 mb-1">Reward (৳)</label>
                            <input type="number" step="0.01" id="taskReward" required placeholder="1.50" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-600">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 mb-1">Total Workers</label>
                            <input type="number" id="taskWorkers" required placeholder="100" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-600">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">Task Link / Proof Details</label>
                        <input type="text" id="taskLink" required placeholder="https://example.com" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-600">
                    </div>
                    <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition">
                        Publish Task
                    </button>
                </form>
            </div>

            <!-- 2. Post PTC Ad -->
            <div class="bg-white border border-gray-100 p-4 rounded-2xl shadow-sm space-y-3">
                <h2 class="text-xs font-bold text-gray-800 uppercase tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-rectangle-ad text-purple-600"></i> Post New PTC Ad
                </h2>
                <form id="adForm" class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">Ad Title</label>
                        <input type="text" id="adTitle" required placeholder="e.g. Visit Sponsor Link" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-600">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 mb-1">Duration (Seconds)</label>
                            <input type="number" id="adDuration" required placeholder="15" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-600">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 mb-1">Reward (৳)</label>
                            <input type="number" step="0.01" id="adReward" required placeholder="0.50" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-600">
                        </div>
                    </div>
                    <button type="submit" class="w-full py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs rounded-xl shadow-md transition">
                        Publish PTC Ad
                    </button>
                </form>
            </div>

            <!-- 3. Update Site Notice -->
            <div class="bg-white border border-gray-100 p-4 rounded-2xl shadow-sm space-y-3">
                <h2 class="text-xs font-bold text-gray-800 uppercase tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-bullhorn text-amber-500"></i> Set Global Notice
                </h2>
                <form id="noticeForm" class="space-y-3">
                    <div>
                        <textarea id="noticeText" rows="2" required placeholder="Write important notice for users..." class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-600"></textarea>
                    </div>
                    <button type="submit" class="w-full py-2 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs rounded-xl shadow-md transition">
                        Update Notice
                    </button>
                </form>
            </div>

            <!-- 4. Worker Submissions Review -->
            <div class="bg-white border border-gray-100 p-4 rounded-2xl shadow-sm space-y-3">
                <h2 class="text-xs font-bold text-gray-800 uppercase tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-green-600"></i> Worker Submissions Review
                </h2>
                <div id="submissionsContainer" class="space-y-2 text-xs text-gray-500">
                    <p>Loading pending submissions...</p>
                </div>
            </div>

            <!-- 5. Withdraw Requests Management -->
            <div class="bg-white border border-gray-100 p-4 rounded-2xl shadow-sm space-y-3">
                <h2 class="text-xs font-bold text-gray-800 uppercase tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-wallet text-blue-600"></i> Withdraw Requests
                </h2>
                <div id="withdrawsContainer" class="space-y-2 text-xs text-gray-500">
                    <p>Loading withdraw requests...</p>
                </div>
            </div>

            <!-- 6. Manage / Delete Active Tasks -->
            <div class="bg-white border border-gray-100 p-4 rounded-2xl shadow-sm space-y-3">
                <h2 class="text-xs font-bold text-gray-800 uppercase tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-tasks text-rose-600"></i> Active Tasks List
                </h2>
                <div id="tasksListContainer" class="space-y-2 text-xs text-gray-500">
                    <p>Loading active tasks...</p>
                </div>
            </div>

        </main>
    </div>

    <!-- Firebase Admin Logic -->
    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { collection, addDoc, getDocs, doc, updateDoc, deleteDoc, increment, serverTimestamp, query, where, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 1. Handle Task Posting
        document.getElementById('taskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('taskTitle').value;
            const reward = parseFloat(document.getElementById('taskReward').value);
            const workers = parseInt(document.getElementById('taskWorkers').value);
            const link = document.getElementById('taskLink').value;

            try {
                await addDoc(collection(db, "tasks"), {
                    title, reward, workers, link,
                    status: "active",
                    timestamp: serverTimestamp()
                });
                alert("Task posted successfully!");
                document.getElementById('taskForm').reset();
                loadActiveTasks();
            } catch (error) {
                console.error("Error posting task: ", error);
                alert("Failed to post task.");
            }
        });

        // 2. Handle PTC Ad Posting
        document.getElementById('adForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('adTitle').value;
            const duration = parseInt(document.getElementById('adDuration').value);
            const reward = parseFloat(document.getElementById('adReward').value);

            try {
                await addDoc(collection(db, "ptc_ads"), {
                    title, duration, reward,
                    status: "active",
                    timestamp: serverTimestamp()
                });
                alert("PTC Ad posted successfully!");
                document.getElementById('adForm').reset();
            } catch (error) {
                console.error("Error posting ad: ", error);
                alert("Failed to post ad.");
            }
        });

        // 3. Handle Global Notice Update
        document.getElementById('noticeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = document.getElementById('noticeText').value;

            try {
                // Stores notice in a settings document
                await setDoc(doc(db, "settings", "global_notice"), {
                    notice: text,
                    updatedAt: serverTimestamp()
                }, { merge: true });
                alert("Notice updated successfully!");
            } catch (error) {
                console.error("Error updating notice: ", error);
                alert("Failed to update notice.");
            }
        });

        // 4. Load Pending Submissions
        async function loadSubmissions() {
            const container = document.getElementById('submissionsContainer');
            try {
                const q = query(collection(db, "submissions"), where("status", "==", "pending"));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    container.innerHTML = `<p class="text-gray-400 text-center py-2">No pending submissions.</p>`;
                    return;
                }

                container.innerHTML = "";
                querySnapshot.forEach((documentSnap) => {
                    const sub = documentSnap.data();
                    const subId = documentSnap.id;

                    const card = document.createElement('div');
                    card.className = "border border-gray-100 bg-gray-50 p-3 rounded-xl flex flex-col gap-2";
                    card.innerHTML = `
                        <div>
                            <span class="font-bold text-gray-800">Task: ${sub.taskTitle || 'N/A'}</span>
                            <p class="text-[10px] text-gray-500 mt-0.5">Proof: ${sub.proofText || sub.proof || 'No proof provided'}</p>
                            <p class="text-[10px] text-indigo-600 font-semibold mt-1">Reward: ৳ ${sub.reward || 0}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="approveSub('${subId}', '${sub.userId}', ${sub.reward || 0})" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-1.5 rounded-lg font-bold text-[10px] transition">Approve</button>
                            <button onclick="rejectSub('${subId}')" class="flex-1 bg-red-500 hover:bg-red-600 text-white py-1.5 rounded-lg font-bold text-[10px] transition">Reject</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading submissions:", error);
                container.innerHTML = `<p class="text-red-500">Failed to load submissions.</p>`;
            }
        }

        window.approveSub = async function(subId, userId, rewardAmount) {
            try {
                await updateDoc(doc(db, "submissions", subId), { status: "approved" });
                await updateDoc(doc(db, "users", userId), {
                    mainBalance: increment(rewardAmount),
                    "balances.main": increment(rewardAmount)
                });
                alert("Submission approved & balance added!");
                loadSubmissions();
            } catch (error) {
                console.error("Error approving:", error);
                alert("Failed to approve.");
            }
        }

        window.rejectSub = async function(subId) {
            try {
                await updateDoc(doc(db, "submissions", subId), { status: "rejected" });
                alert("Submission rejected.");
                loadSubmissions();
            } catch (error) {
                console.error("Error rejecting:", error);
                alert("Failed to reject.");
            }
        }

        // 5. Load Withdraw Requests
        async function loadWithdraws() {
            const container = document.getElementById('withdrawsContainer');
            try {
                const q = query(collection(db, "withdraws"), where("status", "==", "pending"));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    container.innerHTML = `<p class="text-gray-400 text-center py-2">No pending withdraw requests.</p>`;
                    return;
                }

                container.innerHTML = "";
                querySnapshot.forEach((documentSnap) => {
                    const wd = documentSnap.data();
                    const wdId = documentSnap.id;

                    const card = document.createElement('div');
                    card.className = "border border-gray-100 bg-gray-50 p-3 rounded-xl flex flex-col gap-1.5";
                    card.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-gray-800 uppercase">${wd.method || 'Wallet'}</span>
                            <span class="font-black text-indigo-600 text-xs">৳ ${wd.amount || 0}</span>
                        </div>
                        <p class="text-[10px] text-gray-600">Account/Number: <b class="text-gray-800">${wd.accountNumber || wd.number || 'N/A'}</b></p>
                        <button onclick="completeWithdraw('${wdId}')" class="w-full mt-1 bg-blue-600 hover:bg-blue-700 text-white py-1.5 rounded-lg font-bold text-[10px] transition">Mark as Paid</button>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading withdraws:", error);
                container.innerHTML = `<p class="text-red-500">Failed to load withdraws.</p>`;
            }
        }

        window.completeWithdraw = async function(wdId) {
            try {
                await updateDoc(doc(db, "withdraws", wdId), { status: "paid" });
                alert("Withdraw marked as paid!");
                loadWithdraws();
            } catch (error) {
                console.error("Error updating withdraw:", error);
                alert("Failed to update.");
            }
        }

        // 6. Load Active Tasks for Delete/Manage
        async function loadActiveTasks() {
            const container = document.getElementById('tasksListContainer');
            try {
                const querySnapshot = await getDocs(collection(db, "tasks"));
                
                if (querySnapshot.empty) {
                    container.innerHTML = `<p class="text-gray-400 text-center py-2">No active tasks found.</p>`;
                    return;
                }

                container.innerHTML = "";
                querySnapshot.forEach((documentSnap) => {
                    const task = documentSnap.data();
                    const taskId = documentSnap.id;

                    const card = document.createElement('div');
                    card.className = "border border-gray-100 bg-gray-50 p-2.5 rounded-xl flex items-center justify-between gap-2";
                    card.innerHTML = `
                        <div class="overflow-hidden">
                            <h4 class="font-bold text-gray-800 truncate text-[11px]">${task.title}</h4>
                            <p class="text-[10px] text-gray-500">Reward: ৳ ${task.reward} | Workers: ${task.workers}</p>
                        </div>
                        <button onclick="deleteTask('${taskId}')" class="bg-red-500 hover:bg-red-600 text-white px-2.5 py-1.5 rounded-lg font-bold text-[10px] transition whitespace-nowrap">Delete</button>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading tasks:", error);
                container.innerHTML = `<p class="text-red-500">Failed to load tasks.</p>`;
            }
        }

        window.deleteTask = async function(taskId) {
            if (confirm("Are you sure you want to delete this task?")) {
                try {
                    await deleteDoc(doc(db, "tasks", taskId));
                    alert("Task deleted successfully!");
                    loadActiveTasks();
                } catch (error) {
                    console.error("Error deleting task:", error);
                    alert("Failed to delete task.");
                }
            }
        }

        // Initial Data Loaders
        loadSubmissions();
        loadWithdraws();
        loadActiveTasks();
    </script>
</body>
</html>
