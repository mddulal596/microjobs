<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Control Admin - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>  
</head>
<body class="bg-gray-100 text-gray-800 antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-12">
        
        <!-- Header -->
        <header class="p-5 bg-gradient-to-r from-purple-700 to-indigo-800 text-white rounded-b-3xl shadow-lg flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="dashboard.html" class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center text-white hover:bg-white/30 transition">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </a>
                <h1 class="text-sm font-bold">Master Admin Panel</h1>
            </div>
            <span class="text-xs bg-red-500 px-3 py-1.5 rounded-full font-semibold">Super Admin</span>
        </header>

        <!-- Main Content -->
        <main class="p-4 flex-grow space-y-6">
            
            <!-- 1. Review Pending User Jobs (নতুন যুক্ত করা হয়েছে) -->
            <div class="bg-white border border-amber-200 p-4 rounded-2xl shadow-sm space-y-3 bg-amber-50/20">
                <h2 class="text-xs font-bold text-amber-800 uppercase tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-clock text-amber-500"></i> Pending User Posted Jobs
                </h2>
                <div id="pendingJobsContainer" class="space-y-2 text-xs text-gray-500">
                    <p class="text-center py-2">Loading pending jobs...</p>
                </div>
            </div>

            <!-- 2. Post New Task / Job Direct by Admin -->
            <div class="bg-white border border-gray-100 p-4 rounded-2xl shadow-sm space-y-3">
                <h2 class="text-xs font-bold text-gray-800 uppercase tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-indigo-600"></i> Post Admin Job (Direct Active)
                </h2>
                <form id="taskForm" class="space-y-3">
                    <input type="hidden" id="editTaskId">
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">Task Category</label>
                        <select id="taskCategory" required class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-600">
                            <option value="daily-jobs">Daily Jobs</option>
                            <option value="video">Video Task</option>
                            <option value="microjobs">Micro Jobs</option>
                            <option value="social">Social Media Task</option>
                            <option value="survey">Survey & Review</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">Task Title</label>
                        <input type="text" id="taskTitle" required placeholder="e.g. Watch YouTube Video" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-600">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 mb-1">Reward (৳)</label>
                            <input type="number" step="0.01" id="taskReward" required placeholder="1.50" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-600">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 mb-1">Total Workers</label>
                            <input type="number" id="taskWorkers" required placeholder="100" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-600">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">Task Link / Video URL</label>
                        <input type="text" id="taskLink" required placeholder="https://example.com" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-600">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">Instructions</label>
                        <textarea id="taskInstructions" rows="2" placeholder="বর্ণনা লিখুন..." class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-600"></textarea>
                    </div>
                    <button type="submit" id="taskSubmitBtn" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition">
                        Publish Direct Active Task
                    </button>
                </form>
            </div>

            <!-- 3. Manage User Balance -->
            <div class="bg-white border border-gray-100 p-4 rounded-2xl shadow-sm space-y-3">
                <h2 class="text-xs font-bold text-gray-800 uppercase tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-user-gear text-amber-600"></i> Manage User Balance
                </h2>
                <form id="userBalanceForm" class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">User Email</label>
                        <input type="text" id="targetUserEmail" required placeholder="user@gmail.com" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-600">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 mb-1">Action Type</label>
                            <select id="balanceAction" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-600">
                                <option value="add">Add (+)</option>
                                <option value="subtract">Subtract (-)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 mb-1">Amount (৳)</label>
                            <input type="number" step="0.01" id="balanceAmount" required placeholder="10.00" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-xl focus:outline-none focus:border-indigo-600">
                        </div>
                    </div>
                    <button type="submit" class="w-full py-2 bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs rounded-xl shadow-md transition">
                        Update User Balance
                    </button>
                </form>
            </div>

            <!-- 4. Active Tasks List -->
            <div class="bg-white border border-gray-100 p-4 rounded-2xl shadow-sm space-y-3">
                <h2 class="text-xs font-bold text-gray-800 uppercase tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-tasks text-rose-600"></i> Active Tasks List (Edit / Delete)
                </h2>
                <div id="tasksListContainer" class="space-y-2 text-xs text-gray-500">
                    <p class="text-center py-2">Loading active tasks...</p>
                </div>
            </div>

        </main>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { collection, addDoc, getDocs, doc, updateDoc, deleteDoc, increment, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ১. পেন্ডিং জব লোড করা
        async function loadPendingJobs() {
            const container = document.getElementById('pendingJobsContainer');
            try {
                const q = query(collection(db, "tasks"), where("status", "==", "pending"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    container.innerHTML = `<p class="text-gray-400 text-center py-2">No pending jobs to approve.</p>`;
                    return;
                }

                container.innerHTML = "";
                querySnapshot.forEach((docSnap) => {
                    const task = docSnap.data();
                    const taskId = docSnap.id;

                    const card = document.createElement('div');
                    card.className = "border border-amber-200 bg-white p-3 rounded-xl flex flex-col gap-2 shadow-sm";
                    card.innerHTML = `
                        <div>
                            <span class="text-[9px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded font-semibold uppercase">${task.category || 'Job'}</span>
                            <h4 class="font-bold text-gray-800 text-xs mt-1">${task.title}</h4>
                            <p class="text-[10px] text-gray-600 mt-0.5">Reward: ৳${task.reward} | Workers: ${task.workers}</p>
                            <p class="text-[10px] text-gray-500 mt-0.5">Link: <a href="${task.link}" target="_blank" class="text-indigo-600 underline">View Task Link</a></p>
                            <p class="text-[10px] text-gray-600 mt-1 bg-gray-50 p-1.5 rounded"><b>Instructions:</b> ${task.instructions || 'N/A'}</p>
                        </div>
                        <div class="flex gap-2 mt-1">
                            <button onclick="approveJob('${taskId}')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-1.5 rounded-lg font-bold text-[10px] transition">Approve & Active</button>
                            <button onclick="rejectJob('${taskId}')" class="flex-1 bg-rose-500 hover:bg-rose-600 text-white py-1.5 rounded-lg font-bold text-[10px] transition">Reject / Delete</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading pending jobs:", error);
                container.innerHTML = `<p class="text-red-500 text-center py-2">Failed to load pending jobs.</p>`;
            }
        }

        // ২. জব এক্টিভ/অ্যাপ্রুভ করা
        window.approveJob = async function(taskId) {
            try {
                await updateDoc(doc(db, "tasks", taskId), {
                    status: "active"
                });
                alert("জবটি সফলভাবে এক্টিভ করা হয়েছে!");
                loadPendingJobs();
                loadActiveTasks();
            } catch (error) {
                alert("জব এক্টিভ করতে সমস্যা হয়েছে।");
            }
        };

        // ৩. জব রিজেক্ট করা
        window.rejectJob = async function(taskId) {
            if (confirm("আপনি কি নিশ্চিত এই জবটি রিজেক্ট ও ডিলিট করতে চান?")) {
                try {
                    await deleteDoc(doc(db, "tasks", taskId));
                    alert("জবটি রিজেক্ট ও ডিলিট করা হয়েছে।");
                    loadPendingJobs();
                } catch (error) {
                    alert("জব ডিলিট করতে সমস্যা হয়েছে।");
                }
            }
        };

        // ৪. অ্যাডমিন ডাইরেক্ট জব পোস্ট
        document.getElementById('taskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = document.getElementById('editTaskId').value;
            const category = document.getElementById('taskCategory').value;
            const title = document.getElementById('taskTitle').value;
            const reward = parseFloat(document.getElementById('taskReward').value);
            const workers = parseInt(document.getElementById('taskWorkers').value);
            const link = document.getElementById('taskLink').value;
            const instructions = document.getElementById('taskInstructions').value;
            const targetPage = (category === 'video') ? 'video.html' : 'daily-jobs.html';

            try {
                if (editId) {
                    await updateDoc(doc(db, "tasks", editId), { category, title, reward, workers, link, instructions, targetPage });
                    alert("Task updated!");
                    document.getElementById('editTaskId').value = "";
                    document.getElementById('taskSubmitBtn').innerText = "Publish Direct Active Task";
                } else {
                    await addDoc(collection(db, "tasks"), {
                        category, title, reward, workers, link, instructions, targetPage,
                        status: "active",
                        timestamp: serverTimestamp()
                    });
                    alert("Task posted and activated directly!");
                }
                document.getElementById('taskForm').reset();
                loadActiveTasks();
            } catch (error) {
                alert("Failed to save task.");
            }
        });

        // ৫. এক্টিভ জব লোড ও ডিলিট
        async function loadActiveTasks() {
            const container = document.getElementById('tasksListContainer');
            try {
                const q = query(collection(db, "tasks"), where("status", "==", "active"));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    container.innerHTML = `<p class="text-gray-400 text-center py-2">No active tasks found.</p>`;
                    return;
                }

                container.innerHTML = "";
                querySnapshot.forEach((docSnap) => {
                    const task = docSnap.data();
                    const taskId = docSnap.id;

                    const card = document.createElement('div');
                    card.className = "border border-gray-100 bg-gray-50 p-2.5 rounded-xl flex items-center justify-between gap-2";
                    card.innerHTML = `
                        <div class="overflow-hidden">
                            <span class="text-[9px] bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded font-semibold uppercase">${task.category || 'Job'}</span>
                            <h4 class="font-bold text-gray-800 truncate text-[11px] mt-0.5">${task.title}</h4>
                            <p class="text-[10px] text-gray-500">Reward: ৳ ${task.reward} | Workers: ${task.workers}</p>
                        </div>
                        <button onclick="deleteTask('${taskId}')" class="bg-red-500 hover:bg-red-600 text-white px-2 py-1.5 rounded-lg font-bold text-[10px] transition">Delete</button>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                container.innerHTML = `<p class="text-red-500">Failed to load tasks.</p>`;
            }
        }

        window.deleteTask = async function(taskId) {
            if (confirm("Delete this active task?")) {
                await deleteDoc(doc(db, "tasks", taskId));
                loadActiveTasks();
            }
        }

        // ইনিশিয়ালাইজেশন
        loadPendingJobs();
        loadActiveTasks();
    </script>
</body>
</html>
