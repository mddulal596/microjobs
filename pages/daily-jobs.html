<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Jobs - Micro Job Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Navigation Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>  
    
    <style>
        .nav-container {  
            position: fixed;  
            bottom: 15px;  
            left: 50%;
            transform: translateX(-50%);
            width: 92%;  
            max-width: 440px;  
            height: 70px;  
            background: #4f46e5;  
            border-radius: 22px;  
            display: flex;  
            justify-content: space-around;  
            align-items: center;  
            box-shadow: 0 10px 25px rgba(0,0,0,.2);  
            overflow: visible;  
            z-index: 100;
        }  
        .nav-item-animated {  
            flex: 1;  
            text-decoration: none;  
            color: #fff;  
            text-align: center;  
            position: relative;  
            z-index: 2;  
        }  
        .nav-item-animated i { font-size: 22px; transition: .25s; }  
        .nav-item-animated span { display: block; font-size: 11px; margin-top: 4px; transition: .25s; }  
        .nav-item-animated.active i { transform: translateY(-10px); }  
        .nav-item-animated.active span { font-weight: bold; }  
        .indicator {  
            position: absolute;  
            top: -15px;  
            width: 60px;  
            height: 60px;  
            background: #312e81;  
            border-radius: 50%;  
            border: 4px solid #fff;  
            transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1);  
            box-shadow: 0 0 20px rgba(49,46,129,.5);  
            z-index: 1;  
        }  
        .indicator::before {  
            content: "";  
            position: absolute;  
            inset: -6px;  
            border-radius: 50%;  
            border: 2px solid rgba(49,46,129,.4);  
            animation: pulse 2s infinite;  
        }  
        @keyframes pulse {  
            0% { transform: scale(1); opacity: 1; }  
            100% { transform: scale(1.4); opacity: 0; }  
        } 
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-36">
        
        <!-- Top Header & Balances (Dashboard Theme) -->
        <header class="p-5 bg-gradient-to-r from-purple-600 to-indigo-700 text-white rounded-b-3xl shadow-lg">
            <div class="flex justify-between items-center mb-4">
                <a href="profile.html" class="flex items-center space-x-2 bg-white/20 hover:bg-white/30 transition px-3 py-1.5 rounded-full border border-white/20">
                    <div id="profileIconBtn" class="w-6 h-6 rounded-full bg-white text-purple-700 flex items-center justify-center font-bold text-xs shadow">
                        U
                    </div>
                    <span id="userNameDisplay" class="text-xs font-bold truncate max-w-[120px]">Loading...</span>
                </a>
                <a href="dashboard.html" class="text-xs bg-white/20 hover:bg-white/30 transition px-3 py-1.5 rounded-full font-semibold border border-white/20">
                    <i class="fa-solid fa-house text-[10px] mr-1"></i> Home
                </a>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-purple-800/50 p-3 rounded-2xl backdrop-blur-sm border border-purple-400/30">
                    <p class="text-[10px] text-purple-200 font-medium">Main Balance</p>
                    <h3 id="mainBalance" class="text-base font-extrabold mt-0.5">৳ 0.00</h3>
                </div>
                <div class="bg-purple-800/50 p-3 rounded-2xl backdrop-blur-sm border border-purple-400/30">
                    <p class="text-[10px] text-purple-200 font-medium">Deposit Balance</p>
                    <h3 id="depositBalance" class="text-base font-extrabold mt-0.5">৳ 0.00</h3>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="p-4 flex-grow space-y-3">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider px-1">Available Daily Jobs</h2>

            <!-- Job List Container (Dynamic from Firebase) -->
            <div id="dailyJobsContainer" class="space-y-3">
                <div class="text-center text-gray-400 text-xs py-8">
                    <i class="fa-solid fa-spinner fa-spin text-lg mb-2"></i>
                    <p>Loading daily jobs...</p>
                </div>
            </div>
        </main>

        <!-- Screenshot Submission Modal -->
        <div id="taskModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs hidden justify-center items-center z-50 p-4">
            <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4 transform transition-all">
                <div>
                    <h3 id="modalTaskTitle" class="text-sm font-bold text-gray-800">Task Submission</h3>
                    <p class="text-xs text-gray-500 mt-1">কাজটি সম্পন্ন করে স্ক্রিনশটের লিংক (ImgBB বা ড্রাইভ লিংক) নিচে প্রদান করুন:</p>
                </div>
                
                <input type="url" id="screenshotUrlInput" class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-xs outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600" placeholder="https://i.ibb.co/... বা স্ক্রিনশট লিংক দিন" required>
                
                <div class="flex gap-2">
                    <button type="button" onclick="closeTaskModal()" class="flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs rounded-xl transition">Cancel</button>
                    <button type="button" onclick="submitTaskProof()" class="btn-submit flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow transition">Submit Proof</button>
                </div>
            </div>
        </div>

        <!-- Animated Bottom Navigation Bar -->
        <div class="nav-container">  
            <div class="indicator"></div>  
            
            <a href="https://t.me/microjobspro" target="_blank" class="nav-item-animated">  
                <i class="fa-solid fa-headset"></i>  
                <span>Help</span>  
            </a>  

            <a href="wallet.html" class="nav-item-animated">  
                <i class="fa-solid fa-wallet"></i>  
                <span>Wallet</span>  
            </a>  
            
            <a href="dashboard.html" class="nav-item-animated">  
                <i class="fa-solid fa-house"></i>  
                <span>Home</span>  
            </a>  
            
            <a href="referral.html" class="nav-item-animated">  
                <i class="fa-solid fa-user-group"></i>  
                <span>Team</span>  
            </a>  
            
            <a href="profile.html" class="nav-item-animated">  
                <i class="fa-solid fa-user"></i>  
                <span>Profile</span>  
            </a>  
        </div>  
    </div>

    <!-- Navigation Animation Script -->
    <script>  
        const items = document.querySelectorAll(".nav-item-animated");  
        const indicator = document.querySelector(".indicator");  
          
        function moveIndicator(el){  
            if (!el) return;
            const left = el.offsetLeft + (el.offsetWidth / 2) - (indicator.offsetWidth / 2);  
            indicator.style.left = left + "px";  
            items.forEach(i => i.classList.remove("active"));  
            el.classList.add("active");  
        }  
          
        items.forEach(item => {  
            item.addEventListener("click", () => {  
                moveIndicator(item);  
            });  
        });  
          
        window.addEventListener('load', () => moveIndicator(items[2]));  
        window.addEventListener('resize', () => moveIndicator(document.querySelector(".nav-item-animated.active") || items[2]));  
    </script>

    <!-- Firebase Script & Logic -->
    <script type="module">
        import { observeAuthState } from '../firebase/auth.js';
        import { getFirestore, doc, collection, addDoc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const db = getFirestore();
        let currentUserUid = null;
        let selectedTaskTitle = "";
        let selectedTaskReward = 0;

        observeAuthState((userData) => {
            if (userData) {
                currentUserUid = userData.uid;
                const name = userData.fullName || userData.displayName || "User";
                document.getElementById('profileIconBtn').innerText = name.charAt(0).toUpperCase();
                document.getElementById('userNameDisplay').innerText = name;

                const mainBal = userData.mainBalance ?? userData.balances?.main ?? 0;
                const depositBal = userData.depositBalance ?? userData.balances?.deposit ?? 0;
                document.getElementById('mainBalance').innerText = `৳ ${Number(mainBal).toFixed(2)}`;
                document.getElementById('depositBalance').innerText = `৳ ${Number(depositBal).toFixed(2)}`;

                loadDailyJobs();
            } else {
                window.location.href = 'login.html';
            }
        });

        // Firebase থেকে 'daily-jobs' ক্যাটাগরির টাস্ক ফেচ করার ফাংশন
        async function loadDailyJobs() {
            const container = document.getElementById('dailyJobsContainer');
            try {
                const q = query(
                    collection(db, "tasks"), 
                    where("category", "==", "daily-jobs"), 
                    where("status", "==", "active")
                );
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    container.innerHTML = `
                        <div class="text-center text-gray-400 text-xs py-8">
                            <i class="fa-solid fa-briefcase text-2xl mb-2"></i>
                            <p>কোনো ডেইলি জব উপলব্ধ নেই!</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = "";
                querySnapshot.forEach((docSnap) => {
                    const task = docSnap.data();

                    const card = document.createElement('div');
                    card.className = "bg-white border border-gray-100 rounded-2xl p-4 shadow-sm hover:shadow-md transition flex justify-between items-center";
                    card.innerHTML = `
                        <div class="space-y-1">
                            <h4 class="text-xs font-bold text-gray-800">${task.title}</h4>
                            <p class="text-[11px] text-gray-500">
                                Workers Left: <span class="font-semibold text-gray-700">${task.workers || 0}</span> | 
                                <a href="${task.link}" target="_blank" class="text-indigo-600 font-semibold underline">Visit Link</a>
                            </p>
                            <span class="inline-block bg-emerald-50 text-emerald-600 text-[10px] font-bold px-2 py-0.5 rounded-md uppercase">
                                +৳ ${Number(task.reward).toFixed(2)}
                            </span>
                        </div>
                        <button onclick="openTaskModal('${task.title.replace(/'/g, "\\'")}', ${task.reward})" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow transition cursor-pointer">
                            Start Task
                        </button>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading daily jobs:", error);
                container.innerHTML = `<p class="text-xs text-red-500 text-center py-4">টাস্ক লোড করতে সমস্যা হয়েছে।</p>`;
            }
        }

        window.openTaskModal = function(taskTitle, reward) {
            if (!currentUserUid) {
                alert('লগইন করা অবস্থায় নেই!');
                return;
            }
            selectedTaskTitle = taskTitle;
            selectedTaskReward = reward;
            document.getElementById('modalTaskTitle').innerText = taskTitle;
            document.getElementById('screenshotUrlInput').value = '';
            document.getElementById('taskModal').style.display = 'flex';
        }

        window.closeTaskModal = function() {
            document.getElementById('taskModal').style.display = 'none';
        }

        window.submitTaskProof = async function() {
            const screenshotUrl = document.getElementById('screenshotUrlInput').value.trim();
            if (!screenshotUrl) {
                alert('দয়া করে স্ক্রিনশটের সঠিক ইউআরএল (URL) প্রদান করুন!');
                return;
            }

            const submitBtn = document.querySelector('.btn-submit');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Submitting...';

            try {
                await addDoc(collection(db, "taskSubmissions"), {
                    userId: currentUserUid,
                    taskName: selectedTaskTitle,
                    reward: selectedTaskReward,
                    screenshotUrl: screenshotUrl,
                    status: 'pending',
                    timestamp: serverTimestamp()
                });

                alert(`অভিনন্দন! "${selectedTaskTitle}" এর প্রুফ সফলভাবে সাবমিট হয়েছে। অ্যাডমিন রিভিউ করে অ্যাপ্রুভ করলে ব্যালেন্স যোগ হবে।`);
                closeTaskModal();
                document.getElementById('screenshotUrlInput').value = '';
            } catch (error) {
                console.error("Error submitting task: ", error);
                alert('দুঃখিত, টাস্ক সাবমিট করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Submit Proof';
            }
        }
    </script>
</body>
</html>
