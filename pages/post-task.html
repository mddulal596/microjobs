<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post New Job - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between hidden md:flex">
        <div class="p-6">
            <h1 class="text-2xl font-black bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">MicroJobPro</h1>
            <nav class="mt-8 space-y-2">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl font-semibold">Dashboard</a>
                <a href="tasks.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl font-semibold">Tasks Marketplace</a>
                <a href="wallet.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl font-semibold">Wallet</a>
                <a href="withdraw.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl font-semibold">Withdraw</a>
                <a href="referral.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl font-semibold">Referrals</a>
            </nav>
        </div>
        <div class="p-6 border-t border-slate-800">
            <button id="logoutBtn" class="w-full bg-red-600/10 text-red-500 hover:bg-red-600 hover:text-white py-3 rounded-xl font-bold transition-all">Logout</button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="h-20 bg-slate-900/50 border-b border-slate-800 px-8 flex items-center justify-between">
            <h2 class="text-xl font-bold text-white">Post a New Micro Job</h2>
            <a href="tasks.html" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-sm font-semibold transition-all">Back to Tasks</a>
        </header>

        <div class="p-8 max-w-2xl w-full mx-auto">
            <div class="p-8 bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl space-y-6">
                <form id="postTaskForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Job Title</label>
                        <input type="text" id="title" required placeholder="e.g., Watch YouTube Video & Subscribe" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-blue-500">
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Job Description & Instructions</label>
                        <textarea id="description" rows="4" required placeholder="Describe step by step what workers need to do..." class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-blue-500"></textarea>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Reward Per Worker ($)</label>
                            <input type="number" id="reward" step="0.01" min="0.01" required placeholder="0.10" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Total Worker Slots</label>
                            <input type="number" id="slots" min="1" required placeholder="50" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-blue-500">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-600/30 transition-all mt-4">Publish Job Now</button>
                </form>
            </div>
        </div>
    </main>

    <script type="module">
        import { auth } from '../firebase/firebase-config.js';
        import { createTask } from '../firebase/firestore.js';
        import { signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = 'login.html';
            }
        });

        document.getElementById('postTaskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) return;

            const taskData = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                reward: parseFloat(document.getElementById('reward').value),
                slots: parseInt(document.getElementById('slots').value),
                advertiserId: user.uid
            };

            try {
                await createTask(taskData);
                alert('Job posted successfully!');
                window.location.href = 'tasks.html';
            } catch (error) {
                console.error("Error posting task:", error);
                alert('Failed to post job. Please try again.');
            }
        });

        document.getElementById('logoutBtn')?.addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'login.html';
        });
    </script>
</body>
  </html>
