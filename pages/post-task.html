<!DOCTYPE html>
<html lang="en" class="transform-gpu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Task - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 antialiased transform-gpu">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-16">
        
        <!-- Top Header & Balances -->
        <header class="p-4 bg-indigo-600 text-white rounded-b-3xl shadow-md">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-base font-extrabold tracking-wide">Post a New Task</h1>
                <div class="flex items-center gap-2">
                    <span id="userName" class="text-xs bg-indigo-700/80 px-3 py-1.5 rounded-xl font-medium tracking-wide shadow-inner">Loading...</span>
                    <button id="logoutBtn" class="text-xs bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded-xl font-semibold shadow-sm transition">Logout</button>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3 mt-2">
                <div class="bg-indigo-700/50 p-3 rounded-2xl backdrop-blur-sm border border-indigo-500/30">
                    <p class="text-[11px] text-indigo-200 font-medium">Main Balance</p>
                    <h2 id="mainBalance" class="text-lg font-extrabold mt-1">৳ 0.00</h2>
                </div>
                <div class="bg-indigo-700/50 p-3 rounded-2xl backdrop-blur-sm border border-indigo-500/30">
                    <p class="text-[11px] text-indigo-200 font-medium">Deposit Balance</p>
                    <h2 id="depositBalance" class="text-lg font-extrabold mt-1">৳ 0.00</h2>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="p-4 flex-grow space-y-4 overflow-y-auto">
            <form id="postTaskForm" class="bg-gray-50 border border-gray-200 p-4 rounded-2xl space-y-3 shadow-sm">
                <h3 class="text-xs font-bold text-gray-700 uppercase tracking-wide">Task Details</h3>
                
                <!-- Category Selection -->
                <div class="space-y-1">
                    <label class="text-[11px] font-semibold text-gray-600">Select Category</label>
                    <select id="taskCategory" required class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs text-gray-700 focus:outline-none focus:border-indigo-500">
                        <option value="">Choose a category</option>
                        <option value="YouTube">YouTube Watch & Subscribe</option>
                        <option value="Facebook">Facebook Like & Share</option>
                        <option value="Website">Website Visit & Read</option>
                        <option value="Micro Job">Other Micro Job</option>
                    </select>
                </div>

                <!-- Task Title -->
                <div class="space-y-1">
                    <label class="text-[11px] font-semibold text-gray-600">Task Title</label>
                    <input type="text" id="taskTitle" required placeholder="e.g., Watch video and subscribe" class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs text-gray-700 focus:outline-none focus:border-indigo-500">
                </div>

                <!-- Task Description -->
                <div class="space-y-1">
                    <label class="text-[11px] font-semibold text-gray-600">Task Description & Proof Requirement</label>
                    <textarea id="taskDescription" required rows="3" placeholder="Explain what workers need to do and what proof to submit..." class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs text-gray-700 focus:outline-none focus:border-indigo-500"></textarea>
                </div>

                <!-- Worker Quantity -->
                <div class="space-y-1">
                    <label class="text-[11px] font-semibold text-gray-600">Worker Quantity</label>
                    <input type="number" id="taskWorkers" required min="1" placeholder="e.g., 100" class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs text-gray-700 focus:outline-none focus:border-indigo-500">
                </div>

                <!-- Reward Per Worker -->
                <div class="space-y-1">
                    <label class="text-[11px] font-semibold text-gray-600">Reward Per Worker (৳)</label>
                    <input type="number" id="taskReward" required step="0.01" min="0.5" placeholder="e.g., 2.50" class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs text-gray-700 focus:outline-none focus:border-indigo-500">
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition">
                    Publish Task
                </button>
            </form>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-2 bg-white border-t border-gray-200 shadow-lg flex justify-around items-center">
            <a href="https://t.me/microjobspro" target="_blank" class="flex flex-col items-center text-gray-500 hover:text-indigo-600 text-[10px]">
                <span class="text-lg">🎧</span>
                <span>Help</span>
            </a>
            <a href="deposit.html" class="flex flex-col items-center text-gray-500 hover:text-indigo-600 text-[10px]">
                <span class="text-lg">👛</span>
                <span>Wallet</span>
            </a>
            <a href="dashboard.html" class="flex flex-col items-center text-gray-500 hover:text-indigo-600 text-[10px]">
                <div class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 text-base">
                    🏠
                </div>
                <span class="font-medium mt-0.5">Home</span>
            </a>
            <a href="referral.html" class="flex flex-col items-center text-gray-500 hover:text-indigo-600 text-[10px]">
                <span class="text-lg">👥</span>
                <span>Team</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center text-gray-500 hover:text-indigo-600 text-[10px]">
                <span class="text-lg">👤</span>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <!-- Firebase Script & Logic -->
    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { observeAuthState, logoutUser } from '../firebase/auth.js';
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let currentUserUid = null;

        observeAuthState((userData) => {
            if (userData) {
                currentUserUid = userData.uid;
                document.getElementById('userName').innerText = userData.displayName || "User";
                const mainBal = userData.balances?.main ?? userData.mainBalance ?? 0;
                const depositBal = userData.balances?.deposit ?? userData.depositBalance ?? 0;
                document.getElementById('mainBalance').innerText = `৳ ${Number(mainBal).toFixed(2)}`;
                document.getElementById('depositBalance').innerText = `৳ ${Number(depositBal).toFixed(2)}`;
            } else {
                window.location.href = 'login.html';
            }
        });

        // Handle Task Submission
        document.getElementById('postTaskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUserUid) return;

            const category = document.getElementById('taskCategory').value;
            const title = document.getElementById('taskTitle').value;
            const description = document.getElementById('taskDescription').value;
            const workers = Number(document.getElementById('taskWorkers').value);
            const reward = Number(document.getElementById('taskReward').value);

            try {
                await addDoc(collection(db, "tasks"), {
                    employerUid: currentUserUid,
                    category,
                    title,
                    description,
                    workers,
                    reward,
                    totalBudget: workers * reward,
                    status: 'active',
                    createdAt: serverTimestamp()
                });
                alert('টাস্কটি সফলভাবে প্রকাশিত হয়েছে!');
                window.location.href = 'dashboard.html';
            } catch (error) {
                console.error("Error posting task: ", error);
                alert('টাস্ক পোস্ট করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।');
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await logoutUser();
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
