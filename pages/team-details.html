<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Details - Micro Job Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>  
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-24">
        
        <!-- Header -->
        <header class="p-4 bg-gradient-to-r from-purple-600 to-indigo-700 text-white shadow-md flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="referral.html" class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center text-white hover:bg-white/30 transition">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </a>
                <h1 class="text-base font-bold">My Refer Team Details</h1>
            </div>
            <span id="totalTeamBadge" class="text-xs bg-white/20 px-2.5 py-1 rounded-full font-semibold">Team: 0</span>
        </header>

        <!-- Main Content: Level by Level Details -->
        <main class="p-4 flex-grow space-y-3">
            <div class="space-y-1">
                <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">10-Level Referral Hierarchy</h2>
                <p class="text-xs text-gray-400">Here you can explore members and earnings categorized by each level tier.</p>
            </div>

            <!-- Full 10 Level Container -->
            <div id="fullLevelContainer" class="space-y-3">
                <!-- Dynamically loaded levels will appear here -->
                <div class="text-center py-10 text-gray-400 text-xs">Loading team levels...</div>
            </div>
        </main>

        <!-- Footer Back Button -->
        <div class="p-4 bg-white border-t border-gray-100 sticky bottom-0">
            <a href="referral.html" class="block w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white text-center font-bold text-xs rounded-xl shadow-md transition">
                Back to Referral Dashboard
            </a>
        </div>
    </div>

    <!-- Firebase Logic for Team Details -->
    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { observeAuthState } from '../firebase/auth.js';
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        observeAuthState(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const userDocRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(userDocRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const totalRef = data.totalReferred ?? 0;
                    const levelsData = data.levels || {};

                    document.getElementById('totalTeamBadge').innerText = `Team: ${totalRef}`;

                    const container = document.getElementById('fullLevelContainer');
                    container.innerHTML = '';

                    for (let i = 1; i <= 10; i++) {
                        let levelMembers = 0;
                        let levelEarnings = 0;

                        if (levelsData[`level_${i}`]) {
                            levelMembers = levelsData[`level_${i}`].count || 0;
                            levelEarnings = levelsData[`level_${i}`].earnings || 0;
                        } else if (i === 1) {
                            // সংশোধন করা হয়েছে: লেভেল ১-এ মেইন ব্যালেন্সের পরিবর্তে শূন্য (0) দেখানো হবে যদি কোনো রেফারেল না থাকে
                            levelMembers = totalRef;
                            levelEarnings = totalRef > 0 ? (data.referralEarnings ?? 0) : 0;
                        }

                        const card = document.createElement('div');
                        card.className = "bg-gray-50 border border-gray-200 p-4 rounded-2xl space-y-2 shadow-sm";
                        card.innerHTML = `
                            <div class="flex justify-between items-center border-b border-gray-200 pb-2">
                                <span class="text-xs font-extrabold text-indigo-600 uppercase tracking-wider">Level ${i} Category</span>
                                <span class="text-xs font-bold text-green-600">৳ ${Number(levelEarnings).toFixed(2)}</span>
                            </div>
                            <div class="flex justify-between items-center text-xs pt-1">
                                <span class="text-gray-500 font-medium">Referred Members Count:</span>
                                <strong class="text-gray-800 bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-lg">${levelMembers} Members</strong>
                            </div>
                        `;
                        container.appendChild(card);
                    }
                }
            } catch (error) {
                console.error("Error loading team details:", error);
            }
        });
    </script>
</body>
</html>
