<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15-Level Binary Referral Tree - Micro Job Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>  
    
    <style>
        .node-card {
            background: #ffffff;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            padding: 8px 12px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: inline-block;
            min-width: 95px;
        }
        .node-card.active-node {
            border-color: #10b981;
        }
        .node-card.inactive-node {
            border-color: #9ca3af;
            opacity: 0.75;
        }
        /* Custom scrollbar for smooth horizontal scrolling of deep tree */
        ::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-10">
        
        <!-- Header -->
        <header class="p-4 bg-gradient-to-r from-purple-600 to-indigo-700 text-white shadow-md flex items-center justify-between sticky top-0 z-50">
            <div class="flex items-center space-x-3">
                <a href="referral.html" class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center text-white hover:bg-white/30 transition">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </a>
                <h1 class="text-base font-bold">15-Level Referral Tree</h1>
            </div>
            <span id="totalTeamBadge" class="text-xs bg-white/20 px-2.5 py-1 rounded-full font-semibold">Team: 0</span>
        </header>

        <!-- Main Content: Full 15-Level Tree Structure -->
        <main class="p-4 flex-grow space-y-6">
            
            <!-- Title & Legend -->
            <div class="text-center space-y-2">
                <h2 class="text-sm font-extrabold text-gray-800 uppercase tracking-wide">Complete 15-Level Binary Tree</h2>
                
                <!-- Status Indicators Legend -->
                <div class="flex justify-center items-center gap-6 pt-1">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 bg-emerald-500 rounded-full inline-block ring-4 ring-emerald-100"></span>
                        <span class="text-[11px] font-semibold text-gray-600">Active Member</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 bg-gray-400 rounded-full inline-block ring-4 ring-gray-100"></span>
                        <span class="text-[11px] font-semibold text-gray-600">Inactive / Empty</span>
                    </div>
                </div>
            </div>

            <!-- Visual Tree Container (All 15 Levels Linked Visually) -->
            <div id="treeContainer" class="bg-gradient-to-b from-indigo-50/50 to-white border border-indigo-100 rounded-3xl p-5 space-y-6 overflow-x-auto shadow-inner">
                
                <!-- Dynamic 15 Levels will be generated here sequentially -->
                <div id="visualTreeWrapper" class="flex flex-col items-center space-y-4 min-w-[320px]">
                    <!-- JavaScript will inject level nodes here -->
                </div>

            </div>

        </main>

        <!-- Footer Back Button -->
        <div class="p-4 bg-white border-t border-gray-100">
            <a href="referral.html" class="block w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white text-center font-bold text-xs rounded-xl shadow-md transition">
                Back to Referral Dashboard
            </a>
        </div>
    </div>

    <!-- Firebase Script & Logic for 15-Level Visual Generation -->
    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { observeAuthState } from '../firebase/auth.js';
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        observeAuthState(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const userDocRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(userDocRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const totalRef = data.totalReferred ?? 0;
                    const levelsData = data.levels || {};
                    const userName = data.username || user.userName || user.displayName || "mddulalhosen0";

                    document.getElementById('totalTeamBadge').innerText = `Team: ${totalRef}`;

                    const wrapper = document.getElementById('visualTreeWrapper');
                    wrapper.innerHTML = '';

                    // Level 1: Root Node
                    const rootDiv = document.createElement('div');
                    rootDiv.className = "flex flex-col items-center w-full";
                    rootDiv.innerHTML = `
                        <div class="node-card active-node relative">
                            <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-emerald-500 rounded-full"></span>
                            <div class="w-8 h-8 bg-indigo-100 text-indigo-700 rounded-full flex items-center justify-center mx-auto mb-1 text-xs font-bold shadow-sm">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <h4 class="text-xs font-bold text-gray-900 truncate max-w-[110px]">${userName}</h4>
                            <span class="text-[9px] bg-emerald-600 text-white px-2 py-0.5 rounded-md font-bold mt-1 inline-block">Level 1</span>
                        </div>
                        <div class="w-0.5 h-5 bg-indigo-300 my-1"></div>
                    `;
                    wrapper.appendChild(rootDiv);

                    // Generate Levels 2 to 15 sequentially in tree node card style
                    for (let i = 2; i <= 15; i++) {
                        let levelInfo = levelsData[`level_${i}`] || {};
                        let count = levelInfo.count || (i === 2 && totalRef > 0 ? 1 : 0);
                        let earnings = levelInfo.earnings || 0;
                        let isActive = count > 0;

                        const levelNodeBox = document.createElement('div');
                        levelNodeBox.className = "flex flex-col items-center w-full space-y-1";
                        
                        levelNodeBox.innerHTML = `
                            <div class="w-full flex justify-center">
                                <div class="node-card ${isActive ? 'active-node' : 'inactive-node'} relative">
                                    <span class="absolute top-1 right-1 w-2.5 h-2.5 ${isActive ? 'bg-emerald-500' : 'bg-gray-400'} rounded-full"></span>
                                    <div class="w-7 h-7 bg-gray-100 ${isActive ? 'text-indigo-600' : 'text-gray-400'} rounded-full flex items-center justify-center mx-auto mb-1 text-xs font-bold">
                                        <i class="fa-solid fa-user"></i>
                                    </div>
                                    <h5 class="text-[11px] font-bold ${isActive ? 'text-gray-800' : 'text-gray-500'}">${count > 0 ? count + ' Members' : 'Empty / Inactive'}</h5>
                                    <div class="flex items-center justify-center gap-1 mt-1">
                                        <span class="text-[9px] ${isActive ? 'bg-indigo-600' : 'bg-gray-500'} text-white px-1.5 py-0.5 rounded font-bold">Level ${i}</span>
                                        <span class="text-[9px] text-green-600 font-bold bg-green-50 px-1 rounded">৳${Number(earnings).toFixed(0)}</span>
                                    </div>
                                </div>
                            </div>
                            ${i < 15 ? '<div class="w-0.5 h-5 bg-indigo-300 my-0.5"></div>' : ''}
                        `;
                        wrapper.appendChild(levelNodeBox);
                    }
                }
            } catch (error) {
                console.error("Error loading 15-level tree:", error);
            }
        });
    </script>
</body>
</html>
