<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15 Member Binary Referral Tree - Zoomable</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>  
    
    <style>
        .tree-node {
            background: #ffffff;
            border: 2px solid #10b981;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin: 0 auto;
        }
        /* Zoom wrapper transition */
        #zoomableTree {
            transform-origin: top center;
            transition: transform 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-10">
        
        <!-- Header -->
        <header class="p-4 bg-gradient-to-r from-purple-600 to-indigo-700 text-white shadow-md flex items-center justify-between sticky top-0 z-50">
            <div class="flex items-center space-x-3">
                <a href="referral.html" class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center text-white hover:bg-white/30 transition">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </a>
                <h1 class="text-base font-bold">15 Member Binary Tree</h1>
            </div>
            <span class="text-xs bg-white/20 px-2.5 py-1 rounded-full font-semibold">Team: 15</span>
        </header>

        <!-- Main Content -->
        <main class="p-4 flex-grow space-y-4">
            
            <!-- Title & Legend -->
            <div class="text-center space-y-2">
                <h2 class="text-sm font-extrabold text-gray-800 uppercase tracking-wide">Binary Referral Tree Structure</h2>
                
                <!-- Status Legend -->
                <div class="flex justify-center items-center gap-6">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 bg-emerald-500 rounded-full inline-block ring-4 ring-emerald-100"></span>
                        <span class="text-[11px] font-semibold text-gray-600">Active</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 bg-gray-300 rounded-full inline-block ring-4 ring-gray-100"></span>
                        <span class="text-[11px] font-semibold text-gray-600">Inactive</span>
                    </div>
                </div>
            </div>

            <!-- Zoom Controls Bar -->
            <div class="flex justify-center items-center gap-2 bg-indigo-50/80 p-2 rounded-xl border border-indigo-100">
                <span class="text-xs font-bold text-indigo-900 mr-2"><i class="fa-solid fa-magnifying-glass"></i> Zoom:</span>
                <button onclick="zoomOut()" class="px-3 py-1 bg-white border border-indigo-200 text-indigo-700 font-bold text-xs rounded-lg shadow-sm hover:bg-indigo-600 hover:text-white transition">
                    <i class="fa-solid fa-minus"></i> -
                </button>
                <button onclick="resetZoom()" class="px-3 py-1 bg-white border border-indigo-200 text-indigo-700 font-bold text-xs rounded-lg shadow-sm hover:bg-indigo-600 hover:text-white transition">
                    Reset
                </button>
                <button onclick="zoomIn()" class="px-3 py-1 bg-white border border-indigo-200 text-indigo-700 font-bold text-xs rounded-lg shadow-sm hover:bg-indigo-600 hover:text-white transition">
                    <i class="fa-solid fa-plus"></i> +
                </button>
            </div>

            <!-- Visual Binary Tree Box with Overflow Scroll & Zoom Target -->
            <div class="bg-gradient-to-b from-indigo-50/30 to-white border border-indigo-100 rounded-3xl p-4 overflow-auto shadow-inner min-h-[420px]">
                
                <!-- Zoom Transform Wrapper -->
                <div id="zoomableTree" class="min-w-[650px] flex flex-col items-center space-y-6 pt-2">
                    
                    <!-- LEVEL 1 (Node 1) -->
                    <div class="flex flex-col items-center">
                        <div class="tree-node">

                            <i class="fa-solid fa-user text-indigo-900 text-base"></i>
                        </div>
                        <div class="bg-indigo-900 text-white text-[10px] font-bold px-3 py-0.5 rounded-full mt-1">1</div>
                        <span class="text-[9px] bg-emerald-600 text-white px-2 py-0.5 rounded font-bold mt-0.5">Level 1</span>
                        <div class="w-0.5 h-5 bg-indigo-900 mt-1"></div>
                    </div>

                    <!-- LEVEL 2 (Nodes 2 & 3) -->
                    <div class="w-full relative px-12">
                        <div class="absolute top-0 left-24 right-24 h-0.5 bg-indigo-900"></div>
                        <div class="flex justify-around">
                            <!-- Node 2 -->
                            <div class="flex flex-col items-center pt-2">
                                <div class="w-0.5 h-3 bg-indigo-950 mb-1"></div>
                                <div class="tree-node">
                                    <span class="absolute top-0 right-1 w-2.5 h-2.5 bg-emerald-500 rounded-full border border-white"></span>
                                    <i class="fa-solid fa-user text-indigo-900 text-sm"></i>
                                </div>
                                <div class="bg-indigo-900 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full mt-1">2</div>
                                <span class="text-[9px] bg-emerald-600 text-white px-1.5 py-0.5 rounded font-bold mt-0.5">Level 2</span>
                                <div class="w-0.5 h-4 bg-indigo-900 mt-1"></div>
                            </div>
                            <!-- Node 3 -->
                            <div class="flex flex-col items-center pt-2">
                                <div class="w-0.5 h-3 bg-indigo-950 mb-1"></div>
                                <div class="tree-node">
                                    <span class="absolute top-0 right-1 w-2.5 h-2.5 bg-emerald-500 rounded-full border border-white"></span>
                                    <i class="fa-solid fa-user text-indigo-900 text-sm"></i>
                                </div>
                                <div class="bg-indigo-900 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full mt-1">3</div>
                                <span class="text-[9px] bg-emerald-600 text-white px-1.5 py-0.5 rounded font-bold mt-0.5">Level 2</span>
                                <div class="w-0.5 h-4 bg-indigo-900 mt-1"></div>
                            </div>
                        </div>
                    </div>

                    <!-- LEVEL 3 (Nodes 4, 5, 6, 7) -->
                    <div class="w-full relative px-4">
                        <div class="flex justify-around">
                            <div class="w-1/2 relative px-6 flex justify-around">
                                <div class="absolute top-0 left-10 right-10 h-0.5 bg-indigo-900"></div>
                                <!-- Node 4 -->
                                <div class="flex flex-col items-center pt-2">
                                    <div class="w-0.5 h-3 bg-indigo-950 mb-1"></div>
                                    <div class="tree-node scale-90">
                                        <span class="absolute top-0 right-1 w-2 h-2 bg-emerald-500 rounded-full"></span>
                                        <i class="fa-solid fa-user text-indigo-900 text-xs"></i>
                                    </div>
                                    <div class="bg-indigo-900 text-white text-[9px] font-bold px-2 py-0.5 rounded-full mt-1">4</div>
                                    <span class="text-[8px] bg-emerald-600 text-white px-1 py-0.5 rounded font-bold mt-0.5">Level 3</span>
                                    <div class="w-0.5 h-3 bg-indigo-900 mt-1"></div>
                                </div>
                                <!-- Node 5 -->
                                <div class="flex flex-col items-center pt-2">
                                    <div class="w-0.5 h-3 bg-indigo-950 mb-1"></div>
                                    <div class="tree-node scale-90">
                                        <span class="absolute top-0 right-1 w-2 h-2 bg-emerald-500 rounded-full"></span>
                                        <i class="fa-solid fa-user text-indigo-900 text-xs"></i>
                                    </div>
                                    <div class="bg-indigo-900 text-white text-[9px] font-bold px-2 py-0.5 rounded-full mt-1">5</div>
                                    <span class="text-[8px] bg-emerald-600 text-white px-1 py-0.5 rounded font-bold mt-0.5">Level 3</span>
                                    <div class="w-0.5 h-3 bg-indigo-900 mt-1"></div>
                                </div>
                            </div>

                            <div class="w-1/2 relative px-6 flex justify-around">
                                <div class="absolute top-0 left-10 right-10 h-0.5 bg-indigo-900"></div>
                                <!-- Node 6 -->
                                <div class="flex flex-col items-center pt-2">
                                    <div class="w-0.5 h-3 bg-indigo-950 mb-1"></div>
                                    <div class="tree-node scale-90">
                                        <span class="absolute top-0 right-1 w-2 h-2 bg-emerald-500 rounded-full"></span>
                                        <i class="fa-solid fa-user text-indigo-900 text-xs"></i>
                                    </div>
                                    <div class="bg-indigo-900 text-white text-[9px] font-bold px-2 py-0.5 rounded-full mt-1">6</div>
                                    <span class="text-[8px] bg-emerald-600 text-white px-1 py-0.5 rounded font-bold mt-0.5">Level 3</span>
                                    <div class="w-0.5 h-3 bg-indigo-900 mt-1"></div>
                                </div>
                                <!-- Node 7 -->
                                <div class="flex flex-col items-center pt-2">
                                    <div class="w-0.5 h-3 bg-indigo-950 mb-1"></div>
                                    <div class="tree-node scale-90">
                                        <span class="absolute top-0 right-1 w-2 h-2 bg-emerald-500 rounded-full"></span>
                                        <i class="fa-solid fa-user text-indigo-900 text-xs"></i>
                                    </div>
                                    <div class="bg-indigo-900 text-white text-[9px] font-bold px-2 py-0.5 rounded-full mt-1">7</div>
                                    <span class="text-[8px] bg-emerald-600 text-white px-1 py-0.5 rounded font-bold mt-0.5">Level 3</span>
                                    <div class="w-0.5 h-3 bg-indigo-900 mt-1"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- LEVEL 4 (Nodes 8 to 15) -->
                    <div class="w-full flex justify-between px-1">
                        <!-- 8, 9 -->
                        <div class="flex justify-around w-1/4">
                            <div class="flex flex-col items-center"><div class="tree-node scale-75 w-10 h-10"><i class="fa-solid fa-user text-[9px]"></i></div><div class="bg-indigo-900 text-white text-[8px] px-1.5 rounded mt-1">8</div><span class="text-[7px] bg-emerald-600 text-white px-1 rounded">L4</span></div>
                            <div class="flex flex-col items-center"><div class="tree-node scale-75 w-10 h-10"><i class="fa-solid fa-user text-[9px]"></i></div><div class="bg-indigo-900 text-white text-[8px] px-1.5 rounded mt-1">9</div><span class="text-[7px] bg-emerald-600 text-white px-1 rounded">L4</span></div>
                        </div>
                        <!-- 10, 11 -->
                        <div class="flex justify-around w-1/4">
                            <div class="flex flex-col items-center"><div class="tree-node scale-75 w-10 h-10"><i class="fa-solid fa-user text-[9px]"></i></div><div class="bg-indigo-900 text-white text-[8px] px-1.5 rounded mt-1">10</div><span class="text-[7px] bg-emerald-600 text-white px-1 rounded">L4</span></div>
                            <div class="flex flex-col items-center"><div class="tree-node scale-75 w-10 h-10"><i class="fa-solid fa-user text-[9px]"></i></div><div class="bg-indigo-900 text-white text-[8px] px-1.5 rounded mt-1">11</div><span class="text-[7px] bg-emerald-600 text-white px-1 rounded">L4</span></div>
                        </div>
                        <!-- 12, 13 -->
                        <div class="flex justify-around w-1/4">
                            <div class="flex flex-col items-center"><div class="tree-node scale-75 w-10 h-10"><i class="fa-solid fa-user text-[9px]"></i></div><div class="bg-indigo-900 text-white text-[8px] px-1.5 rounded mt-1">12</div><span class="text-[7px] bg-emerald-600 text-white px-1 rounded">L4</span></div>
                            <div class="flex flex-col items-center"><div class="tree-node scale-75 w-10 h-10"><i class="fa-solid fa-user text-[9px]"></i></div><div class="bg-indigo-900 text-white text-[8px] px-1.5 rounded mt-1">13</div><span class="text-[7px] bg-emerald-600 text-white px-1 rounded">L4</span></div>
                        </div>
                        <!-- 14, 15 -->
                        <div class="flex justify-around w-1/4">
                            <div class="flex flex-col items-center"><div class="tree-node scale-75 w-10 h-10"><i class="fa-solid fa-user text-[9px]"></i></div><div class="bg-indigo-900 text-white text-[8px] px-1.5 rounded mt-1">14</div><span class="text-[7px] bg-emerald-600 text-white px-1 rounded">L4</span></div>
                            <div class="flex flex-col items-center"><div class="tree-node scale-75 w-10 h-10"><i class="fa-solid fa-user text-[9px]"></i></div><div class="bg-indigo-900 text-white text-[8px] px-1.5 rounded mt-1">15</div><span class="text-[7px] bg-emerald-600 text-white px-1 rounded">L4</span></div>
                        </div>
                    </div>

                </div>

            </div>

        </main>

        <!-- Footer -->
        <div class="p-4 bg-white border-t border-gray-100">
            <a href="referral.html" class="block w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white text-center font-bold text-xs rounded-xl shadow-md transition">
                Back to Referral Dashboard
            </a>
        </div>
    </div>

    <!-- Zoom In / Zoom Out JavaScript Logic -->
    <script>
        let currentScale = 1;
        const scaleStep = 0.15;
        const minScale = 0.6;
        const maxScale = 1.6;

        function updateZoom() {
            const tree = document.getElementById('zoomableTree');
            tree.style.transform = `scale(${currentScale})`;
        }

        function zoomIn() {
            if (currentScale < maxScale) {
                currentScale += scaleStep;
                updateZoom();
            }
        }

        function zoomOut() {
            if (currentScale > minScale) {
                currentScale -= scaleStep;
                updateZoom();
            }
        }

        function resetZoom() {
            currentScale = 1;
            updateZoom();
        }
    </script>
</body>
</html>
