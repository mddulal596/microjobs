<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-8 bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl backdrop-blur-xl">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-black text-white">Welcome Back</h2>
            <p class="text-slate-400 text-sm mt-2">Sign in to access your task dashboard</p>
        </div>
        
        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Email Address</label>
                <input type="email" id="email" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-blue-500 text-white">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-blue-500 text-white">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl font-bold shadow-lg shadow-blue-600/30 transition-all">Sign In</button>
        </form>

        <div class="mt-6 text-center">
            <button id="googleLogin" class="w-full bg-slate-800 hover:bg-slate-700 text-white py-3 rounded-xl font-semibold border border-slate-700 transition-all flex items-center justify-center gap-3">
                Continue with Google
            </button>
        </div>

        <p class="mt-8 text-center text-sm text-slate-400">
            Don't have an account? <a href="register.html" class="text-blue-500 font-semibold hover:underline">Sign Up</a>
        </p>
    </div>

    <script type="module">
        import { loginUser, loginWithGoogle } from '../firebase/auth.js';
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await loginUser(document.getElementById('email').value, document.getElementById('password').value);
                window.location.href = 'dashboard.html';
            } catch (err) {
                alert(err.message);
            }
        });

        document.getElementById('googleLogin').addEventListener('click', async () => {
            try {
                await loginWithGoogle();
                window.location.href = 'dashboard.html';
            } catch (err) {
                alert(err.message);
            }
        });
    </script>
</body>
</html>
