<!DOCTYPE html>
<html lang="en" class="transform-gpu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen px-4 transform-gpu">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-8">
        <h2 class="text-2xl font-extrabold text-indigo-600 text-center mb-6">Welcome Back</h2>
        <div id="errorMsg" class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded-xl text-sm"></div>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Email Address</label>
                <input type="email" id="email" required class="mt-1 w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" required class="mt-1 w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <button type="submit" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-lg hover:bg-indigo-700 transition">Login</button>
        </form>
        <div class="mt-4 text-center">
            <button id="googleLoginBtn" class="w-full py-3 bg-white border border-gray-300 text-gray-700 font-bold rounded-xl shadow-sm hover:bg-gray-50 transition flex items-center justify-center gap-2">
                <span>Login with Google</span>
            </button>
        </div>
        <p class="mt-6 text-center text-sm text-gray-600">Don't have an account? <a href="register.html" class="text-indigo-600 font-bold">Register</a></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script type="module">
        import { loginWithEmail, loginWithGoogle } from '../firebase/auth.js';
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await loginWithEmail(email, password);
                window.location.href = 'dashboard.html';
            } catch (err) {
                const errDiv = document.getElementById('errorMsg');
                errDiv.innerText = err.message;
                errDiv.classList.remove('hidden');
            }
        });

        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            try {
                await loginWithGoogle();
                window.location.href = 'dashboard.html';
            } catch (err) {
                const errDiv = document.getElementById('errorMsg');
                errDiv.innerText = err.message;
                errDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
