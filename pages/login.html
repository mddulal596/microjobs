<!DOCTYPE html>
<html lang="en" class="transform-gpu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 antialiased transform-gpu flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-white shadow-xl rounded-3xl p-6 space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-1">
            <h1 class="text-xl font-extrabold text-indigo-600 tracking-wide">Micro Job Pro</h1>
            <p class="text-xs text-gray-500">Sign in to your account to continue</p>
        </div>

        <!-- Google Login Button -->
        <button id="googleLoginBtn" class="w-full py-3 bg-white hover:bg-gray-50 border border-gray-300 text-gray-700 font-bold text-xs rounded-2xl shadow-sm transition flex items-center justify-center gap-2 cursor-pointer">
            <span class="text-base">🌐</span>
            <span>Continue with Google</span>
        </button>

        <div class="flex items-center my-4">
            <div class="flex-grow border-t border-gray-200"></div>
            <span class="px-3 text-[11px] text-gray-400 font-medium uppercase">Or with email</span>
            <div class="flex-grow border-t border-gray-200"></div>
        </div>

        <!-- Email/Password Form -->
        <form id="loginForm" class="space-y-4">
            <div class="space-y-1">
                <label class="text-xs font-bold text-gray-700">Email Address</label>
                <input type="email" id="emailInput" required placeholder="name@example.com" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2.5 text-xs text-gray-800 focus:outline-none focus:border-indigo-600">
            </div>

            <div class="space-y-1">
                <label class="text-xs font-bold text-gray-700">Password</label>
                <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2.5 text-xs text-gray-800 focus:outline-none focus:border-indigo-600">
            </div>

            <button type="submit" id="loginBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-2xl shadow-md transition cursor-pointer">
                Sign In
            </button>
        </form>

        <!-- Footer / Register Link -->
        <div class="text-center pt-2">
            <p class="text-xs text-gray-500">
                Don't have an account? 
                <a href="register.html" class="text-indigo-600 font-bold hover:underline">Register Now</a>
            </p>
        </div>

    </div>

    <!-- Firebase Script & Logic -->
    <script type="module">
        import { loginWithEmail, loginWithGoogle } from '../firebase/auth.js';

        // Email & Password Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const btn = document.getElementById('loginBtn');

            if (!email || !password) {
                alert('দয়া করে ইমেল এবং পাসওয়ার্ড পূরণ করুন!');
                return;
            }

            btn.disabled = true;
            btn.innerText = "Signing In...";

            try {
                await loginWithEmail(email, password);
                window.location.href = 'dashboard.html';
            } catch (error) {
                console.error("Login error:", error);
                alert('লগইন ব্যর্থ হয়েছে: ' + error.message);
                btn.disabled = false;
                btn.innerText = "Sign In";
            }
        });

        // Google Login
        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            try {
                await loginWithGoogle();
                window.location.href = 'dashboard.html';
            } catch (error) {
                console.error("Google login error:", error);
                alert('গুগল লগইন ব্যর্থ হয়েছে: ' + error.message);
            }
        });
    </script>
</body>
</html>
