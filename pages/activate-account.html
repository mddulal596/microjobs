<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Account - Micro Job Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>  
    
    <style>
        /* Animated Bottom Nav Styles */
        .nav-container {  
            position: fixed;  
            bottom: 15px;  
            left: 50%;
            transform: translateX(-50%);
            width: 92%;  
            max-width: 440px;  
            height: 70px;  
            background: #4f46e5;  
            border-radius: 22px;  
            display: flex;  
            justify-content: space-around;  
            align-items: center;  
            box-shadow: 0 10px 25px rgba(0,0,0,.2);  
            overflow: visible;  
            z-index: 100;
        }  
          
        .nav-item-animated {  
            flex: 1;  
            text-decoration: none;  
            color: #fff;  
            text-align: center;  
            position: relative;  
            z-index: 2;  
        }  
          
        .nav-item-animated i {  
            font-size: 22px;  
            transition: .35s;  
        }  
          
        .nav-item-animated span {  
            display: block;  
            font-size: 11px;  
            margin-top: 4px;  
            transition: .35s;  
        }  
          
        .nav-item-animated.active i {  
            transform: translateY(-10px);  
        }  
          
        .nav-item-animated.active span {  
            font-weight: bold;  
        }  
          
        .indicator {  
            position: absolute;  
            top: -15px;  
            width: 60px;  
            height: 60px;  
            background: #312e81;  
            border-radius: 50%;  
            border: 4px solid #fff;  
            transition: left .35s ease;  
            box-shadow: 0 0 20px rgba(49,46,129,.5);  
            z-index: 1;  
        }  
          
        .indicator::before {  
            content: "";  
            position: absolute;  
            inset: -6px;  
            border-radius: 50%;  
            border: 2px solid rgba(49,46,129,.4);  
            animation: pulse 2s infinite;  
        }  
          
        @keyframes pulse {  
            0% { transform: scale(1); opacity: 1; }  
            100% { transform: scale(1.4); opacity: 0; }  
        } 
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-28">
        
        <!-- Top Header -->
        <header class="p-5 bg-gradient-to-r from-purple-600 to-indigo-700 text-white rounded-b-3xl shadow-lg">
            <div class="flex justify-between items-center mb-3">
                <a href="dashboard.html" class="flex items-center gap-2 bg-white/15 border border-white/30 px-3 py-1.5 rounded-full text-xs font-bold text-white max-w-[220px] truncate">
                    <div id="headerProfileIconContainer" class="w-6 h-6 bg-white text-indigo-900 rounded-full flex items-center justify-center font-black text-[11px] overflow-hidden flex-shrink-0">
                        <span id="headerProfileIcon">M</span>
                    </div>
                    <span id="headerUserName" class="truncate">Loading...</span>
                </a>
                <a href="dashboard.html" class="bg-white/15 px-3.5 py-1.5 rounded-full text-white text-xs font-bold">Home</a>
            </div>
            <div class="text-base font-extrabold tracking-wide">Account Activation</div>
        </header>

        <!-- Main Content Area -->
        <main class="p-4 flex-grow" id="mainContainer">
            <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-4 text-center shadow-sm">
                <h3 class="text-sm font-extrabold text-amber-900 mb-1.5">⭐ প্রিমিয়াম মেম্বারশিপ</h3>
                <p class="text-[11px] text-amber-700 leading-relaxed">অ্যাকাউন্ট একটিভ করার মাধ্যমে আপনার ডিপোজিট ব্যালেন্স থেকে স্বয়ংক্রিয়ভাবে ফি কেটে নেওয়া হবে এবং সকল প্রিমিয়াম সুবিধা আনলক হয়ে যাবে।</p>
            </div>

            <div id="dynamicContent">
                <!-- Content will load dynamically based on deposit balance -->
            </div>
        </main>

        <!-- Animated Bottom Navigation Bar -->
        <div class="nav-container">  
            <div class="indicator"></div>  
            
            <a href="https://t.me/microjobspro" target="_blank" class="nav-item-animated">  
                <i class="fa-solid fa-headset"></i>  
                <span>Help</span>  
            </a>  

            <a href="wallet.html" class="nav-item-animated">  
                <i class="fa-solid fa-wallet"></i>  
                <span>Wallet</span>  
            </a>  
            
            <a href="dashboard.html" class="nav-item-animated">  
                <i class="fa-solid fa-house"></i>  
                <span>Home</span>  
            </a>  
            
            <a href="referral.html" class="nav-item-animated">  
                <i class="fa-solid fa-user-group"></i>  
                <span>Team</span>  
            </a>  
            
            <a href="profile.html" class="nav-item-animated">  
                <i class="fa-solid fa-user"></i>  
                <span>Profile</span>  
            </a>  
        </div>  
    </div>

    <!-- Navigation Animation Script -->
    <script>  
        const items = document.querySelectorAll(".nav-item-animated");  
        const indicator = document.querySelector(".indicator");  
          
        function moveIndicator(el){  
            if (!el) return;
            const left = el.offsetLeft + (el.offsetWidth / 2) - (indicator.offsetWidth / 2);  
            indicator.style.left = left + "px";  
            items.forEach(i => i.classList.remove("active"));  
            el.classList.add("active");  
        }  
          
        items.forEach(item => {  
            item.addEventListener("click", () => {  
                moveIndicator(item);  
            });  
        });  
          
        window.onload = () => moveIndicator(document.querySelector(".nav-item-animated.active"));  
        window.onresize = () => moveIndicator(document.querySelector(".nav-item-animated.active"));  
    </script>

    <!-- Firebase Script & Logic -->
    <script type="module">
        import { observeAuthState } from '../firebase/auth.js';
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const db = getFirestore();
        const auth = getAuth();
        let currentUserUid = null;

        observeAuthState((userData) => {
            if (!userData) {
                window.location.href = 'login.html';
                return;
            }

            currentUserUid = userData.uid;
            const firebaseUser = auth.currentUser;

            const userName = userData.fullName || userData.name || (firebaseUser ? firebaseUser.displayName : null) || "Micro Job Pro";
            const userPhoto = userData.photoURL || userData.profilePic || userData.image || (firebaseUser ? firebaseUser.photoURL : null);
            
            document.getElementById('headerUserName').textContent = userName;
            
            const iconContainer = document.getElementById('headerProfileIconContainer');
            if (userPhoto) {
                iconContainer.innerHTML = `<img src="${userPhoto}" class="w-full h-full object-cover rounded-full" alt="Profile">`;
            } else {
                iconContainer.innerHTML = `<div class="w-full h-full flex items-center justify-center font-black">${userName.charAt(0).toUpperCase()}</div>`;
            }

            // যদি অ্যাকাউন্ট ইতিমধ্যে একটিভ থাকে
            if (userData.isActivated) {
                document.getElementById('mainContainer').innerHTML = `
                    <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-6 text-center shadow-sm">
                        <span class="text-4xl block mb-2">🎉</span>
                        <h4 class="text-sm font-extrabold text-emerald-800 mb-1.5">আপনার অ্যাকাউন্টটি ইতিমধ্যে একটিভ রয়েছে!</h4>
                        <p class="text-xs text-emerald-700 leading-relaxed mb-4">
                            আপনি এখন সকল প্রিমিয়াম জব এবং ইনকাম ফিচার ব্যবহার করতে পারছেন।
                        </p>
                        <a href="dashboard.html" class="bg-emerald-600 text-white text-xs font-bold px-5 py-2.5 rounded-xl inline-block shadow hover:bg-emerald-700 transition">ড্যাশবোর্ডে ফিরে যান</a>
                    </div>
                `;
                return;
            }

            const activationFee = 100; // একটিভেশন ফি ৳ ১০০
            const userDepositBalance = userData.depositBalance || 0; 
            const contentArea = document.getElementById('dynamicContent');

            if (userDepositBalance < activationFee) {
                contentArea.innerHTML = `
                    <div class="bg-red-50 border border-red-200 rounded-2xl p-4 text-center shadow-sm">
                        <h4 class="text-sm font-extrabold text-red-700 mb-1.5">❌ পর্যাপ্ত ডিপোজিট ব্যালেন্স নেই!</h4>
                        <p class="text-[11px] text-red-600 leading-relaxed mb-3.5">
                            অ্যাকাউন্ট অ্যাক্টিভ করতে প্রয়োজন ৳${activationFee}। বর্তমানে আপনার ডিপোজিট ব্যালেন্স আছে ৳${userDepositBalance}। অনুগ্রহ করে আগে ওয়ালেটে ডিপোজিট করুন।
                        </p>
                        <a href="wallet.html" class="bg-indigo-600 text-white text-xs font-bold px-5 py-2.5 rounded-xl inline-block shadow hover:bg-indigo-700 transition">Add Money to Deposit</a>
                    </div>
                `;
            } else {
                contentArea.innerHTML = `
                    <form id="activateForm" onsubmit="submitActivation(event, ${userDepositBalance}, ${activationFee})">
                        <div class="bg-gray-100 p-3.5 rounded-xl flex justify-between items-center text-xs font-bold text-indigo-700 mb-4 border border-gray-200">
                            <span>Activation Fee:</span>
                            <span class="text-sm text-emerald-600">৳ ${activationFee}.00</span>
                        </div>
                        <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-[11px] text-emerald-800 mb-4 text-center font-medium">
                            আপনার ডিপোজিট ব্যালেন্স: <strong>৳ ${userDepositBalance}.00</strong> (পর্যাপ্ত আছে)
                        </div>
                        <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-indigo-700 text-white p-3 rounded-xl text-xs font-bold shadow-md hover:opacity-90 transition">Confirm & Active Account</button>
                    </form>
                `;
            }
        });

        // অটোমেটিক ডাটাবেজ আপডেট করার ফাংশন
        window.submitActivation = async function(event, currentBalance, fee) {
            event.preventDefault();
            
            let confirmPay = confirm(`আপনার ডিপোজিট ব্যালেন্স থেকে ৳${fee} কেটে নিয়ে অ্যাকাউন্ট সফলভাবে অ্যাক্টিভ করা হবে। আপনি কি নিশ্চিত?`);
            
            if (confirmPay && currentUserUid) {
                try {
                    const userRef = doc(db, "users", currentUserUid);
                    await updateDoc(userRef, {
                        depositBalance: currentBalance - fee,
                        isActivated: true
                    });

                    alert(`অভিনন্দন! আপনার ডিপোজিট ব্যালেন্স থেকে সফলভাবে ফি কেটে নেওয়া হয়েছে এবং অ্যাকাউন্ট একটিভ করা হয়েছে।`);
                    window.location.href = 'dashboard.html';
                } catch (error) {
                    console.error("Activation Error: ", error);
                    alert("অ্যাক্টিভেশন সম্পন্ন করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।");
                }
            }
        }
    </script>
</body>
</html>
