<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Activation - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>  
    
    <style>
        .nav-container {  
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);  
            width: 92%; max-width: 440px; height: 70px; background: #4f46e5;  
            border-radius: 22px; display: flex; justify-content: space-around;  
            align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,.2); z-index: 100;  
        }  
        .nav-item-animated { flex: 1; text-decoration: none; color: #fff; text-align: center; position: relative; z-index: 2; }  
        .nav-item-animated i { font-size: 22px; transition: .25s; }  
        .nav-item-animated span { display: block; font-size: 11px; margin-top: 4px; transition: .25s; }  
        .nav-item-animated.active i { transform: translateY(-10px); }  
        .nav-item-animated.active span { font-weight: bold; }  
        .indicator {  
            position: absolute; top: -10px; width: 60px; height: 60px;  
            background: #312e81; border-radius: 50%; border: 4px solid #fff;  
            transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1);  
            box-shadow: 0 0 20px rgba(49,46,129,.5); z-index: 1;  
        }  
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-28">
        
        <!-- Header -->
        <header class="p-5 bg-gradient-to-r from-purple-600 to-indigo-700 text-white rounded-b-3xl shadow-lg">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2.5 bg-white/20 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/20">
                    <img id="userAvatar" src="https://via.placeholder.com/150" alt="Avatar" class="w-7 h-7 rounded-full object-cover border border-white/50">
                    <div class="leading-tight">
                        <h4 id="userName" class="text-xs font-bold text-white">Loading...</h4>
                        <span id="userUsername" class="text-[10px] text-purple-200">@username</span>
                    </div>
                </div>
                <a href="dashboard.html" class="text-xs bg-white/20 hover:bg-white/35 transition px-3 py-1.5 rounded-full font-semibold flex items-center gap-1.5">
                    <i class="fa-solid fa-house"></i> Home
                </a>
            </div>

            <div class="flex justify-between items-center mb-3">
                <h1 class="text-lg font-extrabold">Account Activation</h1>
            </div>

            <!-- Balances Summary Card -->
            <div class="grid grid-cols-2 gap-3 mt-2">
                <div class="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/20">
                    <p class="text-[11px] text-purple-200 font-medium">Main Balance</p>
                    <h3 class="text-lg font-extrabold mt-0.5">৳ <span id="mainBalance">0.00</span></h3>
                </div>
                <div class="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/20">
                    <p class="text-[11px] text-purple-200 font-medium">Deposit Balance</p>
                    <h3 class="text-lg font-extrabold mt-0.5">৳ <span id="depositBalance">0.00</span></h3>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="p-4 flex-grow" id="activationContainer">
            <!-- Dynamic Content will be loaded here -->
            <div class="text-center py-10">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-purple-600 border-t-transparent"></div>
                <p class="text-xs text-gray-500 mt-2">Checking status...</p>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <div class="nav-container">  
            <div class="indicator"></div>  
            <a href="https://t.me/microjobspro" target="_blank" class="nav-item-animated"><i class="fa-solid fa-headset"></i><span>Help</span></a>  
            <a href="wallet.html" class="nav-item-animated"><i class="fa-solid fa-wallet"></i><span>Wallet</span></a>  
            <a href="dashboard.html" class="nav-item-animated"><i class="fa-solid fa-house"></i><span>Home</span></a>  
            <a href="referral.html" class="nav-item-animated"><i class="fa-solid fa-user-group"></i><span>Team</span></a>  
            <a href="profile.html" class="nav-item-animated"><i class="fa-solid fa-user"></i><span>Profile</span></a>  
        </div>  
    </div>

    <script>  
        const items = document.querySelectorAll(".nav-item-animated");  
        const indicator = document.querySelector(".indicator");  
        
        function moveIndicator(el){  
            if (!el) return;
            const left = el.offsetLeft + (el.offsetWidth / 2) - (indicator.offsetWidth / 2);  
            indicator.style.left = left + "px";  
            items.forEach(i => i.classList.remove("active"));  
            el.classList.add("active");  
        }  
        
        items.forEach(item => item.addEventListener("click", (e) => moveIndicator(item)));  
        
        const activeItem = document.querySelector(".nav-item-animated.active") || items[2];
        moveIndicator(activeItem);

        window.addEventListener('resize', () => {
            moveIndicator(document.querySelector(".nav-item-animated.active"));
        });
    </script>

    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { observeAuthState } from '../firebase/auth.js';
        import { doc, onSnapshot, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const ACTIVATION_FEE = 100;

        observeAuthState((user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            
            onSnapshot(doc(db, "users", user.uid), async (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    // User Info
                    document.getElementById('userName').innerText = data.fullName || data.name || 'User';
                    document.getElementById('userUsername').innerText = '@' + (data.username || 'member');
                    if(data.photoURL || data.profilePic) {
                        document.getElementById('userAvatar').src = data.photoURL || data.profilePic;
                    }

                    // Balances
                    let main = data.balances?.main ?? data.mainBalance ?? 0;
                    let deposit = data.balances?.deposit ?? data.depositBalance ?? 0;
                    document.getElementById('mainBalance').innerText = Number(main).toFixed(2);
                    document.getElementById('depositBalance').innerText = Number(deposit).toFixed(2);

                    const isActivated = data.isActivated || false;
                    const container = document.getElementById('activationContainer');

                    if (isActivated) {
                        container.innerHTML = `
                            <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-6 text-center shadow-sm mt-2">
                                <div class="text-4xl mb-2">🎉</div>
                                <h3 class="text-base font-bold text-emerald-900 mb-1">Account is Activated!</h3>
                                <p class="text-xs text-emerald-700">আপনার অ্যাকাউন্টটি ইতিমধ্যে প্রিমিয়াম মেম্বারশিপের আওতায় সচল রয়েছে। সকল সুবিধা উপভোগ করুন।</p>
                            </div>
                        `;
                    } else {
                        const hasEnough = deposit >= ACTIVATION_FEE;
                        container.innerHTML = `
                            <div class="bg-amber-50 border border-amber-100 rounded-2xl p-4 mb-4 shadow-sm">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-lg">⭐</span>
                                    <h3 class="text-xs font-bold text-amber-900 uppercase">প্রিমিয়াম মেম্বারশিপ</h3>
                                </div>
                                <p class="text-[11px] text-amber-800 leading-relaxed">অ্যাকাউন্ট একটিভ করার মাধ্যমে আপনার ডিপোজিট ব্যালেন্স থেকে স্বয়ংক্রিয়ভাবে ফি কেটে নেওয়া হবে এবং সকল প্রিমিয়াম সুবিধা আনলক হয়ে যাবে।</p>
                            </div>

                            <div class="${hasEnough ? 'bg-emerald-50 border-emerald-100' : 'bg-red-50 border-red-100'} border rounded-2xl p-4 text-center shadow-sm mb-4">
                                <div class="text-2xl mb-1">${hasEnough ? '✅' : '❌'}</div>
                                <h3 class="text-xs font-bold ${hasEnough ? 'text-emerald-900' : 'text-red-900'} mb-1">
                                    ${hasEnough ? 'অ্যাকাউন্ট একটিভ করার জন্য প্রস্তুত!' : 'পর্যাপ্ত ডিপোজিট ব্যালেন্স নেই!'}
                                </h3>
                                <p class="text-[11px] ${hasEnough ? 'text-emerald-700' : 'text-red-700'} mb-3">
                                    অ্যাকাউন্ট একটিভ করতে প্রয়োজন ৳${ACTIVATION_FEE}. বর্তমানে আপনার ডিপোজিট ব্যালেন্স আছে ৳${deposit.toFixed(2)}. 
                                    ${hasEnough ? '' : 'অনুগ্রহ করে আগে ওয়ালেটে ডিপোজিট করুন।'}
                                </p>
                                ${hasEnough ? `
                                    <button id="activateBtn" class="w-full py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs rounded-xl shadow-md transition">
                                        Activate Account (৳${ACTIVATION_FEE})
                                    </button>
                                ` : `
                                    <a href="deposit.html" class="inline-block w-full py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs rounded-xl shadow-md transition text-center">
                                        Add Money to Deposit
                                    </a>
                                `}
                            </div>
                        `;

                        if (hasEnough) {
                            document.getElementById('activateBtn').addEventListener('click', async () => {
                                const btn = document.getElementById('activateBtn');
                                btn.disabled = true;
                                btn.innerText = "Processing...";
                                try {
                                    const userRef = doc(db, "users", user.uid);
                                    // Deduct from deposit balance and set isActivated to true
                                    await updateDoc(userRef, {
                                        isActivated: true,
                                        "balances.deposit": increment(-ACTIVATION_FEE),
                                        depositBalance: increment(-ACTIVATION_FEE)
                                    });
                                    alert("অভিনন্দন! আপনার অ্যাকাউন্ট সফলভাবে একটিভ হয়েছে।");
                                } catch (error) {
                                    console.error(error);
                                    alert("ত্রুটি ঘটেছে: " + error.message);
                                    btn.disabled = false;
                                    btn.innerText = `Activate Account (৳${ACTIVATION_FEE})`;
                                }
                            });
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
