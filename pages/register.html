<!DOCTYPE html>
<html lang="en" class="transform-gpu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referral Team - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 antialiased transform-gpu">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-16">
        
        <header class="p-4 bg-indigo-600 text-white rounded-b-3xl shadow-md">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-base font-extrabold tracking-wide">My Team & Referral</h1>
                <div class="flex items-center gap-2">
                    <span id="userName" class="text-xs bg-indigo-700/80 px-3 py-1.5 rounded-xl font-medium tracking-wide shadow-inner">Loading...</span>
                    <button id="logoutBtn" class="text-xs bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded-xl font-semibold shadow-sm transition">Logout</button>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3 mt-2">
                <div class="bg-indigo-700/50 p-3 rounded-2xl backdrop-blur-sm border border-indigo-500/30">
                    <p class="text-[11px] text-indigo-200 font-medium">Main Balance</p>
                    <h2 id="mainBalance" class="text-lg font-extrabold mt-1">৳ 0.00</h2>
                </div>
                <div class="bg-indigo-700/50 p-3 rounded-2xl backdrop-blur-sm border border-indigo-500/30">
                    <p class="text-[11px] text-indigo-200 font-medium">Deposit Balance</p>
                    <h2 id="depositBalance" class="text-lg font-extrabold mt-1">৳ 0.00</h2>
                </div>
            </div>
        </header>

        <main class="p-4 flex-grow space-y-4 overflow-y-auto">
            
            <div class="bg-indigo-50 border border-indigo-100 p-3 rounded-2xl text-center shadow-sm">
                <p class="text-xs font-bold text-indigo-700">
                    🎁 নতুন ইউজার রেফার কোড ব্যবহার করলে ইনস্ট্যান্ট <span class="text-pink-600">৳১০ বোনাস</span> পাবে!
                </p>
            </div>

            <!-- Referral Code Card -->
            <div class="bg-gray-50 border border-gray-200 p-4 rounded-2xl space-y-3 shadow-sm">
                <h3 class="text-xs font-bold text-gray-700 uppercase tracking-wide">Your Referral Code</h3>
                <div class="flex gap-2">
                    <input type="text" id="myReferralCode" readonly class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs font-bold text-indigo-600 text-center tracking-widest focus:outline-none" value="MCJBMC...">
                    <button onclick="copyReferralCode()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow transition shrink-0">
                        Copy Code
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-gray-50 border border-gray-200 p-3.5 rounded-2xl text-center shadow-sm">
                    <span class="text-xl">👥</span>
                    <p class="text-[11px] text-gray-500 mt-1">Total Team</p>
                    <h3 id="totalTeam" class="text-sm font-extrabold text-indigo-600 mt-0.5">0</h3>
                </div>
                <div class="bg-gray-50 border border-gray-200 p-3.5 rounded-2xl text-center shadow-sm">
                    <span class="text-xl">💰</span>
                    <p class="text-[11px] text-gray-500 mt-1">5% Commission</p>
                    <h3 id="referralBonus" class="text-sm font-extrabold text-green-600 mt-0.5">৳ 0.00</h3>
                </div>
            </div>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-2 bg-white border-t border-gray-200 shadow-lg flex justify-around items-center">
            <a href="https://t.me/microjobspro" target="_blank" class="flex flex-col items-center text-gray-500 hover:text-indigo-600 text-[10px]">
                <span class="text-lg">🎧</span><span>Help</span>
            </a>
            <a href="deposit.html" class="flex flex-col items-center text-gray-500 hover:text-indigo-600 text-[10px]">
                <span class="text-lg">👛</span><span>Wallet</span>
            </a>
            <a href="dashboard.html" class="flex flex-col items-center text-gray-500 hover:text-indigo-600 text-[10px]">
                <div class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 text-base">🏠</div>
                <span class="font-medium mt-0.5">Home</span>
            </a>
            <a href="referral.html" class="flex flex-col items-center text-indigo-600 text-[10px] -mt-4">
                <div class="w-12 h-12 bg-indigo-600 rounded-full flex items-center justify-center text-white shadow-lg border-4 border-white text-lg">👥</div>
                <span class="font-bold mt-0.5">Team</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center text-gray-500 hover:text-indigo-600 text-[10px]">
                <span class="text-lg">👤</span><span>Profile</span>
            </a>
        </nav>
    </div>

    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { observeAuthState, logoutUser } from '../firebase/auth.js';

        observeAuthState((userData) => {
            if (userData) {
                document.getElementById('userName').innerText = userData.displayName || "User";
                const mainBal = userData.balances?.main ?? userData.mainBalance ?? 0;
                const depositBal = userData.balances?.deposit ?? userData.depositBalance ?? 0;
                document.getElementById('mainBalance').innerText = `৳ ${Number(mainBal).toFixed(2)}`;
                document.getElementById('depositBalance').innerText = `৳ ${Number(depositBal).toFixed(2)}`;

                // Use referralCode stored in profile or generate a short form based on UID
                const refCode = userData.referralCode || "MCJB" + userData.uid.substring(0, 5).toUpperCase();
                document.getElementById('myReferralCode').value = refCode;

                if(userData.totalTeam) document.getElementById('totalTeam').innerText = userData.totalTeam;
                if(userData.referralBonus) document.getElementById('referralBonus').innerText = `৳ ${Number(userData.referralBonus).toFixed(2)}`;
            } else {
                window.location.href = 'login.html';
            }
        });

        window.copyReferralCode = function() {
            const copyText = document.getElementById('myReferralCode');
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert('রেফার কোড সফলভাবে কপি হয়েছে!');
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await logoutUser();
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
