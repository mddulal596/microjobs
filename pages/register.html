<!DOCTYPE html>
<html lang="en" class="transform-gpu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 antialiased flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-white shadow-xl rounded-3xl p-6 space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-1">
            <h1 class="text-xl font-extrabold text-indigo-600">Micro Job Pro</h1>
            <p class="text-xs text-gray-500">Create an account & claim ৳10 bonus with a referral code!</p>
        </div>

        <!-- Registration Form -->
        <form id="registerForm" class="space-y-4">
            <div class="space-y-1">
                <label class="text-[11px] font-semibold text-gray-600">Full Name</label>
                <input type="text" id="fullName" required placeholder="Enter your full name" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-xs text-gray-700 focus:outline-none focus:border-indigo-500">
            </div>

            <div class="space-y-1">
                <label class="text-[11px] font-semibold text-gray-600">Email Address</label>
                <input type="email" id="email" required placeholder="Enter your email" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-xs text-gray-700 focus:outline-none focus:border-indigo-500">
            </div>

            <div class="space-y-1">
                <label class="text-[11px] font-semibold text-gray-600">Password</label>
                <input type="password" id="password" required placeholder="Enter password (min 6 chars)" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-xs text-gray-700 focus:outline-none focus:border-indigo-500">
            </div>

            <!-- Referral Code Field -->
            <div class="space-y-1">
                <label class="text-[11px] font-semibold text-gray-600">Referral Code (Optional)</label>
                <input type="text" id="refCode" placeholder="e.g., MCJFVIPB" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-xs font-bold uppercase tracking-widest text-indigo-600 focus:outline-none focus:border-indigo-500">
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition">
                Register & Claim ৳10 Bonus
            </button>
        </form>

        <p class="text-center text-xs text-gray-500">
            Already have an account? <a href="login.html" class="text-indigo-600 font-bold hover:underline">Login here</a>
        </p>
    </div>

    <!-- Firebase Script & Logic -->
    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, setDoc, getDocs, collection, query, where, updateDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth } from '../firebase/auth.js';

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const inputRefCode = document.getElementById('refCode').value.trim().toUpperCase();
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.innerText = "Creating account...";

            try {
                // 1. Create user in Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                await updateProfile(user, { displayName: fullName });

                // 2. Generate short referral code for this new user
                const myShortRef = "MCJB" + user.uid.substring(0, 5).toUpperCase();
                
                let initialBonus = 0.00;
                let validReferrerUid = null;

                // 3. Verify Referral Code in Firestore
                if (inputRefCode) {
                    const usersRef = collection(db, "users");
                    const q = query(usersRef, where("referralCode", "==", inputRefCode));
                    const querySnapshot = await getDocs(q);

                    if (!querySnapshot.empty) {
                        querySnapshot.forEach((docSnap) => {
                            validReferrerUid = docSnap.id;
                        });
                        initialBonus = 10.00; // New user gets ৳10 bonus if valid referral code is entered
                    } else {
                        alert('সতর্কতা: ভুল রেফার কোড দেওয়া হয়েছে! কোনো বোনাস যোগ হবে না, তবে একাউন্ট তৈরি হবে।');
                    }
                }

                // 4. Save user data to Firestore
                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    displayName: fullName,
                    email: email,
                    referralCode: myShortRef,
                    balances: {
                        main: initialBonus,
                        deposit: 0.00
                    },
                    referredBy: validReferrerUid || null,
                    createdAt: serverTimestamp()
                });

                // 5. Update Referrer's Team Count if valid
                if (validReferrerUid) {
                    const referrerRef = doc(db, "users", validReferrerUid);
                    await updateDoc(referrerRef, {
                        totalTeam: increment(1)
                    });
                }

                alert('একাউন্ট সফলভাবে তৈরি হয়েছে!');
                window.location.href = 'dashboard.html';

            } catch (error) {
                console.error("Registration error:", error);
                alert('রেজিস্ট্রেশন ত্রুটি: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "Register & Claim ৳10 Bonus";
            }
        });
    </script>
</body>
</html>
