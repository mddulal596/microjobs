<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Offer - Micro Job Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-24">
        
        <!-- Top Header & Balances -->
        <header class="p-4 bg-indigo-600 text-white rounded-b-3xl shadow-md">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center">
                    <a href="profile.html" class="flex items-center gap-2 bg-indigo-700/80 hover:bg-indigo-700 border border-indigo-400/40 px-3 py-1.5 rounded-full shadow-inner transition">
                        <div id="profileIconBtn" class="w-6 h-6 bg-white text-indigo-600 rounded-full flex items-center justify-center text-xs font-extrabold shadow">
                            U
                        </div>
                        <span id="userNameDisplay" class="text-xs font-bold tracking-wide truncate max-w-[120px]">Loading...</span>
                    </a>
                </div>
                <a href="dashboard.html" class="text-xs bg-indigo-700/80 hover:bg-indigo-700 px-3 py-1.5 rounded-full font-bold transition">Home</a>
            </div>
            <div class="grid grid-cols-2 gap-3 mt-2">
                <div class="bg-indigo-700/50 p-3 rounded-2xl backdrop-blur-sm border border-indigo-500/30">
                    <p class="text-[11px] text-indigo-200 font-medium">Main Balance</p>
                    <h2 id="mainBalance" class="text-lg font-extrabold mt-1">৳ 0.00</h2>
                </div>
                <div class="bg-indigo-700/50 p-3 rounded-2xl backdrop-blur-sm border border-indigo-500/30">
                    <p class="text-[11px] text-indigo-200 font-medium">Deposit Balance</p>
                    <h2 id="depositBalance" class="text-lg font-extrabold mt-1">৳ 0.00</h2>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="p-4 flex-grow space-y-4 overflow-y-auto">
            
            <div class="space-y-1">
                <h2 class="text-xs font-bold text-gray-700 uppercase tracking-wide">EXCLUSIVE DRIVE OFFERS</h2>
                <p class="text-[11px] text-gray-500 leading-relaxed">
                    Select your preferred mobile operator and get amazing internet & minute packs at discounted rates.
                </p>
            </div>

            <!-- Operator Tabs -->
            <div class="grid grid-cols-4 gap-2">
                <button onclick="filterOperator('GP', this)" class="operator-tab py-2 bg-indigo-600 text-white font-bold text-xs rounded-xl shadow transition">GP</button>
                <button onclick="filterOperator('ROBI', this)" class="operator-tab py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 font-bold text-xs rounded-xl transition">Robi</button>
                <button onclick="filterOperator('BL', this)" class="operator-tab py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 font-bold text-xs rounded-xl transition">Banglalink</button>
                <button onclick="filterOperator('AIRTEL', this)" class="operator-tab py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 font-bold text-xs rounded-xl transition">Airtel</button>
            </div>

            <!-- Offers List Container -->
            <div id="offersList" class="space-y-3">
                <!-- Offers will be loaded dynamically here -->
            </div>

        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-2 bg-white border-t border-gray-200 shadow-lg flex justify-around items-center z-50">
            <a href="https://t.me/microjobspro" target="_blank" class="flex flex-col items-center text-gray-500 hover:text-indigo-600 text-[10px]">
                <span class="text-lg">🎧</span>
                <span>Help</span>
            </a>
            <a href="deposit.html" class="flex flex-col items-center text-gray-500 hover:text-indigo-600 text-[10px]">
                <span class="text-lg">👛</span>
                <span>Wallet</span>
            </a>
            <a href="dashboard.html" class="flex flex-col items-center text-gray-500 hover:text-indigo-600 text-[10px]">
                <div class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 text-base">
                    🏠
                </div>
                <span class="font-medium mt-0.5">Home</span>
            </a>
            <a href="referral.html" class="flex flex-col items-center text-gray-500 hover:text-indigo-600 text-[10px]">
                <div class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 text-base">
                    👥
                </div>
                <span class="font-medium mt-0.5">Team</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center text-gray-500 hover:text-indigo-600 text-[10px]">
                <span class="text-lg">👤</span>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <!-- Firebase Script & Logic -->
    <script type="module">
        import { observeAuthState } from '../firebase/auth.js';

        observeAuthState((userData) => {
            if (userData) {
                const name = userData.fullName || userData.displayName || "User";
                document.getElementById('profileIconBtn').innerText = name.charAt(0).toUpperCase();
                document.getElementById('userNameDisplay').innerText = name;

                const mainBal = userData.mainBalance ?? userData.balances?.main ?? 0;
                const depositBal = userData.depositBalance ?? userData.balances?.deposit ?? 0;
                document.getElementById('mainBalance').innerText = `৳ ${Number(mainBal).toFixed(2)}`;
                document.getElementById('depositBalance').innerText = `৳ ${Number(depositBal).toFixed(2)}`;
            } else {
                window.location.href = 'login.html';
            }
        });

        // Sample Offers Data
        const allOffers = {
            'GP': [
                { title: '40 GB + 500 Min', validity: 'GP - 30 Days', regularPrice: 699, offerPrice: 499 },
                { title: '15 GB Internet', validity: 'GP - 7 Days', regularPrice: 249, offerPrice: 179 }
            ],
            'ROBI': [
                { title: '30 GB + 400 Min', validity: 'Robi - 30 Days', regularPrice: 598, offerPrice: 429 },
                { title: '10 GB Internet', validity: 'Robi - 7 Days', regularPrice: 199, offerPrice: 139 }
            ],
            'BL': [
                { title: '50 GB Internet', validity: 'Banglalink - 30 Days', regularPrice: 799, offerPrice: 549 },
                { title: '20 GB + 200 Min', validity: 'Banglalink - 15 Days', regularPrice: 399, offerPrice: 289 }
            ],
            'AIRTEL': [
                { title: '25 GB + 300 Min', validity: 'Airtel - 30 Days', regularPrice: 549, offerPrice: 399 },
                { title: '12 GB Internet', validity: 'Airtel - 7 Days', regularPrice: 219, offerPrice: 159 }
            ]
        };

        window.filterOperator = function(operator, btnElement) {
            // Update active button styles
            document.querySelectorAll('.operator-tab').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white', 'shadow');
                btn.classList.add('bg-gray-100', 'text-gray-700', 'hover:bg-gray-200');
            });
            btnElement.classList.remove('bg-gray-100', 'text-gray-700', 'hover:bg-gray-200');
            btnElement.classList.add('bg-indigo-600', 'text-white', 'shadow');

            // Render offers for selected operator
            const container = document.getElementById('offersList');
            const offers = allOffers[operator] || [];

            if (offers.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-gray-400 py-6">No offers available for this operator right now.</p>`;
                return;
            }

            container.innerHTML = offers.map(offer => `
                <div class="bg-gray-50 border border-gray-200 p-4 rounded-2xl flex items-center justify-between shadow-sm">
                    <div class="space-y-1">
                        <span class="text-[10px] font-bold bg-indigo-100 text-indigo-600 px-2 py-0.5 rounded-md">${offer.validity}</span>
                        <h3 class="text-sm font-extrabold text-gray-800">${offer.title}</h3>
                        <p class="text-[11px] text-gray-500 line-through">Regular Price: ৳ ${offer.regularPrice}</p>
                    </div>
                    <div class="text-right space-y-2">
                        <span class="block text-sm font-extrabold text-green-600">৳ ${offer.offerPrice}</span>
                        <button onclick="buyOffer('${offer.title}', '${offer.offerPrice}')" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow transition cursor-pointer">
                            Buy Now
                        </button>
                    </div>
                </div>
            `).join('');
        }

        window.buyOffer = function(packageName, price) {
            alert(`You selected: ${packageName} for ৳${price}. Please confirm purchase.`);
        }

        // Load default GP offers on page load
        window.addEventListener('DOMContentLoaded', () => {
            const defaultBtn = document.querySelector('.operator-tab');
            if(defaultBtn) filterOperator('GP', defaultBtn);
        });
    </script>
</body>
</html>
