<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks Marketplace - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between hidden md:flex">
        <div class="p-6">
            <h1 class="text-2xl font-black bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">MicroJobPro</h1>
            <nav class="mt-8 space-y-2">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl font-semibold">Dashboard</a>
                <a href="tasks.html" class="flex items-center gap-3 px-4 py-3 bg-blue-600 text-white rounded-xl font-semibold">Tasks Marketplace</a>
                <a href="post-task.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl font-semibold">Post New Job</a>
                <a href="wallet.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl font-semibold">Wallet</a>
                <a href="withdraw.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl font-semibold">Withdraw</a>
                <a href="referral.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl font-semibold">Referrals</a>
            </nav>
        </div>
        <div class="p-6 border-t border-slate-800">
            <button id="logoutBtn" class="w-full bg-red-600/10 text-red-500 hover:bg-red-600 hover:text-white py-3 rounded-xl font-bold transition-all">Logout</button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="h-20 bg-slate-900/50 border-b border-slate-800 px-8 flex items-center justify-between">
            <h2 class="text-xl font-bold text-white">Tasks Marketplace</h2>
            <div class="flex items-center gap-4">
                <a href="post-task.html" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition-all">+ Post Job</a>
            </div>
        </header>

        <div class="p-8 max-w-7xl w-full mx-auto space-y-6">
            <!-- Category Filter Buttons Bar -->
            <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none" id="categoryFilterBar">
                <button onclick="filterCategory('All')" class="cat-btn px-4 py-2 bg-blue-600 text-white text-xs font-semibold rounded-xl shrink-0 transition-all">All Tasks</button>
                <button onclick="filterCategory('YouTube Subscribe')" class="cat-btn px-4 py-2 bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-300 text-xs font-semibold rounded-xl shrink-0 transition-all">YouTube Subscribe</button>
                <button onclick="filterCategory('Website Visit')" class="cat-btn px-4 py-2 bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-300 text-xs font-semibold rounded-xl shrink-0 transition-all">Website Visit</button>
                <button onclick="filterCategory('Facebook Like')" class="cat-btn px-4 py-2 bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-300 text-xs font-semibold rounded-xl shrink-0 transition-all">Facebook Like</button>
                <button onclick="filterCategory('Instagram Follow')" class="cat-btn px-4 py-2 bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-300 text-xs font-semibold rounded-xl shrink-0 transition-all">Instagram Follow</button>
                <button onclick="filterCategory('Telegram Join')" class="cat-btn px-4 py-2 bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-300 text-xs font-semibold rounded-xl shrink-0 transition-all">Telegram Join</button>
            </div>

            <!-- Tasks List Container -->
            <div id="tasksContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="col-span-full p-8 text-center bg-slate-900 border border-slate-800 rounded-3xl text-slate-400">
                    Loading available tasks...
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { observeAuthState, logoutUser } from '../firebase/auth.js';
        import { getTasks } from '../firebase/firestore.js';

        let allTasks = [];

        observeAuthState(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            try {
                allTasks = await getTasks();
                renderTasks(allTasks);
            } catch (error) {
                console.error("Error loading tasks:", error);
                document.getElementById('tasksContainer').innerHTML = `
                    <div class="col-span-full p-8 text-center bg-slate-900 border border-slate-800 rounded-3xl text-red-400">
                        Failed to load tasks. Please check console for details.
                    </div>
                `;
            }
        });

        window.filterCategory = function(category) {
            // Update active button styles
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if(btn.textContent.trim().toLowerCase() === category.toLowerCase() || (category === 'All' && btn.textContent.includes('All'))) {
                    btn.className = "cat-btn px-4 py-2 bg-blue-600 text-white text-xs font-semibold rounded-xl shrink-0 transition-all";
                } else {
                    btn.className = "cat-btn px-4 py-2 bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-300 text-xs font-semibold rounded-xl shrink-0 transition-all";
                }
            });

            if (category === 'All') {
                renderTasks(allTasks);
            } else {
                const filtered = allTasks.filter(t => t.category === category);
                renderTasks(filtered);
            }
        }

        function renderTasks(tasks) {
            const container = document.getElementById('tasksContainer');
            
            if (!tasks || tasks.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full p-8 text-center bg-slate-900 border border-slate-800 rounded-3xl">
                        <p class="text-slate-400">No active tasks available in this category right now!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = tasks.map(task => `
                <div class="p-6 bg-slate-900 border border-slate-800 rounded-3xl shadow-xl flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="px-2.5 py-0.5 bg-blue-500/10 text-blue-400 text-xs font-semibold rounded-md">${task.category || 'General'}</span>
                            <span class="px-3 py-1 bg-emerald-500/10 text-emerald-400 text-xs font-bold rounded-full">$${(task.reward || 0).toFixed(2)}</span>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-2">${task.title || 'Micro Job'}</h3>
                        <p class="text-sm text-slate-400 mb-6">${task.description || 'Complete this simple task to earn reward.'}</p>
                    </div>
                    <div class="flex items-center justify-between pt-4 border-t border-slate-800">
                        <span class="text-xs text-slate-500">Remaining Slots: ${task.remainingSlots ?? task.slots ?? 'Unlimited'}</span>
                        <a href="task-details.html?id=${task.id}" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold rounded-xl transition-all">View Task</a>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await logoutUser();
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
