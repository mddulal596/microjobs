<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks Marketplace - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen overflow-hidden">
    <main class="flex-1 flex flex-col overflow-y-auto p-8 max-w-7xl mx-auto w-full">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-black text-white">Tasks Marketplace</h1>
            <a href="dashboard.html" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-sm font-semibold">Back to Dashboard</a>
        </header>

        <div id="taskList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Tasks loaded here -->
        </div>
    </main>

    <script type="module">
        import { getTasks } from '../firebase/firestore.js';

        async function loadTasks() {
            const tasks = await getTasks();
            const container = document.getElementById('taskList');
            container.innerHTML = '';
            
            tasks.forEach(task => {
                container.innerHTML += `
                    <div class="p-6 bg-slate-900 border border-slate-800 rounded-3xl shadow-xl flex flex-col justify-between">
                        <div>
                            <span class="px-3 py-1 bg-blue-500/10 text-blue-400 text-xs font-bold rounded-full uppercase">${task.category}</span>
                            <h3 class="text-xl font-bold text-white mt-4">${task.title}</h3>
                            <p class="text-slate-400 text-sm mt-2 line-clamp-2">${task.instructions}</p>
                        </div>
                        <div class="mt-6 pt-4 border-t border-slate-800 flex items-center justify-between">
                            <span class="text-xl font-black text-emerald-400">$${task.reward}</span>
                            <a href="task-details.html?id=${task.id}" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-semibold">View Task</a>
                        </div>
                    </div>
                `;
            });
        }
        loadTasks();
    </script>
</body>
</html>
