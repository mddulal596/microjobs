<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-6">
    <div class="w-full max-w-md p-8 bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl">
        <h1 class="text-2xl font-black text-white mb-6 text-center">Fund Advertiser Account</h1>
        <form id="depositForm" class="space-y-5">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Gateway</label>
                <select id="method" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white">
                    <option value="bKash">bKash Merchant</option>
                    <option value="Nagad">Nagad Merchant</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Amount ($)</label>
                <input type="number" id="amount" required min="10" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Transaction ID</label>
                <input type="text" id="txId" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl font-bold shadow-lg">Confirm Deposit</button>
        </form>
    </div>

    <script type="module">
        import { requestDeposit } from '../firebase/firestore.js';
        import { auth } from '../firebase/firebase-config.js';

        document.getElementById('depositForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) { alert('Please login'); return; }

            try {
                await requestDeposit({
                    userId: user.uid,
                    method: document.getElementById('method').value,
                    amount: parseFloat(document.getElementById('amount').value),
                    transactionId: document.getElementById('txId').value
                });
                alert('Deposit submitted for admin verification.');
                window.location.href = 'wallet.html';
            } catch (err) {
                alert(err.message);
            }
        });
    </script>
</body>
</html>
