<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between hidden md:flex">
        <div class="p-6">
            <h1 class="text-2xl font-black bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">MicroJobPro</h1>
            <nav class="mt-8 space-y-2">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 bg-blue-600 text-white rounded-xl font-semibold">Dashboard</a>
                <a href="tasks.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl font-semibold">Tasks Marketplace</a>
                <a href="post-task.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl font-semibold">Post New Job</a>
                <a href="wallet.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl font-semibold">Wallet</a>
                <a href="withdraw.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl font-semibold">Withdraw</a>
                <a href="referral.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl font-semibold">Referrals</a>
            </nav>
        </div>
        <div class="p-6 border-t border-slate-800">
            <button id="logoutBtn" class="w-full bg-red-600/10 text-red-500 hover:bg-red-600 hover:text-white py-3 rounded-xl font-bold transition-all">Logout</button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="h-20 bg-slate-900/50 border-b border-slate-800 px-8 flex items-center justify-between">
            <h2 class="text-xl font-bold text-white">Dashboard</h2>
            
            <!-- User Profile Header Section -->
            <div class="flex items-center gap-3">
                <img id="userAvatar" src="https://via.placeholder.com/150" alt="Profile" class="w-10 h-10 rounded-full object-cover border border-slate-700">
                <div class="hidden md:block text-left">
                    <p id="userName" class="text-sm font-bold text-white">Loading...</p>
                    <p id="userEmail" class="text-xs text-slate-400">Loading...</p>
                </div>
            </div>
        </header>

        <div class="p-8 max-w-7xl w-full mx-auto space-y-6">
            <!-- Dashboard Welcome & Stats Cards -->
            <div class="p-8 bg-slate-900 border border-slate-800 rounded-3xl shadow-xl space-y-4">
                <h3 class="text-2xl font-bold text-white">Welcome back, <span id="welcomeName" class="text-blue-400">User</span>!</h3>
                <p class="text-slate-400 text-sm">Here is a quick overview of your account activity and earnings.</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { observeAuthState, logoutUser } from '../firebase/auth.js';

        observeAuthState(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            try {
                // ইউজারের নাম, ইমেইল এবং ছবি ফায়ারবেস থেকে নিয়ে এসে এইচটিএমএসে বসানো হচ্ছে
                const displayName = user.displayName || user.email.split('@')[0] || 'Valued User';
                const email = user.email || 'No email available';
                // যদি ইউজারের ছবি না থাকে তবে ডিফল্ট অ্যাভাটার দেখাবে
                const photoURL = user.photoURL || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces';

                document.getElementById('userName').innerText = displayName;
                document.getElementById('userEmail').innerText = email;
                document.getElementById('welcomeName').innerText = displayName;
                document.getElementById('userAvatar').src = photoURL;

            } catch (error) {
                console.error("Error loading user profile details:", error);
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await logoutUser();
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
