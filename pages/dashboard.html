<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between hidden md:flex">
        <div class="p-6">
            <h1 class="text-2xl font-black bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">MicroJobPro</h1>
            <nav class="mt-8 space-y-2">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 bg-blue-600 text-white rounded-xl font-semibold">Dashboard</a>
                <a href="tasks.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl font-semibold">Tasks Marketplace</a>
                <a href="wallet.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl font-semibold">Wallet</a>
                <a href="withdraw.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl font-semibold">Withdraw</a>
                <a href="referral.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-xl font-semibold">Referrals</a>
            </nav>
        </div>
        <div class="p-6 border-t border-slate-800">
            <button id="logoutBtn" class="w-full bg-red-600/10 text-red-500 hover:bg-red-600 hover:text-white py-3 rounded-xl font-bold transition-all">Logout</button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="h-20 bg-slate-900/50 border-b border-slate-800 px-8 flex items-center justify-between">
            <h2 class="text-xl font-bold text-white">Dashboard Overview</h2>
            <div id="userInfo" class="flex items-center gap-3">
                <span id="userName" class="font-semibold text-slate-200">Loading...</span>
            </div>
        </header>

        <div class="p-8 max-w-7xl w-full mx-auto space-y-8">
            <!-- Balance Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="p-6 bg-slate-900 border border-slate-800 rounded-3xl shadow-xl">
                    <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Main Balance</p>
                    <h3 id="mainBalance" class="text-3xl font-black text-emerald-400 mt-2">$0.00</h3>
                </div>
                <div class="p-6 bg-slate-900 border border-slate-800 rounded-3xl shadow-xl">
                    <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Pending Earnings</p>
                    <h3 id="pendingBalance" class="text-3xl font-black text-amber-400 mt-2">$0.00</h3>
                </div>
                <div class="p-6 bg-slate-900 border border-slate-800 rounded-3xl shadow-xl">
                    <p class="text-xs font-bold uppercase tracking-wider text-slate-400">Referral Income</p>
                    <h3 id="referralBalance" class="text-3xl font-black text-blue-400 mt-2">$0.00</h3>
                </div>
                <div class="p-6 bg-slate-900 border border-slate-800 rounded-3xl shadow-xl">
                    <p class="text-xs font-bold uppercase tracking-wider text-slate-400">User Level / Rank</p>
                    <h3 id="userLevel" class="text-3xl font-black text-indigo-400 mt-2">Level 1</h3>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { observeAuthState, logoutUser } from '../firebase/auth.js';
        import { db } from '../firebase/firebase-config.js';
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        observeAuthState(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            try {
                const userSnap = await getDoc(doc(db, "users", user.uid));
                if (userSnap.exists()) {
                    const data = userSnap.data();
                    
                    // ইউজারের নাম বা ফালব্যাক সেট করা যাতে Loading আটকে না থাকে
                    const displayName = data.displayName || user.displayName || user.email.split('@')[0];
                    document.getElementById('userName').innerText = displayName;

                    document.getElementById('mainBalance').innerText = `$${(data.balances?.main || 0).toFixed(2)}`;
                    document.getElementById('pendingBalance').innerText = `$${(data.balances?.pending || 0).toFixed(2)}`;
                    document.getElementById('referralBalance').innerText = `$${(data.balances?.referral || 0).toFixed(2)}`;
                    document.getElementById('userLevel').innerText = `Level ${data.level || 1}`;
                } else {
                    document.getElementById('userName').innerText = user.displayName || "User";
                }
            } catch (error) {
                console.error("Error loading dashboard data:", error);
                document.getElementById('userName').innerText = user.displayName || "Account";
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await logoutUser();
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
