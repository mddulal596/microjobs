    <style>
        /* Animated Bottom Nav Styles */
        .nav-container {  
            position: fixed;  
            bottom: 15px;  
            left: 50%;
            transform: translateX(-50%);
            width: 92%;  
            max-width: 440px;  
            height: 70px;  
            background: #4f46e5;  
            border-radius: 22px;  
            display: flex;  
            justify-content: space-around;  
            align-items: center;  
            box-shadow: 0 10px 25px rgba(0,0,0,.2);  
            overflow: visible;  
            z-index: 100;
        }  
          
        .nav-item-animated {  
            flex: 1;  
            text-decoration: none;  
            color: #fff;  
            text-align: center;  
            position: relative;  
            z-index: 2;  
        }  
          
        .nav-item-animated i {  
            font-size: 22px;  
            transition: .35s;  
        }  
          
        .nav-item-animated span {  
            display: block;  
            font-size: 11px;  
            margin-top: 4px;  
            transition: .35s;  
        }  
          
        .nav-item-animated.active i {  
            transform: translateY(-10px);  
        }  
          
        .nav-item-animated.active span {  
            font-weight: bold;  
        }  
          
        .indicator {  
            position: absolute;  
            top: -15px;  
            width: 60px;  
            height: 60px;  
            background: #312e81;  
            border-radius: 50%;  
            border: 4px solid #fff;  
            transition: left .35s ease;  
            box-shadow: 0 0 20px rgba(49,46,129,.5);  
            z-index: 1;  
        }  
          
        .indicator::before {  
            content: "";  
            position: absolute;  
            inset: -6px;  
            border-radius: 50%;  
            border: 2px solid rgba(49,46,129,.4);  
            animation: pulse 2s infinite;  
        }  
          
        @keyframes pulse {  
            0% { transform: scale(1); opacity: 1; }  
            100% { transform: scale(1.4); opacity: 0; }  
        } 
    </style>
</head>

    <!-- Navigation Animation Script -->
    <script>  
        const items = document.querySelectorAll(".nav-item-animated");  
        const indicator = document.querySelector(".indicator");  
          
        function moveIndicator(el){  
            if (!el) return;
            const left = el.offsetLeft + (el.offsetWidth / 2) - (indicator.offsetWidth / 2);  
            indicator.style.left = left + "px";  
            items.forEach(i => i.classList.remove("active"));  
            el.classList.add("active");  
        }  
          
        items.forEach(item => {  
            item.addEventListener("click", () => {  
                moveIndicator(item);  
            });  
        });  
          
        window.onload = () => moveIndicator(document.querySelector(".nav-item-animated.active"));  
        window.onresize = () => moveIndicator(document.querySelector(".nav-item-animated.active"));  
    </script>

    <!-- Firebase & Auth Script -->
    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { observeAuthState } from '../firebase/auth.js';
        import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        observeAuthState(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            // নাম এবং ছবি সেট করা
            const name = user.fullName || user.displayName || "User";
            document.getElementById('userNameDisplay').innerText = name;

            const profileImgTag = document.getElementById('profileImage');
            const profileInitialTag = document.getElementById('profileInitial');

            if (user.photoURL) {
                profileImgTag.src = user.photoURL;
                profileImgTag.classList.remove('hidden');
                profileInitialTag.classList.add('hidden');
            } else {
                profileInitialTag.innerText = name.charAt(0).toUpperCase();
                profileInitialTag.classList.remove('hidden');
                profileImgTag.classList.add('hidden');
            }

            // ফায়ারবেজ থেকে রিয়েল-টাইমে ব্যালেন্স লোড করা
            const userDocRef = doc(db, "users", user.uid);
            
            onSnapshot(userDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    let balance = 0;
                    if (data.balances && typeof data.balances.main !== 'undefined') {
                        balance = data.balances.main;
                    } else if (typeof data.mainBalance !== 'undefined') {
                        balance = data.mainBalance;
                    } else if (typeof data.balance !== 'undefined') {
                        balance = data.balance;
                    }
                    document.getElementById('mainBalance').innerText = Number(balance).toFixed(2);
                }
            }, (error) => {
                console.error("Error fetching balance:", error);
            });
        });
    </script>
