    <style>
        .nav-container {  
            position: fixed;  
            bottom: 15px;  
            left: 50%;
            transform: translateX(-50%);

            max-width: 440px;  
            height: 70px;

            box-shadow: 0 10px 25px rgba(0,0,0,.2);

        }  
        .nav-item-animated {  
            flex: 1;  
            text-decoration: none;  
            color: #fff;  
            text-align: center;  
            position: relative;  
            z-index: 2;  
        }  
        .nav-item-animated i {

            transition: .35s;  
        }  
        .nav-item-animated span {  
            display: block;  
            font-size: 11px;  
            margin-top: 4px;  
            transition: .35s;  
        }  
        .nav-item-animated.active i {  
            transform: translateY(-10px);  
        }  
        .nav-item-animated.active span {  
            font-weight: bold;  
        }  
        .indicator {  
            position: absolute;  
            top: -15px;  
            width: 60px;  
            height: 60px;  
            background: #312e81;  
            border-radius: 50%;  
            border: 4px solid #fff;  
            transition: left .35s ease;  
            box-shadow: 0 0 20px rgba(49,46,129,.5);  
            z-index: 1;  
        }  
        .indicator::before {  
            content: "";  
            position: absolute;  
            inset: -6px;  
            border-radius: 50%;  
            border: 2px solid rgba(49,46,129,.4);  
            animation: pulse 2s infinite;  
        }  
        @keyframes pulse {  
            0% { transform: scale(1); opacity: 1; }  
            100% { transform: scale(1.4); opacity: 0; }  
        } 
    </style>
</head>

    <script>  
        const items = document.querySelectorAll(".nav-item-animated");  
        const indicator = document.querySelector(".indicator");  
        function moveIndicator(el){  
            if (!el) return;
            const left = el.offsetLeft + (el.offsetWidth / 2) - (indicator.offsetWidth / 2);  
            indicator.style.left = left + "px";  
            items.forEach(i => i.classList.remove("active"));  
            el.classList.add("active");  
        }  
        items.forEach(item => { item.addEventListener("click", () => moveIndicator(item)); });  
        window.onload = () => moveIndicator(document.querySelector(".nav-item-animated"));  
    </script>

    <!-- Firebase Script & Logic -->
    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { observeAuthState } from '../firebase/auth.js';
        import { doc, getDoc, updateDoc, increment, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // আপনার এডস্টারা ডাইরেক্ট লিংক এখানে বসাবেন
        const adsterraDirectLink = "https://your-adsterra-direct-link.com"; 

        let currentUserUid = null;

        observeAuthState(async (userData) => {
            if (userData) {
                currentUserUid = userData.uid;
                checkLastBonus(currentUserUid);
            } else {
                window.location.href = 'login.html';
            }
        });

        async function checkLastBonus(uid) {
            try {
                const userRef = doc(db, "users", uid);
                const userDoc = await getDoc(userRef);
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    const lastBonusTime = data.lastBonus?.toDate();
                    if (lastBonusTime) {
                        const now = new Date();
                        const diffMs = now - lastBonusTime;
                        const twentyFourHoursMs = 24 * 60 * 60 * 1000;

                        if (diffMs < twentyFourHoursMs) {
                            const remainingTimeMs = twentyFourHoursMs - diffMs;
                            startCountdown(remainingTimeMs);
                        }
                    }
                }
            } catch (error) {
                console.error("Error checking bonus status:", error);
            }
        }

        function startCountdown(durationMs) {
            const btn = document.getElementById('claimBtn');
            btn.disabled = true;
            btn.classList.add('opacity-60', 'cursor-not-allowed');

            const endTime = new Date().getTime() + durationMs;

            const interval = setInterval(() => {
                const now = new Date().getTime();
                const timeLeft = endTime - now;

                if (timeLeft <= 0) {
                    clearInterval(interval);
                    btn.disabled = false;
                    btn.classList.remove('opacity-60', 'cursor-not-allowed');
                    btn.innerText = "Claim Bonus Now";
                    document.getElementById('bonusMessage').innerHTML = "";
                    return;
                }

                const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

                // "Claim Bonus Now" লেখা হাইড করে কাউন্টডাউন দেখানো
                btn.innerText = `Next Claim: ${hours}h ${minutes}m ${seconds}s`;
            }, 1000);
        }

        window.claimBonus = async function() {
            if (!currentUserUid) return;
            const btn = document.getElementById('claimBtn');
            const msgDiv = document.getElementById('bonusMessage');
            
            // ১. এডস্টারা ডাইরেক্ট লিংক নতুন ট্যাবে ওপেন করা
            window.open(adsterraDirectLink, '_blank');

            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                const userRef = doc(db, "users", currentUserUid);
                
                // Update user main balance and lastBonus timestamp in Firestore
                await updateDoc(userRef, {
                    mainBalance: increment(5.00),
                    lastBonus: serverTimestamp()
                });

                // Record in earnings collection
                await addDoc(collection(db, "earnings"), {
                    userId: currentUserUid,
                    title: "Daily Login Bonus",
                    amount: 5.00,
                    status: "approved",
                    timestamp: serverTimestamp()
                });

                msgDiv.innerHTML = `<span class="text-emerald-600 font-bold">Successfully claimed ৳ 5.00 bonus!</span>`;
                
                // ২৪ ঘণ্টার রিয়েল-টাইম কাউন্টডাউন শুরু করা
                startCountdown(24 * 60 * 60 * 1000);
            } catch (error) {
                console.error("Error claiming bonus:", error);
                msgDiv.innerHTML = `<span class="text-red-500">Failed to claim bonus. Try again later.</span>`;
                btn.disabled = false;
                btn.innerText = "Claim Bonus Now";
            }
        }
    </script>
