<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Bonus - Micro Job Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>  
    
    <style>
        .nav-container {  
            position: fixed;  
            bottom: 15px;  
            left: 50%;
            transform: translateX(-50%);
            width: 92%;  
            max-width: 440px;  
            height: 70px;  
            background: #4f46e5;  
            border-radius: 22px;  
            display: flex;  
            justify-content: space-around;  
            align-items: center;  
            box-shadow: 0 10px 25px rgba(0,0,0,.2);  
            overflow: visible;  
            z-index: 100;
        }  
        .nav-item-animated {  
            flex: 1;  
            text-decoration: none;  
            color: #fff;  
            text-align: center;  
            position: relative;  
            z-index: 2;  
        }  
        .nav-item-animated i {  
            font-size: 22px;  
            transition: .35s;  
        }  
        .nav-item-animated span {  
            display: block;  
            font-size: 11px;  
            margin-top: 4px;  
            transition: .35s;  
        }  
        .nav-item-animated.active i {  
            transform: translateY(-10px);  
        }  
        .nav-item-animated.active span {  
            font-weight: bold;  
        }  
        .indicator {  
            position: absolute;  
            top: -15px;  
            width: 60px;  
            height: 60px;  
            background: #312e81;  
            border-radius: 50%;  
            border: 4px solid #fff;  
            transition: left .35s ease;  
            box-shadow: 0 0 20px rgba(49,46,129,.5);  
            z-index: 1;  
        }  
        .indicator::before {  
            content: "";  
            position: absolute;  
            inset: -6px;  
            border-radius: 50%;  
            border: 2px solid rgba(49,46,129,.4);  
            animation: pulse 2s infinite;  
        }  
        @keyframes pulse {  
            0% { transform: scale(1); opacity: 1; }  
            100% { transform: scale(1.4); opacity: 0; }  
        } 
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-28">
        
        <!-- Header -->
        <header class="p-5 bg-gradient-to-r from-purple-600 to-indigo-700 text-white rounded-b-3xl shadow-lg relative">
            <div class="flex justify-between items-center mb-2">
                <a href="dashboard.html" class="text-xs bg-white/25 px-3.5 py-1.5 rounded-full font-bold hover:bg-white/40 transition flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-left"></i> Back
                </a>
                <h1 class="text-sm font-extrabold uppercase tracking-wide">Daily Bonus</h1>
                <div class="w-10"></div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="p-5 flex-grow flex flex-col items-center justify-center text-center">
            <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-3xl mb-4 shadow-inner">
                <i class="fa-solid fa-gift animate-bounce"></i>
            </div>
            
            <h2 class="text-lg font-extrabold text-gray-800 mb-1">Claim Your Daily Reward</h2>
            <p class="text-xs text-gray-500 mb-6 max-w-xs">Collect your free bonus every 24 hours and boost your main balance instantly!</p>

            <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-2xl w-full mb-6">
                <p class="text-xs text-indigo-600 font-semibold mb-1">Today's Bonus Amount</p>
                <h3 class="text-2xl font-black text-indigo-700">৳ 5.00</h3>
            </div>

            <button id="claimBtn" onclick="claimBonus()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-3.5 rounded-2xl shadow-lg hover:opacity-95 transition text-sm">
                Claim Bonus Now
            </button>

            <div id="bonusMessage" class="mt-4 text-xs font-semibold"></div>
        </main>

        <!-- Animated Bottom Navigation -->
        <div class="nav-container">  
            <div class="indicator"></div>  
            <a href="https://t.me/microjobspro" target="_blank" class="nav-item-animated">  
                <i class="fa-solid fa-headset"></i><span>Help</span>  
            </a>  
            <a href="wallet.html" class="nav-item-animated">  
                <i class="fa-solid fa-wallet"></i><span>Wallet</span>  
            </a>  
            <a href="dashboard.html" class="nav-item-animated">  
                <i class="fa-solid fa-house"></i><span>Home</span>  
            </a>  
            <a href="referral.html" class="nav-item-animated">  
                <i class="fa-solid fa-user-group"></i><span>Team</span>  
            </a>  
            <a href="profile.html" class="nav-item-animated">  
                <i class="fa-solid fa-user"></i><span>Profile</span>  
            </a>  
        </div>  
    </div>

    <script>  
        const items = document.querySelectorAll(".nav-item-animated");  
        const indicator = document.querySelector(".indicator");  
        function moveIndicator(el){  
            if (!el) return;
            const left = el.offsetLeft + (el.offsetWidth / 2) - (indicator.offsetWidth / 2);  
            indicator.style.left = left + "px";  
            items.forEach(i => i.classList.remove("active"));  
            el.classList.add("active");  
        }  
        items.forEach(item => { item.addEventListener("click", () => moveIndicator(item)); });  
        window.onload = () => moveIndicator(document.querySelector(".nav-item-animated"));  
    </script>

    <!-- Firebase Script & Logic -->
    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { observeAuthState } from '../firebase/auth.js';
        import { doc, getDoc, updateDoc, increment, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let currentUserUid = null;

        observeAuthState(async (userData) => {
            if (userData) {
                currentUserUid = userData.uid;
                checkLastBonus(currentUserUid);
            } else {
                window.location.href = 'login.html';
            }
        });

        async function checkLastBonus(uid) {
            try {
                const userRef = doc(db, "users", uid);
                const userDoc = await getDoc(userRef);
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    const lastBonusTime = data.lastBonus?.toDate();
                    if (lastBonusTime) {
                        const now = new Date();
                        const diffHours = (now - lastBonusTime) / (1000 * 60 * 60);
                        if (diffHours < 24) {
                            const remainingHours = Math.ceil(24 - diffHours);
                            const btn = document.getElementById('claimBtn');
                            btn.disabled = true;
                            btn.classList.add('opacity-50', 'cursor-not-allowed');
                            document.getElementById('bonusMessage').innerHTML = `<span class="text-amber-600">You already claimed today's bonus! Next bonus available in ${remainingHours} hours.</span>`;
                        }
                    }
                }
            } catch (error) {
                console.error("Error checking bonus status:", error);
            }
        }

        window.claimBonus = async function() {
            if (!currentUserUid) return;
            const btn = document.getElementById('claimBtn');
            const msgDiv = document.getElementById('bonusMessage');
            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                const userRef = doc(db, "users", currentUserUid);
                
                // Update user main balance and lastBonus timestamp
                await updateDoc(userRef, {
                    mainBalance: increment(5.00),
                    lastBonus: serverTimestamp()
                });

                // Record in earnings collection
                await addDoc(collection(db, "earnings"), {
                    userId: currentUserUid,
                    title: "Daily Login Bonus",
                    amount: 5.00,
                    status: "approved",
                    timestamp: serverTimestamp()
                });

                msgDiv.innerHTML = `<span class="text-emerald-600 font-bold">Successfully claimed ৳ 5.00 bonus!</span>`;
                btn.innerText = "Claimed Successfully";
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            } catch (error) {
                console.error("Error claiming bonus:", error);
                msgDiv.innerHTML = `<span class="text-red-500">Failed to claim bonus. Try again later.</span>`;
                btn.disabled = false;
                btn.innerText = "Claim Bonus Now";
            }
        }
    </script>
</body>
                </html>
