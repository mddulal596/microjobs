<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Micro Job Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>  
    
    <style>
        .nav-container {  
            position: fixed;  
            bottom: 15px;  
            left: 50%;
            transform: translateX(-50%);
            width: 92%;  
            max-width: 440px;  
            height: 70px;  
            background: #4f46e5;  
            border-radius: 22px;  
            display: flex;  
            justify-content: space-around;  
            align-items: center;  
            box-shadow: 0 10px 25px rgba(0,0,0,.2);  
            overflow: visible;  
            z-index: 100;
        }  
        .nav-item-animated {  
            flex: 1;  
            text-decoration: none;  
            color: #fff;  
            text-align: center;  
            position: relative;  
            z-index: 2;  
        }  
        .nav-item-animated i {  
            font-size: 22px;  
            transition: .25s;  
        }  
        .nav-item-animated span {  
            display: block;  
            font-size: 11px;  
            margin-top: 4px;  
            transition: .25s;  
        }  
        .nav-item-animated.active i {  
            transform: translateY(-10px);  
        }  
        .nav-item-animated.active span {  
            font-weight: bold;  
        }  
        .indicator {  
            position: absolute;  
            top: -15px;  
            width: 60px;  
            height: 60px;  
            background: #312e81;  
            border-radius: 50%;  
            border: 4px solid #fff;  
            transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1);  
            box-shadow: 0 0 20px rgba(49,46,129,.5);  
            z-index: 1;  
        }  
        .indicator::before {  
            content: "";  
            position: absolute;  
            inset: -6px;  
            border-radius: 50%;  
            border: 2px solid rgba(49,46,129,.4);  
            animation: pulse 2s infinite;  
        }  
        @keyframes pulse {  
            0% { transform: scale(1); opacity: 1; }  
            100% { transform: scale(1.4); opacity: 0; }  
        } 
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-28">
        
        <!-- Top Header & Balances -->
        <header class="p-5 bg-gradient-to-r from-purple-600 to-indigo-700 text-white rounded-b-3xl shadow-lg">
            <div class="flex justify-between items-center mb-4">
                <a href="profile.html" class="flex items-center gap-2 bg-white/15 border border-white/30 px-3 py-1.5 rounded-full text-white text-xs font-bold hover:bg-white/25 transition">
                    <div id="profileIconBtn" class="w-6 h-6 bg-white text-purple-700 rounded-full flex items-center justify-center text-[11px] font-black">U</div>
                    <span id="userNameDisplay">Loading...</span>
                </a>
                <a href="dashboard.html" class="bg-white/15 px-4 py-1.5 rounded-full text-white text-xs font-bold hover:bg-white/25 transition">Home</a>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/20">
                    <p class="text-[11px] text-purple-200 font-medium mb-1">Main Balance</p>
                    <h2 id="mainBalance" class="text-lg font-extrabold">৳ 0.00</h2>
                </div>
                <div class="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/20">
                    <p class="text-[11px] text-purple-200 font-medium mb-1">Deposit Balance</p>
                    <h2 id="depositBalance" class="text-lg font-extrabold">৳ 0.00</h2>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="p-4 flex-grow">
            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3 px-1">Top 50 Earners Leaderboard</h2>

            <!-- Leaderboard List Container -->
            <div class="bg-gray-50 border border-gray-200 rounded-2xl p-3 flex flex-col gap-2.5" id="leaderboardList">
                <div class="flex items-center justify-between p-3 bg-white border border-gray-200 rounded-xl shadow-sm hover:border-indigo-500 transition">
                    <div class="flex items-center gap-3">
                        <div class="w-7 h-7 bg-yellow-100 text-yellow-800 font-extrabold text-xs rounded-full flex items-center justify-center">1</div>
                        <div>
                            <h4 class="text-xs font-bold text-gray-800">Rahim Ahmed</h4>
                            <p class="text-[10px] text-gray-500">Completed 340 Tasks</p>
                        </div>
                    </div>
                    <div class="text-xs font-extrabold text-emerald-600">৳ 4,500.00</div>
                </div>

                <div class="flex items-center justify-between p-3 bg-white border border-gray-200 rounded-xl shadow-sm hover:border-indigo-500 transition">
                    <div class="flex items-center gap-3">
                        <div class="w-7 h-7 bg-slate-200 text-slate-700 font-extrabold text-xs rounded-full flex items-center justify-center">2</div>
                        <div>
                            <h4 class="text-xs font-bold text-gray-800">Tanvir Hossain</h4>
                            <p class="text-[10px] text-gray-500">Completed 290 Tasks</p>
                        </div>
                    </div>
                    <div class="text-xs font-extrabold text-emerald-600">৳ 3,850.00</div>
                </div>

                <div class="flex items-center justify-between p-3 bg-white border border-gray-200 rounded-xl shadow-sm hover:border-indigo-500 transition">
                    <div class="flex items-center gap-3">
                        <div class="w-7 h-7 bg-amber-100 text-amber-800 font-extrabold text-xs rounded-full flex items-center justify-center">3</div>
                        <div>
                            <h4 class="text-xs font-bold text-gray-800">Karim Uddin</h4>
                            <p class="text-[10px] text-gray-500">Completed 250 Tasks</p>
                        </div>
                    </div>
                    <div class="text-xs font-extrabold text-emerald-600">৳ 3,120.00</div>
                </div>
            </div>
        </main>

        <!-- Animated Bottom Navigation Bar -->
        <div class="nav-container">  
            <div class="indicator"></div>  
            <a href="https://t.me/microjobspro" target="_blank" class="nav-item-animated">  
                <i class="fa-solid fa-headset"></i><span>Help</span>  
            </a>  
            <a href="wallet.html" class="nav-item-animated">  
                <i class="fa-solid fa-wallet"></i><span>Wallet</span>  
            </a>  
            <a href="dashboard.html" class="nav-item-animated">  
                <i class="fa-solid fa-house"></i><span>Home</span>  
            </a>  
            <a href="referral.html" class="nav-item-animated">  
                <i class="fa-solid fa-user-group"></i><span>Team</span>  
            </a>  
            <a href="profile.html" class="nav-item-animated">  
                <i class="fa-solid fa-user"></i><span>Profile</span>  
            </a>  
        </div>  
    </div>

    <!-- Navigation Animation Script -->
    <script>  
        const items = document.querySelectorAll(".nav-item-animated");  
        const indicator = document.querySelector(".indicator");  
        
        function moveIndicator(el){  
            if (!el) return;
            const left = el.offsetLeft + (el.offsetWidth / 2) - (indicator.offsetWidth / 2);  
            indicator.style.left = left + "px";  
            items.forEach(i => i.classList.remove("active"));  
            el.classList.add("active");  
        }  
        
        items.forEach(item => { item.addEventListener("click", () => moveIndicator(item)); });  
        
        // যেহেতু এই পেজটি সরাসরি নেভবারের কোনো নির্দিষ্ট আইটেমের সাথে সরাসরি ম্যাপ করা নয়, তাই ডিফল্টভাবে কোনোটি সিলেক্ট রাখতে পারেন বা হোমে রাখতে পারেন। তবে ইউজার যেটাতে ক্লিক করবে সেটা একটিভ হবে।
        const activeItem = document.querySelector(".nav-item-animated.active") || items[2]; // ডিফল্ট হোম সিলেক্ট রাখা হয়েছে
        moveIndicator(activeItem);

        window.addEventListener('resize', () => {
            const currentActive = document.querySelector(".nav-item-animated.active");
            if(currentActive) moveIndicator(currentActive);
        });
    </script>

    <!-- Firebase Script & Logic -->
    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { observeAuthState } from '../firebase/auth.js';
        import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        observeAuthState((user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const userDocRef = doc(db, "users", user.uid);
            onSnapshot(userDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const name = data.fullName || user.displayName || "User";
                    document.getElementById('userNameDisplay').innerText = name;
                    document.getElementById('profileIconBtn').innerText = name.charAt(0).toUpperCase();

                    const mainBal = Number(data.balances?.main ?? data.mainBalance ?? 0);
                    const depositBal = Number(data.depositBalance ?? 0);

                    document.getElementById('mainBalance').innerText = `৳ ${mainBal.toFixed(2)}`;
                    document.getElementById('depositBalance').innerText = `৳ ${depositBal.toFixed(2)}`;
                }
            });
        });
    </script>
</body>
</html>
