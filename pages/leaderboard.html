<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Micro Job Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>  
    
    <style>
        .nav-container {  
            position: fixed;  
            bottom: 15px;  
            left: 50%;
            transform: translateX(-50%);
            width: 92%;  
            max-width: 440px;  
            height: 70px;  
            background: #4f46e5;  
            border-radius: 22px;  
            display: flex;  
            justify-content: space-around;  
            align-items: center;  
            box-shadow: 0 10px 25px rgba(0,0,0,.2);  
            overflow: visible;  
            z-index: 100;
        }  
        .nav-item-animated {  
            flex: 1;  
            text-decoration: none;  
            color: #fff;  
            text-align: center;  
            position: relative;  
            z-index: 2;  
        }  
        .nav-item-animated i {  
            font-size: 22px;  
            transition: .25s;  
        }  
        .nav-item-animated span {  
            display: block;  
            font-size: 11px;  
            margin-top: 4px;  
            transition: .25s;  
        }  
        .nav-item-animated.active i {  
            transform: translateY(-10px);  
        }  
        .nav-item-animated.active span {  
            font-weight: bold;  
        }  
        .indicator {  
            position: absolute;  
            top: -15px;  
            width: 60px;  
            height: 60px;  
            background: #312e81;  
            border-radius: 50%;  
            border: 4px solid #fff;  
            transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1);  
            box-shadow: 0 0 20px rgba(49,46,129,.5);  
            z-index: 1;  
        }  
        .indicator::before {  
            content: "";  
            position: absolute;  
            inset: -6px;  
            border-radius: 50%;  
            border: 2px solid rgba(49,46,129,.4);  
            animation: pulse 2s infinite;  
        }  
        @keyframes pulse {  
            0% { transform: scale(1); opacity: 1; }  
            100% { transform: scale(1.4); opacity: 0; }  
        } 
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-36">
        
        <!-- Top Header & Balances -->
        <header class="p-5 bg-gradient-to-r from-purple-600 to-indigo-700 text-white rounded-b-3xl shadow-lg relative">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2 bg-white/15 border border-white/30 px-3.5 py-1.5 rounded-full text-white text-xs font-bold">
                    <div id="profileIconBtn" class="w-6 h-6 bg-white text-purple-700 rounded-full flex items-center justify-center text-[11px] font-black">U</div>
                    <span id="userNameDisplay" class="truncate max-w-[120px]">Loading...</span>
                </div>
                <a href="dashboard.html" class="bg-white/25 hover:bg-white/35 transition px-4 py-1.5 rounded-full text-white text-xs font-bold shadow">Home</a>
            </div>

            <!-- Balances Cards -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-purple-800/50 p-3 rounded-2xl backdrop-blur-sm border border-purple-400/30">
                    <p class="text-[10px] text-purple-200 font-medium">Main Balance</p>
                    <h2 id="mainBalance" class="text-base font-extrabold mt-0.5">৳ 0.00</h2>
                </div>
                <div class="bg-purple-800/50 p-3 rounded-2xl backdrop-blur-sm border border-purple-400/30">
                    <p class="text-[10px] text-purple-200 font-medium">Deposit Balance</p>
                    <h2 id="depositBalance" class="text-base font-extrabold mt-0.5">৳ 0.00</h2>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="p-4 flex-grow">
            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3 px-1">Top 50 Earners Leaderboard</h2>

            <!-- Leaderboard List Container (রিয়েল ইউজার ডাটা এখানে লোড হবে) -->
            <div class="bg-gray-50 border border-gray-200 rounded-2xl p-3 flex flex-col gap-2.5" id="leaderboardList">
                <p class="text-center text-xs text-gray-400 py-6">Loading leaderboard...</p>
            </div>
        </main>

        <!-- Animated Bottom Navigation Bar -->
        <div class="nav-container">  
            <div class="indicator"></div>  
            <a href="https://t.me/microjobspro" target="_blank" class="nav-item-animated">  
                <i class="fa-solid fa-headset"></i><span>Help</span>  
            </a>  
            <a href="wallet.html" class="nav-item-animated">  
                <i class="fa-solid fa-wallet"></i><span>Wallet</span>  
            </a>  
            <a href="dashboard.html" class="nav-item-animated">  
                <i class="fa-solid fa-house"></i><span>Home</span>  
            </a>  
            <a href="referral.html" class="nav-item-animated">  
                <i class="fa-solid fa-user-group"></i><span>Team</span>  
            </a>  
            <a href="profile.html" class="nav-item-animated">  
                <i class="fa-solid fa-user"></i><span>Profile</span>  
            </a>  
        </div>  
    </div>

    <!-- Navigation Animation Script -->
    <script>  
        const items = document.querySelectorAll(".nav-item-animated");  
        const indicator = document.querySelector(".indicator");  
        
        function moveIndicator(el){  
            if (!el) return;
            const left = el.offsetLeft + (el.offsetWidth / 2) - (indicator.offsetWidth / 2);  
            indicator.style.left = left + "px";  
            items.forEach(i => i.classList.remove("active"));  
            el.classList.add("active");  
        }  
        
        items.forEach(item => { item.addEventListener("click", () => moveIndicator(item)); });  
        
        const activeItem = document.querySelector(".nav-item-animated.active") || items[2];
        moveIndicator(activeItem);

        window.addEventListener('resize', () => {
            const currentActive = document.querySelector(".nav-item-animated.active");
            if(currentActive) moveIndicator(currentActive);
        });
    </script>

    <!-- Firebase Script & Logic -->
    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { observeAuthState } from '../firebase/auth.js';
        import { doc, onSnapshot, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ১. ইউজারের লাইভ ব্যালেন্স এবং প্রোফাইল ইনফো লোড করা
        observeAuthState((user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const userDocRef = doc(db, "users", user.uid);
            onSnapshot(userDocRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const name = data.fullName || user.displayName || "User";
                    document.getElementById('userNameDisplay').innerText = name;
                    document.getElementById('profileIconBtn').innerText = name.charAt(0).toUpperCase();

                    const mainBal = Number(data.balances?.main ?? data.mainBalance ?? 0);
                    const depositBal = Number(data.depositBalance ?? 0);

                    document.getElementById('mainBalance').innerText = `৳ ${mainBal.toFixed(2)}`;
                    document.getElementById('depositBalance').innerText = `৳ ${depositBal.toFixed(2)}`;
                }
            });
        });

        // ২. ফায়ারবেস থেকে রিয়েল ইউজারদের নিয়ে লিডারবোর্ড তৈরি করা
        async function loadLeaderboard() {
            const leaderboardContainer = document.getElementById('leaderboardList');

            try {
                const usersRef = collection(db, "users");
                // মেইন ব্যালেন্সের ওপর ভিত্তি করে টপ ৫০ জন ইউজারের কুয়েরি
                const q = query(usersRef, orderBy("balances.main", "desc"), limit(50));
                const querySnapshot = await getDocs(q);

                leaderboardContainer.innerHTML = "";
                let rank = 1;

                if (querySnapshot.empty) {
                    leaderboardContainer.innerHTML = `<p class='text-center text-xs text-gray-400 py-4'>No users found on leaderboard yet.</p>`;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const userData = docSnap.data();
                    const name = userData.fullName || userData.displayName || "User";
                    const mainBalance = Number(userData.balances?.main ?? userData.mainBalance ?? 0);
                    const completedTasks = userData.completedTasksCount || 0;

                    // র‍্যাংক অনুযায়ী মেডেল বা কালার ডিজাইন
                    let badgeBg = "bg-gray-100 text-gray-700";
                    if (rank === 1) badgeBg = "bg-yellow-100 text-yellow-800 font-extrabold";
                    else if (rank === 2) badgeBg = "bg-slate-200 text-slate-700 font-extrabold";
                    else if (rank === 3) badgeBg = "bg-amber-100 text-amber-800 font-extrabold";

                    const itemHTML = `
                        <div class="flex items-center justify-between p-3 bg-white border border-gray-200 rounded-xl shadow-sm hover:border-indigo-500 transition">
                            <div class="flex items-center gap-3">
                                <div class="w-7 h-7 ${badgeBg} text-xs rounded-full flex items-center justify-center">${rank}</div>
                                <div>
                                    <h4 class="text-xs font-bold text-gray-800">${name}</h4>
                                    <p class="text-[10px] text-gray-500">Completed ${completedTasks} Tasks</p>
                                </div>
                            </div>
                            <div class="text-xs font-extrabold text-emerald-600">৳ ${mainBalance.toFixed(2)}</div>
                        </div>
                    `;
                    leaderboardContainer.innerHTML += itemHTML;
                    rank++;
                });

            } catch (error) {
                console.error("Error loading leaderboard:", error);
                leaderboardContainer.innerHTML = `<p class='text-center text-xs text-red-400 py-4'>Failed to load leaderboard data.</p>`;
            }
        }

        // পেজ লোড হওয়ার সাথে সাথে লিডারবোর্ড ফেচ হবে
        loadLeaderboard();
    </script>
</body>
</html>
