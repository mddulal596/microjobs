<!DOCTYPE html>
<html lang="en" class="transform-gpu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Complete - Micro Job Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 antialiased transform-gpu">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between pb-24">
        
        <!-- Top Header -->
        <header class="p-4 bg-indigo-600 text-white rounded-b-3xl shadow-md flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="profile.html" class="w-8 h-8 bg-indigo-700/80 rounded-full flex items-center justify-center text-white hover:bg-indigo-700 transition">
                    ←
                </a>
                <h1 class="text-sm font-extrabold tracking-wide">Completed Tasks</h1>
            </div>
            <div class="flex items-center">
                <a href="profile.html" class="flex items-center gap-1.5 bg-indigo-700/80 border border-indigo-400/40 px-2.5 py-1 rounded-full shadow-inner">
                    <div id="profileIconBtn" class="w-5 h-5 bg-white text-indigo-600 rounded-full flex items-center justify-center text-[10px] font-extrabold">
                        U
                    </div>
                    <span id="userNameDisplay" class="text-[11px] font-bold tracking-wide truncate max-w-[80px]">Loading</span>
                </a>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="p-4 flex-grow space-y-3 overflow-y-auto">
            
            <div class="space-y-1 mb-2">
                <h2 class="text-xs font-bold text-gray-700 uppercase tracking-wide">Approved & Completed Tasks</h2>
                <p class="text-[11px] text-gray-500 leading-relaxed">
                    Here are all the tasks that have been successfully verified and paid to your balance.
                </p>
            </div>

            <!-- Task Complete List Container -->
            <div id="completedTasksList" class="space-y-2.5">
                <!-- Dynamic Loading State -->
                <div class="bg-gray-50 border border-gray-200 p-4 rounded-2xl text-center text-xs text-gray-500 shadow-sm">
                    Loading completed tasks...
                </div>
            </div>

        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-2 bg-white border-t border-gray-200 shadow-lg flex justify-around items-center">
            <a href="https://t.me/microjobspro" target="_blank" class="flex flex-col items-center text-gray-500 hover:text-indigo-600 text-[10px]">
                <span class="text-lg">🎧</span>
                <span>Help</span>
            </a>
            <a href="deposit.html" class="flex flex-col items-center text-gray-500 hover:text-indigo-600 text-[10px]">
                <span class="text-lg">👛</span>
                <span>Wallet</span>
            </a>
            <a href="dashboard.html" class="flex flex-col items-center text-gray-500 hover:text-indigo-600 text-[10px]">
                <div class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 text-base">
                    🏠
                </div>
                <span class="font-medium mt-0.5">Home</span>
            </a>
            <a href="referral.html" class="flex flex-col items-center text-gray-500 hover:text-indigo-600 text-[10px]">
                <div class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 text-base">
                    👥
                </div>
                <span class="font-medium mt-0.5">Team</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center text-indigo-600 text-[10px] -mt-4">
                <div class="w-12 h-12 bg-indigo-600 rounded-full flex items-center justify-center text-white shadow-lg border-4 border-white text-lg">
                    👤
                </div>
                <span class="font-bold mt-0.5">Profile</span>
            </a>
        </nav>
    </div>

    <!-- Firebase Script & Logic -->
    <script type="module">
        import { db } from '../firebase/firebase-config.js';
        import { observeAuthState } from '../firebase/auth.js';
        import { collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        observeAuthState(async (userData) => {
            if (userData) {
                const name = userData.displayName || "User";
                document.getElementById('profileIconBtn').innerText = name.charAt(0).toUpperCase();
                document.getElementById('userNameDisplay').innerText = name;

                // Fetch Completed Tasks from Firestore (Submissions collection where status == 'approved' or 'completed')
                await fetchCompletedTasks(userData.uid);
            } else {
                window.location.href = 'login.html';
            }
        });

        async function fetchCompletedTasks(uid) {
            const container = document.getElementById('completedTasksList');
            try {
                // Adjust collection name/query according to your project structure (e.g., 'submissions' or 'taskSubmissions')
                const q = query(
                    collection(db, "submissions"), 
                    where("userId", "==", uid),
                    where("status", "in", ["approved", "completed"])
                );
                
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    container.innerHTML = `
                        <div class="bg-gray-50 border border-gray-200 p-6 rounded-2xl text-center space-y-2 shadow-sm">
                            <span class="text-3xl">📭</span>
                            <p class="text-xs font-bold text-gray-600">No Completed Tasks Found</p>
                            <p class="text-[11px] text-gray-400">You haven't completed any tasks yet or they are still under review.</p>
                        </div>
                    `;
                    return;
                }

                let html = "";
                querySnapshot.forEach((doc) => {
                    const task = doc.data();
                    const title = task.taskTitle || task.title || "Micro Job Task";
                    const reward = task.reward || task.amount || 0;
                    const date = task.completedAt?.toDate ? task.completedAt.toDate().toLocaleDateString() : "Recently";

                    html += `
                        <div class="bg-gray-50 border border-gray-200 p-3.5 rounded-2xl flex items-center justify-between shadow-sm">
                            <div class="space-y-0.5 overflow-hidden pr-2">
                                <h3 class="text-xs font-bold text-gray-800 truncate">${title}</h3>
                                <p class="text-[10px] text-gray-400">Completed on: ${date}</p>
                            </div>
                            <div class="text-right flex-shrink-0">
                                <span class="text-xs font-extrabold text-green-600">+৳ ${Number(reward).toFixed(2)}</span>
                                <span class="block text-[9px] bg-green-100 text-green-700 font-bold px-2 py-0.5 rounded-full mt-1">Approved</span>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

            } catch (error) {
                console.error("Error fetching completed tasks:", error);
                container.innerHTML = `
                    <div class="bg-red-50 border border-red-200 p-4 rounded-2xl text-center text-xs text-red-600 shadow-sm">
                        Failed to load completed tasks. Please try again later.
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
